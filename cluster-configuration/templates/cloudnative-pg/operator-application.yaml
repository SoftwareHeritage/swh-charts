{{ if .Values.cloudnativePg.enabled -}}
{{- $appName := print .Values.clusterName "-cnpg-operator" -}}
{{- $prune := .Values.cloudnativePg.argocdApplication.prune | default .Values.defaultPrune | quote -}}
{{- $selfHeal := .Values.cloudnativePg.argocdApplication.selfHeal | default .Values.defaultSelfHeal | quote -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $appName }}
  namespace: {{ .Values.argocd.namespace }}
spec:
  revisionHistoryLimit: 2
  project: {{ .Values.defaultProject }}
  source:
    chart: cloudnative-pg
    repoURL: https://cloudnative-pg.github.io/charts
    targetRevision: {{ .Values.cloudnativePg.version }}
    helm:
      # must match the application name (https://github.com/argoproj/argo-cd/issues/2871)
      releaseName: {{ $appName }}
      values: |
        monitoring:
          podMonitorEnabled: true
  destination:
    server: {{ .Values.clusterUrl }}
    namespace: {{ .Values.cloudnativePg.namespace | default "cnpg-system" | quote }}
  syncPolicy:
    automated:
      prune: {{ $prune }}
      selfHeal: {{ $selfHeal }}
    syncOptions:
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].namespaceSelector.matchExpressions
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].namespaceSelector.matchExpressions
{{ end }}
