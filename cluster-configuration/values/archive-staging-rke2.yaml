environment: staging
clusterName: archive-staging-rke2
clusterUrl: https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/c-m-9n5h9nrf

clusterConfiguration:
  selfHeal: true

metallb:
  enabled: true

ingressNginx:
  enabled: true
  applicationNameOverride: archive-staging-rke2-ingress-nginx
  defaultClass: true
  watchIngressWithoutClass: true
  allowSnippetAnnotations: true
  serviceAnnotations:
    # To be able to share the same ip for several services
    # https://metallb.org/usage/#ip-address-sharing
    metallb.universe.tf/allow-shared-ip: clusterIP
  requestedCpu: 50m
  requestedMemory: 200Mi
  config:
    worker-processes: 5
    # Make NGINX forwards the X-Forwarded-* headers
    use-forwarded-headers: true
  replicaCount: 6
  nodeSelector:
    ingress-controller: "true"

certManager:
  enabled: true
  webhookGandiEnabled: true
  useGandiDNS: true

otlpCollector:
  enabled: true
  debug: false
  resources:
    cpu: 100m
    memory: 2Gi
    batch: 10
    timeout: 10s
  endpoints:
    - http://esnode7.internal.softwareheritage.org:9200
    - http://esnode8.internal.softwareheritage.org:9200
    - http://esnode9.internal.softwareheritage.org:9200

rabbitmq:
  enabled: true

cassandra:
  enabled: true

kafka:
  enabled: true

elasticsearch:
  enabled: true

redis:
  enabled: true

cloudnativePg:
  enabled: true

pgbouncer:
  enabled: true
  userlist:
    enabled: true
    secret: pgbouncer-userlist-secret
  databases:
    swh:
      host: db-swh-rw
      port: 5432
      dbname: swh
      auth_user: postgres
    swh-coar-notify:
      host: db-swh-coar-notify-rw
      port: 5432
      dbname: swh-coar-notify
      auth_user: postgres
    swh-deposit:
      host: db-swh-deposit-rw
      port: 5432
      dbname: swh-deposit
      auth_user: postgres
    swh-indexer:
      host: db-swh-indexer-rw
      port: 5432
      dbname: swh-indexer
      auth_user: postgres
    swh-masking:
      host: db-swh-masking-rw
      port: 5432
      dbname: swh-masking
      auth_user: postgres
    swh-scrubber:
      host: db-swh-scrubber-rw
      port: 5432
      dbname: swh-scrubber
      auth_user: postgres
    swh-scheduler:
      host: db-swh-scheduler-rw
      port: 5432
      dbname: swh-scheduler
      auth_user: postgres
    swh-svix:
      host: db-swh-svix-rw
      port: 5432
      dbname: swh-svix
      auth_user: postgres
    swh-vault:
      host: db-swh-vault-rw
      port: 5432
      dbname: swh-vault
      auth_user: postgres
    swh-web:
      host: db-swh-web-rw
      port: 5432
      dbname: swh-web
      auth_user: postgres

vaultSecretsOperator:
  enabled: true
  defaultVaultConnection:
    enabled: true
    address: https://openbao.internal.admin.swh.network
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: vault-secrets-operator
            operator: In
            values:
            - "true"

osporadar:
  enabled: true
  version: mr/external-tls
  valuesOverride:
    # Database secret references (created in openbao)
    secretNameRef: swh-osporadar-secret
    postgres:
      service:
        host: db-osporadar-rw
    # Enable the ingress
    ingress:
      enabled: true
      # Set to true when TLS is handled by a reverse-proxy in front of the ingress
      externalTls: true
      annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/auth-type: basic
        nginx.ingress.kubernetes.io/auth-secret-type: auth-file
        nginx.ingress.kubernetes.io/auth-realm: "OSPO-RADAR Authentication Required"
        nginx.ingress.kubernetes.io/auth-secret: osporadar-basic-auth
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/proxy-body-size: 128K
        nginx.ingress.kubernetes.io/proxy-buffering: "on"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
        nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "60"

      hosts:
        - host: osporadar.internal.staging.swh.network
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: swh-osporadar-django-service
                  port:
                    number: 8000
        - host: osporadar.staging.swh.network
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: swh-osporadar-django-service
                  port:
                    number: 8000
    # For devfixtures to be installed at least for now
    # We will see later to have a clean environment
    development:
      enabled: true
      debug: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: "swh/osporadar"
              operator: In
              values:
              - "true"
