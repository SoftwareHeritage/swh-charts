environment: staging
clusterName: archive-staging-rke2
clusterUrl: https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/c-m-9n5h9nrf

clusterConfiguration:
  selfHeal: true

metallb:
  enabled: true

ingressNginx:
  enabled: true
  applicationNameOverride: archive-staging-rke2-ingress-nginx
  defaultClass: true
  watchIngressWithoutClass: true
  allowSnippetAnnotations: true
  serviceAnnotations:
    # To be able to share the same ip for several services
    # https://metallb.org/usage/#ip-address-sharing
    metallb.universe.tf/allow-shared-ip: clusterIP
  requestedCpu: 50m
  requestedMemory: 200Mi
  config:
    worker-processes: 5
    # Make NGINX forwards the X-Forwarded-* headers
    use-forwarded-headers: true
  replicaCount: 6
  nodeSelector:
    ingress-controller: "true"

certManager:
  enabled: true
  webhookGandiEnabled: true
  useGandiDNS: true

otlpCollector:
  enabled: true
  debug: false
  resources:
    cpu: 100m
    memory: 2Gi
    batch: 10
    timeout: 10s
  endpoints:
    - http://esnode1.internal.softwareheritage.org:9200
    - http://esnode2.internal.softwareheritage.org:9200
    - http://esnode3.internal.softwareheritage.org:9200
    - http://esnode7.internal.softwareheritage.org:9200

rabbitmq:
  enabled: true

cassandra:
  enabled: true

kafka:
  enabled: true

elasticsearch:
  enabled: true

redis:
  enabled: true

cloudnativePg:
  enabled: true

pgbouncer:
  enabled: true
  userlist:
    enabled: true
    secret: pgbouncer-userlist-secret
  databases:
    swh:
      host: db-swh-rw
      port: 5432
      dbname: swh
      auth_user: postgres
    swh-coar-notify:
      host: db-swh-coar-notify-rw
      port: 5432
      dbname: swh-coar-notify
      auth_user: postgres
    swh-deposit:
      host: db-swh-deposit-rw
      port: 5432
      dbname: swh-deposit
      auth_user: postgres
    swh-indexer:
      host: db-swh-indexer-rw
      port: 5432
      dbname: swh-indexer
      auth_user: postgres
    swh-scrubber:
      host: db-swh-scrubber-rw
      port: 5432
      dbname: swh-scrubber
      auth_user: postgres
    swh-scheduler:
      host: db-swh-scheduler-rw
      port: 5432
      dbname: swh-scheduler
      auth_user: postgres
    swh-svix:
      host: db-swh-svix-rw
      port: 5432
      dbname: swh-svix
      auth_user: postgres
    swh-vault:
      host: db-swh-vault-rw
      port: 5432
      dbname: swh-vault
      auth_user: postgres
    swh-web:
      host: db-swh-web-rw
      port: 5432
      dbname: swh-web
      auth_user: postgres
