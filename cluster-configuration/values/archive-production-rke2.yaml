environment: production
clusterName: archive-production-rke2
clusterUrl: https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/c-m-75xcg59s

clusterConfiguration:
  selfHeal: true

metallb:
  enabled: true
  values:
    # Install any extra configuration to pass along to the helm chart
    # e.g. https://github.com/helm/charts/blob/master/stable/metallb/values.yaml#L106
    speaker:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                # No metallb speaker pod on node with following label (with any value)
                - key: "noMetallbSpeaker"
                  operator: DoesNotExist

ingressNginx:
  enabled: true
  applicationNameOverride: archive-production-rke2-ingress-nginx
  defaultClass: true
  watchIngressWithoutClass: true
  serviceAnnotations:
    # To be able to share the same ip for several services
    # https://metallb.org/usage/#ip-address-sharing
    metallb.universe.tf/allow-shared-ip: clusterIP
  requestedCpu: 75m
  requestedMemory: 200Mi
  config:
    worker-processes: 6
    # Make NGINX forwards the X-Forwarded-* headers
    use-forwarded-headers: true
  replicaCount: 6
  nodeSelector:
    ingress-controller: "true"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - saam
                  - banco

certManager:
  enabled: true
  webhookGandiEnabled: true
  useGandiDNS: true

otlpCollector:
  enabled: true
  debug: false
  resources:
    cpu: 1024m
    memory: 8Gi
    batch: 50
    timeout: 10s
  endpoints:
    - http://esnode7.internal.softwareheritage.org:9200
    - http://esnode8.internal.softwareheritage.org:9200
    - http://esnode9.internal.softwareheritage.org:9200

redis:
  enabled: true

cloudnativePg:
  enabled: true

pgbouncer:
  enabled: true
  userlist:
    enabled: true
    secret: pgbouncer-userlist-secret
  databases:
    swh-vault:
      host: db-swh-vault-ro
      port: 5432
      dbname: swh-vault
      auth_user: postgres
    swh-deposit:
      host: db-swh-deposit-ro
      port: 5432
      dbname: swh-deposit
      auth_user: postgres
    swh-scrubber:
      host: db-swh-scrubber-ro
      port: 5432
      dbname: swh-scrubber
      auth_user: postgres
    swh-web:
      host: db-swh-web-ro
      port: 5432
      dbname: swh-web
      auth_user: postgres
    swh-svix:
      host: db-swh-svix-ro
      port: 5432
      dbname: swh-svix
      auth_user: postgres
    swh-scheduler:
      host: db-swh-scheduler-r
      port: 5432
      dbname: swh-scheduler
      auth_user: postgres
    swh-masking:
      host: db-swh-masking-ro
      port: 5432
      dbname: swh-masking
      auth_user: postgres

vaultSecretsOperator:
  enabled: true
  defaultVaultConnection:
    enabled: true
    address: https://openbao.internal.admin.swh.network
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: vault-secrets-operator
            operator: In
            values:
            - "true"
