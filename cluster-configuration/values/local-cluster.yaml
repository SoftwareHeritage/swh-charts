environment: test
clusterName: local
clusterUrl: https://kubernetes.default.svc

# This enables the argocd applications for tests purposes [1] [2].
# [1] make ccf-template
# [2] make ccf-helm-diff

# This is not used by default as the argocd application might not be installed in your
# local-cluster (disabled by default to reduce required resources needed to run on your
# machine).

# This yaml can be used if you add the following to your
# local-cluster-ccf.override.yaml. Then trigger the deps installation [3] and finally
# let argocd deploy the argocd applications [4]
#
# ```yaml
# argocd:
#   enabled: true
# ```
# [3] make local-cluster-install-deps
# [4] make local-cluster-ccf

argocd:
  # When enabled, this installs a default argocd application
  # NOT FOR PRODUCTION
  enabled: false
  version: v3.2.3

metallb:
  enabled: false

rabbitmq:
  enabled: false

cloudnative-pg:
  # To match the enabled flag to true, use the following cli:
  # helm repo add cnpg https://cloudnative-pg.github.io/charts
  # helm --kube-context $CLUSTER_CONTEXT upgrade --install cloudnative-pg \
  #   --namespace cnpg-system \
  #   --create-namespace \
  #   cnpg/cloudnative-pg
  enabled: false

kafka:
  # To match the enabled flag to true, use the following cli:
  # helm repo add strimzi https://strimzi.io/charts/
  # helm --kube-context $CLUSTER_CONTEXT upgrade --install kafka-operator \
  #   --namespace kafka-system \
  #   --create-namespace \
  #   strimzi/strimzi-kafka-operator \
  #   --set watchAnyNamespace=true
  enabled: false

cassandra:
  # To match the enabled flag to true, use the following cli:
  # helm repo add k8ssandra https://helm.k8ssandra.io/stable
  # helm repo add jetstack https://charts.jetstack.io
  # helm --kube-context $CLUSTER_CONTEXT upgrade --install cert-manager \
  #   jetstack/cert-manager \
  #   --namespace cert-manager --create-namespace \
  #   --set installCRDs=true
  # helm --kube-context $CLUSTER_CONTEXT upgrade --install k8ssandra-operator \
  #   k8ssandra/k8ssandra-operator \
  #   -n k8ssandra-operator --create-namespace \
  #   --set global.clusterScoped=true
  enabled: false

elasticsearch:
  # To match the enabled flag to true, use the following cli:
  # helm repo add elastic https://helm.elastic.co
  # helm --kube-context $CLUSTER_CONTEXT upgrade --install eck-operator \
  #   elastic/eck-operator \
  #   --namespace elastic-system --create-namespace
  enabled: false

redis:
  # To match the enabled flag to true, use the following cli:
  # helm repo add ot-helm https://ot-container-kit.github.io/helm-charts/
  # helm --kube-context $CLUSTER_CONTEXT upgrade --install redis-operator \
  #   ot-helm/redis-operator \
  #   --namespace ot-operators --create-namespace
  enabled: false
  namespace: ot-operators

pgbouncer:
  enabled: false
  servicePort: 5432
  userlist:
    secret: swh-guest-postgresql-secret
  databases:
    archive:
      dbname: archive
      host: archive-rw
      port: 5432
      auth_user: postgres

netbox:
  enabled: false
  namespace: swh
  config:
    postgresql:
      enabled: false

    externalDatabase:
      host: db-netbox-rw.swh.svc.cluster.local
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-postgresql-secret
      existingSecretKey: password
    exemptViewPermissions:
      - "*"
    email:
      server: smtp.dummy.org
      port: 25
      username: ''
      from: inventory-bot@dummy.org
      useTLS: false
      useSSL: false
      timeout: 10
