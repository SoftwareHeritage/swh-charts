environment: admin
clusterName: admin-rke2
clusterUrl: https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/c-m-682nvssh

metallb:
  enabled: true

ingressNginx:
  enabled: true
  defaultClass: true
  watchIngressWithoutClass: true
  allowSnippetAnnotations: true
  serviceAnnotations:
    # To be able to share the same ip for several services
    # https://metallb.org/usage/#ip-address-sharing
    metallb.universe.tf/allow-shared-ip: internalIP
  requestedMemory: 100Mi
  config:
    worker-processes: 2
    # Make NGINX forwards the X-Forwarded-* headers
    use-forwarded-headers: true

certManager:
  enabled: true
  webhookGandiEnabled: true
  useGandiDNS: true

redis:
  enabled: true

cloudnativePg:
  enabled: true

netbox:
  enabled: true
  config:
    ## @param replicaCount Number of replicas to deploy
    ## NOTE: ReadWriteMany PVC(s) are required if replicaCount > 1
    replicaCount: 1
    global:
      # Global StorageClass for Persistent Volume(s)
      storageClass: cephfs
    persistence:
      # To adapt to ReadWriteMany if replicaCount > 1
      accessMode: ReadWriteOnce
    # Disable valkey which is a dependency on a bitnami chart (we avoid to deploy those)
    # This requires to enable a dedicated redis instance (named redis-netbox-kv)
    valkey:
      enabled: false
    tasksDatabase:
      host: redis-netbox-kv
    cachingDatabase:
      host: redis-netbox-kv
    # We deploy the postgresql instance through the cluster-component chart
    postgresql:
      enabled: false
    externalDatabase:
      host: db-netbox-rw.cnpg
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-postgresql-secret
      existingSecretKey: password
    exemptViewPermissions:
      - "*"
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: netbox.internal.admin.swh.network
          paths:
            - /
        - host: inventory.internal.admin.swh.network
          paths:
            - /
      annotations:
        kubernetes.io/tls-acme: "true"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        cert-manager.io/cluster-issuer: letsencrypt-production
        nginx.ingress.kubernetes.io/proxy-body-size: "4096m"
      tls:
      - secretName: admin-rke2-netbox-tls
        hosts:
          - netbox.internal.admin.swh.network
          - inventory.internal.admin.swh.network
    email:
      server: smtp.inria.fr
      port: 25
      username: ''
      from: inventory@softwareheritage.org
      useTLS: false
      useSSL: false
      timeout: 10

otlpCollector:
  enabled: true
  debug: false
  resources:
    cpu: 1024m
    memory: 8Gi
    batch: 10
    timeout: 10s
  endpoints:
    - http://esnode7.internal.softwareheritage.org:9200
    - http://esnode8.internal.softwareheritage.org:9200
    - http://esnode9.internal.softwareheritage.org:9200

openbao:
  enabled: true
  serverType: ha
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
    tls: true
    hosts:
      - openbao.internal.admin.swh.network
      - openbao.admin.swh.network

vaultSecretsOperator:
  enabled: true
  defaultVaultConnection:
    enabled: true
    address: https://openbao.internal.admin.swh.network
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: vault-secrets-operator
            operator: In
            values:
            - "true"

victorialogs:
  enabled: true
  storage:
    retentionPeriod: 30d
    replicaCount: 1
    volumes:
      size: 50G
      className: ceph-rbd
