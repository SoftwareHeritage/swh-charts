environment: admin
clusterName: admin-rke2
clusterUrl: https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/c-m-682nvssh

metallb:
  enabled: true

ingressNginx:
  enabled: true
  defaultClass: true
  watchIngressWithoutClass: true
  allowSnippetAnnotations: true
  serviceAnnotations:
    # To be able to share the same ip for several services
    # https://metallb.org/usage/#ip-address-sharing
    metallb.universe.tf/allow-shared-ip: internalIP
  requestedMemory: 100Mi
  config:
    worker-processes: 2
    # Make NGINX forwards the X-Forwarded-* headers
    use-forwarded-headers: true

certManager:
  enabled: true
  webhookGandiEnabled: true
  useGandiDNS: true

redis:
  enabled: true

cloudnativePg:
  enabled: true

netbox:
  enabled: true
  config:
    global:
      storageClass: cephfs
    postgresql:
      enabled: false
    externalDatabase:
      host: db-netbox-rw.cnpg
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-postgresql-secret
      existingSecretKey: password
    exemptViewPermissions:
      - "*"
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: netbox.internal.admin.swh.network
          paths:
            - /
      annotations:
        kubernetes.io/tls-acme: "true"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        cert-manager.io/cluster-issuer: letsencrypt-production
        nginx.ingress.kubernetes.io/proxy-body-size: "4096m"
      tls:
      - secretName: admin-rke2-netbox-tls
        hosts:
          - netbox.internal.admin.swh.network
    email:
      server: smtp.inria.fr
      port: 25
      username: ''
      from: inventory@softwareheritage.org
      useTLS: false
      useSSL: false
      timeout: 10

