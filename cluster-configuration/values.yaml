# Cluster url as declared in argocd
clusterUrl: https://cluster/url
# Common mame of the the cluster
clusterName: changeme
environment: changeme

argocdNamespace: argocd
defaultProject: default

defaultPrune: false
defaultSelfHeal: false

clusterConfiguration:
  prune: false
  selfHeal: false

certManager:
  enabled: false
  namespace: cert-manager
  version: v1.12.0
  webhookGandiEnabled: false
  webhookGandiVersion: v0.2.0
  useGandiDNS: false

metallb:
  enabled: false
  namespace: metallb
  version: 0.13.9

ingressNginx:
  enabled: false
  version: 4.12.1
  namespace: ingress-nginx
  # Needed when a chart use the application name to
  # name deployed objects. The names can't be longer than 63 characters
  # Must be unique in argocd
  # applicationNameOverride: my-application-name
  defaultClass: false
  watchIngressWithoutClass: false
  monitoringEnabled: true
  # nodeSelector:
  #   ingress-controller: "true"
  # ingressClassName: nginx
  # avoid to overlap with other deployed ingress-nginx ingress controllers
  # for example, gitlab deploys another ingress-nginx with this default name
  # controllerName: "k8s.io/ingress-nginx"
  # loadBalanceIP: xxx.xxx.xxx.xxx
  # annotations:
  #   annotation1: value
  config:
    # Allow pulling secrets from a separate namespace
    allow-cross-namespace-resources: true
    # see https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/configmap/
    # for more configuration options
  # requestedCpu: 90m
  # requestedMemory: 100Mi

otlpCollector:
  enabled: false
  debug: false
  version: 0.62.1
  # namespace: opentelemetry
  indexes: {}
  #   swh: logs
  #   system: system-logs
  # resources:
  #   cpu: 256m
  #   memory: 2Gi
  #   batch: 10
  #   timeout: 10s
  # endpoints:
  #   - http://esnode1.internal.softwareheritage.org:9200
  #   - http://esnode2.internal.softwareheritage.org:9200
  #   - http://esnode3.internal.softwareheritage.org:9200
  #   - http://esnode7.internal.softwareheritage.org:9200

rabbitmq:
  enabled: false
  namespace: rabbitmq
  version: 4.3.6

kafka:
  enabled: false
  namespace: kafka-system
  # supported kafka versions: 3.6.0, 3.6.1, 3.6.2, 3.7.0*
  # version: 0.41.0
  # supported kafka versions: 3.6.0, 3.6.1, 3.6.2, 3.7.0*, 3.7.1
  # version: 0.42.0
  # supported kafka versions: 3.7.0*, 3.7.1, 3.8.0
  # version: 0.43.0
  # supported kafka versions: 3.7.0*, 3.7.1, 3.8.0**
  # version: 0.44.0
  # supported kafka versions: 3.8.0*, 3.8.1, 3.9.0**, 3.9.1
  # version: 0.45.1
  # supported kafka versions: 3.9.0, 4.0.0
  # version: 0.46.1
  # supported kafka versions:  3.9.0*, 3.9.1, 4.0.0**
  version: 0.47.0
  # supported kafka versions:  4.0.0, 4.1.0
  # version: 0.48.0

cassandra:
  enabled: false
  namespace: k8ssandra-operator
  version: 1.20.3

elasticsearch:
  enabled: false
  namespace: elastic-system
  version: 2.15.0

redis:
  enabled: false
  namespace: redis
  version: 0.18.3
  prune: true
  selfHeal: true

cloudnativePg:
  enabled: false
  namespace: cnpg-system
  # https://cloudnative-pg.io/documentation/current/installation_upgrade/#upgrades
  # cnpg/cloudnative-pg  0.26.0  1.27.0  CloudNativePG Operator Helm Chart <- latest
  # cnpg/cloudnative-pg  0.25.0  1.26.1  CloudNativePG Operator Helm Chart <- current
  version: 0.25.0
  # Out-of-tree plugin to manage backup
  barmanPluginVersion: 0.6.0
  argocdApplication:
    selfHeal: false
    prune: false

pgbouncer:
  enabled: false
  # No release, we target the current master's HEAD commit to still pin it
  version: 609cce7f5a8b27533a994a6b7c19b569bada41dc
  # Override to use this port instead of the default 6432
  servicePort: 5432
  namespace: cnpg
  userlist:
    enabled: false
  # Dict of databases to allow access from pgbouncer
  databases: {}
  # test-db:
  #   host: test-db-rw
  #   port: 5432
  #   dbname: test-db
  #   auth_user: postgres
  #   user: guest
  service:
    enabled: true
    type: LoadBalancer
    annotations:
      # Allow metallb to set the external IP to the load-balancer
      metallb.universe.tf/allow-shared-ip: clusterIP
  pgbouncerExporter:
    enabled: false
    image:
      repository: prometheuscommunity/pgbouncer-exporter
  # prune: true
  # selfHeal: true
