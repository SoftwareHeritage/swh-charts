remoteRWPostgresqlStorageConfiguration:
  cls: remote
  url: http://storage-rw-postgresql:5002
  enable_requests_retry: true

remoteROPostgresqlStorageConfiguration:
  cls: remote
  url: http://storage-ro-postgresql:5002
  enable_requests_retry: true

remoteROCassandraStorageConfiguration:
  cls: remote
  url: http://storage-ro-cassandra:5002
  enable_requests_retry: true

remoteRWCassandraStorageConfiguration:
  cls: remote
  url: http://storage-rw-cassandra:5002
  enable_requests_retry: true

remoteRWStorageWithPipelineConfiguration:
  pipelineStepsRef: storagePipelineSteps
  storageConfigurationRef: remoteRWCassandraStorageConfiguration

rwStoragePostgresqlConfiguration:
  storageConfigurationRef: postgresqlRWStorageConfiguration
  objstorageConfigurationRef: noopObjstorageConfiguration

roStoragePostgresqlConfiguration:
  storageConfigurationRef: postgresqlROStorageConfiguration
  objstorageConfigurationRef: noopObjstorageConfiguration

retryStoragePipelineSteps:
  - cls: retry

remoteROStorageConfiguration:
  pipelineStepsRef: retryStoragePipelineSteps
  storageConfigurationRef: remoteROPostgresqlStorageConfiguration

remoteVaultConfiguration:
  cls: remote
  url: http://vault-rpc:5005
  enable_requests_retry: true

remoteSchedulerConfiguration:
  cls: remote
  url: http://scheduler-rpc:5008
  # already activated by default (inlined in code)
  # enable_requests_retry: true

datasetsJournalClientConfiguration:
  brokersConfigurationRef: internalSecuredKafkaBrokers
  group_id: swh-datasets-journal-export-graph
  prefix: swh.journal.objects
  privileged: true
  batch_size: 10

vault:
  enabled: true
  priorityClassName: frontend-rpc
  logLevel: INFO
  replicas: 1
  schedulerConfigurationRef: remoteSchedulerConfiguration
  vaultConfigurationRef: postgresqlVaultConfiguration
  storageConfigurationRef: remoteROStorageConfiguration
  objstorageConfigurationRef: remoteROObjstorageConfiguration
  cacheConfigurationRef: azureCacheConfiguration
  autoScaling:
    minReplicaCount: 1
    maxReplicaCount: 1
  backend:
    # Initialize data model
    initialize:
      adminSecret: next-version-swh-vault-superuser
      database: swh-vault
    # check db version with latest code?
    check: true
    # migrate db
    migrate: false
  ingress:
    enabled: false

remoteCountersConfiguration:
  cls: remote
  url: http://counters-rpc:5011
  enable_requests_retry: true

externalServices:
  enabled: true
  services:
    vault:
      internalName: vault-rpc-ingress-next-version
      target: archive-staging-rke2-ingress-nginx-controller.ingress-nginx.svc.cluster.local
    counters:
      internalName: counters-rpc-ingress-next-version
      target: archive-staging-rke2-ingress-nginx-controller.ingress-nginx.svc.cluster.local
    provenance:
      internalName: webapp-provenance-ingress-next-version
      target: archive-staging-rke2-ingress-nginx-controller.ingress-nginx.svc.cluster.local
    graph-grpc-next-version-example:
      internalName: graph-grpc-next-version-example-ingress
      target: archive-staging-rke2-ingress-nginx-controller.ingress-nginx.svc.cluster.local
    graph-rpc-next-version-example:
      internalName: graph-rpc-next-version-example-ingress
      target: archive-staging-rke2-ingress-nginx-controller.ingress-nginx.svc.cluster.local
    graph-grpc-next-version-20250507:
      internalName: graph-grpc-next-version-20250507-ingress
      target: archive-staging-rke2-ingress-nginx-controller.ingress-nginx.svc.cluster.local
    graph-rpc-next-version-20250507:
      internalName: graph-rpc-next-version-20250507-ingress
      target: archive-staging-rke2-ingress-nginx-controller.ingress-nginx.svc.cluster.local
    provenance-grpc-next-version:
      internalName: provenance-grpc-next-version-ingress
      target: archive-staging-rke2-ingress-nginx-controller.ingress-nginx.svc.cluster.local
    luigi-scheduler-next-version:
      internalName: luigi-scheduler-next-version-ingress
      target: archive-staging-rke2-ingress-nginx-controller.ingress-nginx.svc.cluster.local

countersJournalClientConfiguration:
  brokersConfigurationRef: internalSecuredKafkaBrokers
  group_id: swh-counters-journal-client
  prefix: swh.journal.objects
  object_types:
  - content
  - directory
  - origin
  - origin_visit
  - origin_visit_status
  - release
  - revision
  - skipped_content
  - snapshot
  message.max.bytes: 524288000

localRedis:
  cls: redis
  host: redis-counters:6379

counters:
  enabled: true
  journalClient:
    enabled: true
    countersConfigurationRef: remoteCountersConfiguration
    journalConfigurationRef: countersJournalClientConfiguration
  refreshCountersCache:
    enabled: false
    cron: "0 */1 * * *"
    concurrencyPolicy: Forbid
    countersConfigurationRef: remoteCountersConfiguration
    historyFiles: []
  rpc:
    enabled: true
    cacheBaseDirectory: /tmp/counters
    countersConfigurationRef: localRedis
    # historyConfigurationRef: historyConfiguration
    replicas: 1
    ingress:
      enabled: false

loaders:
  enabled: true
  terminationGracePeriodSeconds: 60
  storageConfigurationRef: remoteRWStorageWithPipelineConfiguration
  celeryConfigurationRef: celeryConfiguration
  deployments:
    content:
      enabled: false
      tmpEphemeralStorage:
        emptyDir:
          medium: Memory
          sizeLimit: 5Gi
      requestedCpu: 350m
      requestedMemory: 150Mi
      queues:
        - swh.loader.core.tasks.LoadContent
      autoScaling:
        maxReplicaCount: 1
      image: swh_loader_package_image
    git:
      queues:
        - swh.loader.git.tasks.UpdateGitRepository
        - swh.loader.git.tasks.LoadDiskGitRepository
        - swh.loader.git.tasks.UncompressAndLoadDiskGitRepository
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        stopWhenNoActivity: false
    git-checkout:
      image: swh_loader_git_image
      queues:
        - swh.loader.git.tasks.LoadGitCheckout
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        stopWhenNoActivity: false
    mercurial:
      enabled: true
      queues:
        - swh.loader.mercurial.tasks.LoadArchiveMercurial
        - swh.loader.mercurial.tasks.LoadMercurial
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        stopWhenNoActivity: false
    pypi:
      image: swh_loader_package_image
      queues:
        - swh.loader.package.pypi.tasks.LoadPyPI
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        stopWhenNoActivity: false
    save-code-now:
      queues:
        - save_code_now:swh.loader.bzr.tasks.LoadBazaar
        - save_code_now:swh.loader.cvs.tasks.LoadCvsRepository
        - save_code_now:swh.loader.git.tasks.UpdateGitRepository
        - save_code_now:swh.loader.git.tasks.LoadDiskGitRepository
        - save_code_now:swh.loader.git.tasks.UncompressAndLoadDiskGitRepository
        - save_code_now:swh.loader.mercurial.tasks.LoadArchiveMercurial
        - save_code_now:swh.loader.mercurial.tasks.LoadMercurial
        - save_code_now:swh.loader.svn.tasks.LoadSvnRepository
        - save_code_now:swh.loader.svn.tasks.MountAndLoadSvnRepository
        - save_code_now:swh.loader.svn.tasks.DumpMountAndLoadSvnRepository
        - save_code_now:swh.loader.package.archive.tasks.LoadTarball
        - save_code_now:swh.loader.core.tasks.LoadTarballDirectory
      ackLate: true
      autoScaling:
        stopWhenNoActivity: true
        queueThreshold: 1
        minReplicaCount: 0
        maxReplicaCount: 2
      requestedMemory: 200Mi
      requestedCpu: 50m
      limitedMemory: 15Gi
      tmpEphemeralStorage:
        emptyDir:
          medium: Memory
          sizeLimit: 10Gi
    svn:
      enabled: true
      queues:
        - swh.loader.svn.tasks.LoadSvnRepository
        - swh.loader.svn.tasks.MountAndLoadSvnRepository
        - swh.loader.svn.tasks.DumpMountAndLoadSvnRepository
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        stopWhenNoActivity: false

loaderMetadata:
  enabled: true
  storageConfigurationRef: remoteRWStorageWithPipelineConfiguration
  schedulerConfigurationRef: remoteSchedulerConfiguration
  consumerGroup: loader_metadata.journal_client
  prefix: swh.journal.objects
  terminationGracePeriodSeconds: 60
  journalBrokers:
    secretName: swh-archive-broker-secret
    hosts:
      - journal2.internal.staging.swh.network:9094
    user: swh-archive-stg
  autoScaling:
    queueThreshold: 1
    maxReplicaCount: 1
    # TODO: Support this option
    # stopWhenNoActivity: false

directPostgresqlReplayerStorageConfiguration:
  pipelineStepsRef: storagePipelineSteps
  storageConfigurationRef: postgresqlRWStorageConfiguration
  objstorageConfigurationRef: noopObjstorageConfiguration

storageReplayerJournalClientConfig:
  cls: kafka
  brokersConfigurationRef: internalSecuredKafkaBrokers
  prefix: swh.journal.objects
  message.max.bytes: "524288000"
  # Both to write some data to privileged topic and use the error_reporter config
  privileged: true

storageReplayer:
  enabled: true
  storageConfigurationRef: directPostgresqlReplayerStorageConfiguration
  journalClientConfigurationRef: storageReplayerJournalClientConfig
  error_reporter:
    enabled: false
  # Force the deployment of one pod of each type to at least
  # ensure they start (not enough but it's a first step)
  deployments:
    content:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-content
        object_types:
          - content
      requestedCpu: 350m
      requestedMemory: 300Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    directory:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-directory
        object_types:
          - directory
        batch_size: 250
      requestedCpu: 350m
      requestedMemory: 250Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    extid:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-extid
        object_types:
          - extid
        batch_size: 1000
      requestedCpu: 400m
      requestedMemory: 200Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    metadata:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-metadata
        object_types:
          - metadata_authority
          - metadata_fetcher
      # follow up consumption
      requestedCpu: 50m
      requestedMemory: 100Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    raw-extrinsic-metadata:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-raw-extrinsic-metadata
        object_types:
          - raw_extrinsic_metadata
        batch_size: 250
      requestedCpu: 400m
      requestedMemory: 200Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    origin:
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-origin
        object_types:
          - origin
        batch_size: 1000
      # Full replay
      requestedCpu: 400m
      requestedMemory: 200Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    origin-visit:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-origin-visit
        object_types:
          - origin_visit
        batch_size: 1000
      requestedCpu: 400m
      requestedMemory: 400Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    origin-visit-status:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-origin-visit-status
        object_types:
          - origin_visit_status
        batch_size: 1000
      # Full replay
      requestedCpu: 500m
      requestedMemory: 300Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    release:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-origin-visit-release
        object_types:
          - release
        batch_size: 1000
      # Full replay
      requestedCpu: 600m
      requestedMemory: 300Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    revision:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-revision
        object_types:
          - revision
        batch_size: 1000
      # Full replay
      requestedCpu: 750m
      requestedMemory: 750Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    skipped-content:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-skipped-content
        object_types:
          - skipped_content
        batch_size: 100
      # Full replay
      requestedCpu: 300m
      requestedMemory: 400Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false
    snapshot:
      enabled: false
      journalClientOverrides:
        group_id: swh-cassandra-stg-cassandra-replayer-snapshot
        object_types:
          - snapshot
        batch_size: 250
      # Full replay
      requestedCpu: 400m
      requestedMemory: 250Mi
      autoScaling:
        queueThreshold: 1
        maxReplicaCount: 1
        # TODO: Support this option
        # stopWhenNoActivity: false

cassandraSeeds:
  - cassandra-cluster-next-version-service

rwCassandraStorage: &rwCassandraStorage
  cls: cassandra
  cassandraSeedsRef: cassandraSeeds
  keyspace: swh
  initKeyspace: false
  upgradeKeyspace: true
  consistencyLevel: LOCAL_QUORUM
  specificOptions:
    directory_entries_insert_algo: batch
  authProvider:
    cls: cassandra.auth.PlainTextAuthProvider
    username: ${CASSANDRA_RW_USERNAME}
    password: ${CASSANDRA_RW_PASSWORD}
  secrets:
    CASSANDRA_RW_USERNAME:
      secretKeyRef: cassandra-cluster-superuser
      secretKeyName: username
    CASSANDRA_RW_PASSWORD:
      secretKeyRef: cassandra-cluster-superuser
      secretKeyName: password

roCassandraStorage:
  cls: cassandra
  cassandraSeedsRef: cassandraSeeds
  keyspace: swh
  initKeyspace: false
  upgradeKeyspace: false
  consistencyLevel: LOCAL_QUORUM
  authProvider:
    cls: cassandra.auth.PlainTextAuthProvider
    username: ${CASSANDRA_RO_USERNAME}
    password: ${CASSANDRA_RO_PASSWORD}
  secrets:
    # TODO: deploy a real cassandra RO user
    CASSANDRA_RO_USERNAME:
      secretKeyRef: cassandra-cluster-superuser
      secretKeyName: username
    CASSANDRA_RO_PASSWORD:
      secretKeyRef: cassandra-cluster-superuser
      secretKeyName: password

noopObjstorageConfiguration:
  cls: noop

readWriteInternalKafkaBrokers:
  - kafka-cluster-kafka-brokers:9092

internalSecuredKafkaBrokers:
  - kafka-cluster-kafka-brokers:9092

storageJournalWriterConfiguration:
  brokersConfigurationRef: readWriteInternalKafkaBrokers
  prefix: swh.journal.objects
  clientId: swh-storage-journal-writer
  producerConfig:
    message.max.bytes: 1000000000

pathslicingRWObjstorageConfiguration:
  cls: pathslicing
  root: "/srv/swh/objects"
  slicing: 0:1/1:5
  client_max_size: 1073741824
  allow_delete: true

pathslicingROObjstorageConfiguration:
  cls: pathslicing
  root: "/srv/swh/objects"
  slicing: 0:1/1:5
  client_max_size: 1073741824

objstorage:
  enabled: true
  priorityClassName: frontend-rpc
  # For mounting the volume with the right permission
  # docker image has the `swh` uid set at 1005
  securityContext:
    fsGroup: 1005
  replicas: 1
  deployments:
    # Each key will be an objstorage instance to be deployed
    # The mandatory objstorageConfigurationRef key should target a dict
    # with the specific objstorage configuration

    # Activate dedicated instance for write workload
    rw-pathslicing:
      enabled: true
      extraVolumes:
        pathslicing-rw:
          mountPath: /srv/swh/objects
          volumeDefinition:
            persistentVolumeClaim:
              claimName: objstorage-pathslicing-pvc
      # mandatory
      # check readWriteStorageConfiguration example to configure your storage
      objstorageConfigurationRef: pathslicingRWObjstorageConfiguration
    ro-pathslicing:
      enabled: true
      extraVolumes:
        pathslicing-rw:
          mountPath: /srv/swh/objects
          readOnly: true
          volumeDefinition:
            persistentVolumeClaim:
              claimName: objstorage-pathslicing-pvc

      # mandatory
      # check readWriteStorageConfiguration example to configure your storage
      objstorageConfigurationRef: pathslicingROObjstorageConfiguration

rpcRWObjstoragePathslicingConfiguration:
  cls: remote
  url: http://objstorage-rw-pathslicing:5003
  enable_requests_retry: true

rwCassandraStorageWithJournalConfiguration:
  storageConfigurationRef: rwCassandraStorage
  journalWriterConfigurationRef: storageJournalWriterConfiguration
  objstorageConfigurationRef: rpcRWObjstoragePathslicingConfiguration

roRpcObjstoragePathslicingConfiguration:
  cls: remote
  url: http://objstorage-ro-pathslicing:5003
  enable_requests_retry: true

roCassandraStorageConfiguration:
  pipelineStepsRef: maskingStoragePipelineSteps
  storageConfigurationRef: roCassandraStorage
  objstorageConfigurationRef: roRpcObjstoragePathslicingConfiguration

rwCassandraStorageForReferenceTableJob:
  <<: *rwCassandraStorage
  specificOptions:
    table_options:
      object_references_*: "compression = {'class': 'ZstdCompressor', 'compression_level':'19'} AND compaction = {'class': 'UnifiedCompactionStrategy'}"

roCassandraStorageForReferenceTableJob:
  storageConfigurationRef: rwCassandraStorageForReferenceTableJob
  objstorageConfigurationRef: noopObjstorageConfiguration

storage:
  enabled: true
  deployments:
    # main storage to let the loaders write
    rw-cassandra:
      storageConfigurationRef: rwCassandraStorageWithJournalConfiguration
      cronjobs:
        create-object-reference-partitions:
          enabled: false
          storageConfigurationRef: rwCassandraStorageForReferenceTableJob
          logLevel: INFO
          cron: 5 0 * * mon
          concurrencyPolicy: Forbid
    # RO cassandra storage, for webapp
    ro-cassandra:
      storageConfigurationRef: roCassandraStorageConfiguration
      autoScaling:
        minReplicaCount: 1
        maxReplicaCount: 1
    # storage postgresql instance to replay data
    rw-postgresql:
      enabled: true
      storageConfigurationRef: rwStoragePostgresqlConfiguration
      backend:
        initialize:
          adminSecret: next-version-swh-superuser
          database: swh
        check: false
        migrate: false
    ro-postgresql:
      enabled: true
      storageConfigurationRef: roStoragePostgresqlConfiguration
      backend:
        check: false
        migrate: false

webappProvenanceGrpcConfiguration:
  cls: grpc
  url: provenance-grpc-next-version-ingress:80

historyCountersUrl: http://counters-rpc:5011/counters_history/history.json#

cornerRibbon:
  show_corner_ribbon: "true"
  corner_ribbon_text: "StagingNextVersion"

web:
  enabled: true
  deployments:
    cassandra:
      replicas: 1
      gunicorn:
        workers: 2
        threads: 2
        timeout: 3600
      hosts:
        - webapp-cassandra-next-version.internal.staging.swh.network
      databaseConfigurationRef: postgresqlWebConfiguration
      djangoConfigurationRef: djangoWebConfiguration
      searchConfigurationRef: remoteSearchConfiguration
      schedulerConfigurationRef: remoteSchedulerConfiguration
      vaultConfigurationRef: remoteVaultConfiguration
      indexerStorageConfigurationRef: remoteIndexerStorageConfiguration
      countersConfigurationRef: remoteCountersConfiguration
      historyCountersUrlRef: historyCountersUrl
      storageConfigurationRef: remoteROCassandraStorageConfiguration
      webhooksConfigurationRef: webhooksConfiguration
      provenanceConfigurationRef: webappProvenanceGrpcConfiguration
      graphConfigurationRef: webGraphConfiguration
      cornerRibbonRef: cornerRibbon
      extraConfig:
        activate_citations_ui: true
      migrations:
        enabled: false
      cronJobs:
        refreshSCNStatus:
          enabled: false
        syncMailmaps:
          enabled: false
        syncMaskingMailmaps:
          enabled: false
      ingress:
        enabled: true
        whitelistSourceRangeRef: stagingNetworkRanges
        secretName: swh-web-crt
        extraAnnotations:
          cert-manager.io/cluster-issuer: letsencrypt-production-gandi
          kubernetes.io/ingress.class: nginx
          kubernetes.io/tls-acme: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        tlsEnabled: true
        endpoints:
          default:
            paths:
              - path: /
            extraWhitelistSourceRange:
              # vpn network
              - 192.168.101.0/24
          static:
            extraAnnotations:
              nginx.ingress.kubernetes.io/use-regex: "true"
              nginx.ingress.kubernetes.io/rewrite-target: /static/$2
            paths:
              - path: /()(robots.txt)$
                pathType: ImplementationSpecific
                port: 80
              - path: /static(/|$)(.*)
                pathType: ImplementationSpecific
                port: 80
            extraWhitelistSourceRange:
              # vpn network
              - 192.168.101.0/24
          authenticated:
            extraAnnotations:
              nginx.ingress.kubernetes.io/use-regex: "true"
            paths:
              - path: /api/1/provenance/
              - path: /api/1/entity/
              - path: /api/1/content/[^/]+/symbol/
                pathType: ImplementationSpecific
            # auth-file with authentication
            authentication: swh-cassandra/web-auth-secrets
            extraWhitelistSourceRange:
              # vpn network
              - 192.168.101.0/24

podPriority:
  # This test environment should not impact the real staging environment
  # so we need to use lower priorities than the 'normal' versions
  priorities:
    storages:
      value: -100000
    frontend-rpc:
      value: -10100
    frontend-rpc-workload:
      value: -10200
    high-workload:
      value: -10300
    local-workload:
      value: -10400
    normal-workload:
      value: -10500
    tools:
      value: -10600
    low-workload:
      value: -10700
    background-storage:
      value: -10800
    background-workload:
      value: -10900

schedulerJournalClientConfiguration:
  brokersConfigurationRef: internalSecuredKafkaBrokers
  group_id: swh-scheduler-journal-client

scheduler:
  enabled: true
  schedulerConfigurationRef: remoteSchedulerConfiguration
  celeryConfigurationRef: celeryConfiguration
  sentry:
    enabled: false
  rpc:
    enabled: true
    schedulerConfigurationRef: postgresqlSchedulerConfiguration
    backend:
      # check db version with latest code?
      check: true
      # migrate db?
      migrate: false
      # register task types?
      register: true
      # For test or sandboxed environment
      registerListingTask:
        forgeType: list-gitlab-incremental
        forgeUrl: https://gitlab.softwareheritage.org/api/v4
  journalClient:
    enabled: true
    journalConfigurationRef: schedulerJournalClientConfiguration
  extraServices:
    runner:
      enabled: true
    runner-priority:
      enabled: true
    listener:
      enabled: true
      replicas: 1
    schedule-recurrent:
      enabled: true
      replicas: 1

svixConfiguration:
  svix:
    server_url: https://svix-next-version.internal.staging.swh.network
    auth_token: ${SVIX_AUTH_TOKEN}
  event_retention_period: 7
  secrets:
    SVIX_AUTH_TOKEN:
      secretKeyRef: common-secrets
      secretKeyName: svix-token

toolbox:
  enabled: true
  configs:
    deposit:
      depositDbConfigurationRef: postgresqlDepositConfiguration
    indexer-storage:
      moduleName: indexer
      moduleConfigKey: indexer_storage
      indexerDbConfigurationRef: postgresqlIndexerStorageConfiguration
    scheduler:
      schedulerDbConfigurationRef: postgresqlSchedulerConfiguration
      celeryConfigurationRef: celeryConfiguration
    storage:
      storageDbConfigurationRef: postgresqlRWStorageConfiguration
    vault:
      vaultDbConfigurationRef: postgresqlVaultConfiguration
    web:
      webDbConfigurationRef: postgresqlWebConfiguration
    webhooks:
      webhooksConfigurationRef: svixConfiguration
    masking:
      moduleName: storage.proxies.masking
      moduleConfigKey: masking_admin
      maskingAdminConfigurationRef: rwMaskingPostgresqlConfiguration
      storageConfigurationRef: memoryNoopStorageConfiguration

  bulkLoad: null

webhooksJournalClientConfiguration:
  brokersConfigurationRef: internalSecuredKafkaBrokers

webhooks:
  enabled: true
  svixConfigurationRef: svixConfiguration
  journalClientConfigurationRef: webhooksJournalClientConfiguration
  priorityClassName: frontend-rpc-workload
  autoScaling:
    maxReplicaCount: 1
  deployments:
    origin-visit-status:
      dnsConfigurationRef: dnsConfiguration
      requestedCpu: 100m
      requestedMemory: 100Mi
      journalClientOverrides:
        auto_offset_reset: latest
        group_id: staging-next-version-archive-webhooks
        object_types:
          - origin_visit_status

listers:
  enabled: true
  storageConfigurationRef: remoteROStorageConfiguration
  schedulerConfigurationRef: remoteSchedulerConfiguration
  celeryConfigurationRef: celeryConfiguration
  deployments:
    nixguix:
      queues:
      - swh.lister.nixguix.tasks.NixGuixListerTask
      autoScaling:
        queueThreshold: 1
        stopWhenNoActivity: false
        minReplicaCount: 1
        maxReplicaCount: 1
      extraConfig:
        # extra extensions to ignore
        extensions_to_ignore:
          - rock
    gitlab:
      queues:
      - swh.lister.gitlab.tasks.IncrementalGitLabLister
      - swh.lister.gitlab.tasks.RangeGitLabLister
      - swh.lister.gitlab.tasks.FullGitLabRelister
      autoScaling:
        maxReplicaCount: 1
    pypi:
      queues:
      - swh.lister.pypi.tasks.PyPIListerTask
      autoScaling:
        maxReplicaCount: 1


elasticsearchHosts:
  - host: search-next-version-es-http
    port: 9200

elasticsearchConfiguration:
  elasticsearchInstancesRef: elasticsearchHosts
  cls: elasticsearch
  indexes:
    origin:
      index: origin-v0.11
      read_alias: origin-read
      write_alias: origin-write

remoteSearchConfiguration:
  cls: remote
  url: http://search-rpc:5010
  enable_requests_retry: true

searchJournalClientConfiguration:
  brokersConfigurationRef: internalSecuredKafkaBrokers
  group_id: swh-search

search:
  enabled: true
  logLevel: INFO
  rpc:
    enabled: true
    elasticsearchConfigurationRef: elasticsearchConfiguration
    autoScaling:
      minReplicaCount: 1
      maxReplicaCount: 1
    gunicorn:
      threads: 4
      workers: 1
      timeout: 60
    requestedMemory: 512Mi
    requestedCpu: 500m
    deployments:
      search:
        backend:
          initialize: true
        ingress:
          enabled: false

  journalClients:
    enabled: true
    priorityClassName: normal-workload
    searchConfigurationRef: remoteSearchConfiguration
    storageConfigurationRef: remoteROPostgresqlStorageConfiguration
    journalConfigurationRef: searchJournalClientConfiguration
    deployments:
      objects-next-version:
        journalClientOverrides:
          group_id: swh-search-next-version.journal-client-origins-v0.11
          prefix: swh.journal.objects
          object_types:
            - origin
            - origin_visit_status

      indexed-next-version:
        requestedCpu: 10m
        requestedMemory: 50Mi
        journalClientOverrides:
          group_id: swh-search-next-version.journal-client-indexed-v0.11
          prefix: swh.journal.indexed
          object_types:
          - origin_intrinsic_metadata
          - origin_extrinsic_metadata

postgresqlIndexerStorageConfiguration:
  cls: postgresql
  host: next-version-swh-indexer-rw.swh-cassandra-next-version
  port: 5432
  db: swh-indexer
  user: ${POSTGRESQL_IDX_USERNAME}
  pass: ${POSTGRESQL_IDX_PASSWORD}
  secrets:
    POSTGRESQL_IDX_USERNAME:
      secretKeyRef: swh-postgresql-swh-swh-indexer-secret
      secretKeyName: username
    POSTGRESQL_IDX_PASSWORD:
      secretKeyRef: swh-postgresql-swh-swh-indexer-secret
      secretKeyName: password

indexerJournalWriterConfiguration:
  brokersConfigurationRef: readWriteInternalKafkaBrokers
  cls: kafka
  anonymize: true
  client_id: swh-indexer-storage-journal-writer-storage
  prefix: swh.journal.indexed
  producer_config:
    message.max.bytes: 1000000000

indexerStorage:
  enabled: true
  deployments:
    rw:
      backend:
        # When true, initalize the backend, leave it empty to do nothing
        initialize:
          adminSecret: next-version-swh-indexer-superuser
          database: swh-indexer
        # When true, check db & code versions and do not start if they diverge
        check: true
        # When true, migrate or initialize db model
        migrate: true

      replicas: 1
      requestedCpu: 500m
      requestedMemory: 512Mi
      indexerStorageConfigurationRef: postgresqlIndexerStorageConfiguration
      journalWriterConfigurationRef: indexerJournalWriterConfiguration
      gunicorn:
        threads: 1
        workers: 2

remoteIndexerStorageConfiguration:
  cls: remote
  url: http://indexer-storage-rw:5007
  enable_requests_retry: true

indexerJournalClientConfiguration:
  cls: kafka
  brokersConfigurationRef: readWriteInternalKafkaBrokers
  group_id: swh-indexer-journal-client

indexers:
  enabled: true
  storageConfigurationRef: remoteROStorageConfiguration
  schedulerConfigurationRef: remoteSchedulerConfiguration
  indexerStorageConfigurationRef: remoteIndexerStorageConfiguration
  objstorageConfigurationRef: rpcRWObjstoragePathslicingConfiguration
  journalClientConfigurationRef: indexerJournalClientConfiguration
  deployments:
    origin-intrinsic:
      indexer_type: origin_intrinsic_metadata
      journalClientOverrides:
        group_id: swh-indexer-journal-client-origin-intrinsic-metadata
        batch_size: 200
        prefix: swh.journal.objects
      requestedCpu: 50m
      requestedMemory: 100Mi
      extraConfig:
        tools:
          name: swh-metadata-detector
          version: 0.0.2
