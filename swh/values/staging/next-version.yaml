        group_id: swh-indexer-journal-client-extrinsic-metadata
        prefix: swh.journal.objects
        batch_size: 200
      requestedCpu: 50m
      requestedMemory: 100Mi
      extraConfig:
        tools:
          name: swh-metadata-detector
          version: 0.0.2
          configuration: {}
      autoScaling:
        maxReplicaCount: 1

graphql:
