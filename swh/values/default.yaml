      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: swh/web
            operator: In
            values:
            - "true"
  ingress:
    extraAnnotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 100M

