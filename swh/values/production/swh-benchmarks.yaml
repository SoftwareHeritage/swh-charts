namespace: swh-benchmarks

# Override images
swh_objstorage_image_version: '20260612.1'


# Objstorage configs
noopObjstorageConfiguration:
  cls: noop
  allow_delete: true

azureTestObjstorageConfigurationSecrets: &azure-test-objstorage-secrets
  AZURE_CONTAINER_URL:
    secretKeyRef: swh-objstorage-test-config
    secretKeyName: test_0_container_url
azureTestObjstorageConfiguration:
  cls: azure
  compression: gzip
  container_url: ${AZURE_CONTAINER_URL}
  secrets: *azure-test-objstorage-secrets

objstorage:
  enabled: true
  logLevel: WARN
  priorityClassName: frontend-rpc
  autoScaling: false
  deployments:
    # Each key will be an objstorage instance to be deployed
    # The mandatory objstorageConfigurationRef key should target a dict
    # with the specific objstorage configuration
    noop-read-write:
      enabled: true
      replicas: 1
      gunicorn:
        workers: 4
        threads: 2
        timeout: 310
      objstorageConfigurationRef: noopObjstorageConfiguration
      extraRpcConfiguration:
        client_max_size: 1073741824
      hosts:
        - objstorage-rw-noop-benchmarks
      ingress:
        enabled: true
        # mandatory if ingress is enabled
        # the hostname on which the objstorage must be reachable
        # Optional: the ingress classname to use
        className: nginx
        extraAnnotations:
          nginx.ingress.kubernetes.io/proxy-body-size: 4G
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
          nginx.ingress.kubernetes.io/client-body-buffer-size: 128K
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
        endpoints:
          default:
            paths:
              - path: /

    azure-test-read-write:
      enabled: true
      replicas: 1
      gunicorn:
        workers: 4
        threads: 2
        timeout: 310
      # mandatory
      # check readWriteStorageConfiguration example to configure your storage
      objstorageConfigurationRef: azureTestObjstorageConfiguration
      extraRpcConfiguration:
        client_max_size: 1073741824
      hosts:
        - objstorage-rw-azure-benchmarks
      ingress:
        enabled: true
        # mandatory if ingress is enabled
        # the hostname on which the objstorage must be reachable
        # Optional: the ingress classname to use
        className: nginx
        extraAnnotations:
          nginx.ingress.kubernetes.io/proxy-body-size: 4G
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
          nginx.ingress.kubernetes.io/client-body-buffer-size: 128K
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
        endpoints:
          default:
            paths:
              - path: /

    azure-concurrent-test-read-write:
      enabled: true
      image: {{ $swh_objstorage_concurrent_image }}
      image_version: {{ $swh_objstorage_concurrent_image_version }}
      replicas: 1
      gunicorn:
        workers: 4
        threads: 2
        timeout: 310
      # mandatory
      # check readWriteStorageConfiguration example to configure your storage
      objstorageConfigurationRef: azureTestObjstorageConfiguration
      extraRpcConfiguration:
        client_max_size: 1073741824
      hosts:
        - objstorage-rw-azure-concurrent-benchmarks
      ingress:
        enabled: true
        # mandatory if ingress is enabled
        # the hostname on which the objstorage must be reachable
        # Optional: the ingress classname to use
        className: nginx
        extraAnnotations:
          nginx.ingress.kubernetes.io/proxy-body-size: 4G
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
          nginx.ingress.kubernetes.io/client-body-buffer-size: 128K
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
        endpoints:
          default:
            paths:
              - path: /


ingestion_benchmarks:
  enabled: true
  requestedMemory: 1Gi
  requestedCpu: 1000m
  workers:
    replicas: 3
    requestedMemory: 1Gi
    requestedCpu: 3000m
  ingress:
    enabled: true
    hosts:
      - ingestion-benchmarks
    extraAnnotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    endpoints:
      default:
        paths:
          - path: /
