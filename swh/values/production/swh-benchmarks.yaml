environment: production
clusterName: archive-production-rke2

namespace: swh-benchmarks

# Override images
swh_objstorage_image_version: '20260612.1'


# Objstorage configs
noopObjstorageConfiguration:
  cls: noop
  allow_delete: true

azureProdAObjstorageConfigurationSecrets: &azure-prod-a-objstorage-secrets
  AZURE_CONTAINER_URL:
    secretKeyRef: swh-objstorage-test-config
    secretKeyName: prod_a_container_url
azureProdAObjstorageConfiguration:
  cls: azure
  compression: gzip
  secrets: *azure-prod-a-objstorage-secrets
  container_url: ${AZURE_CONTAINER_URL}

azureTestObjstorageConfigurationSecrets: &azure-test-objstorage-secrets
  AZURE_CONTAINER_URL:
    secretKeyRef: swh-objstorage-test-config
    secretKeyName: test_0_container_url
azureTestObjstorageConfiguration:
  cls: azure
  compression: gzip
  container_url: ${AZURE_CONTAINER_URL}
  secrets: *azure-test-objstorage-secrets

objstorage:
  enabled: true
  logLevel: WARN
  priorityClassName: frontend-rpc
  autoScaling: false
  deployments:
    # Each key will be an objstorage instance to be deployed
    # The mandatory objstorageConfigurationRef key should target a dict
    # with the specific objstorage configuration
    noop-read-write:
      enabled: true
      replicas: 0
      gunicorn:
        workers: 4
        threads: 2
        timeout: 310
      objstorageConfigurationRef: noopObjstorageConfiguration
      extraRpcConfiguration:
        client_max_size: 1073741824
      hosts:
        - objstorage-rw-noop-benchmarks
      ingress:
        enabled: true
        # mandatory if ingress is enabled
        # the hostname on which the objstorage must be reachable
        # Optional: the ingress classname to use
        className: nginx
        extraAnnotations:
          nginx.ingress.kubernetes.io/proxy-body-size: 4G
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
          nginx.ingress.kubernetes.io/client-body-buffer-size: 128K
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
        endpoints:
          default:
            paths:
              - path: /

    azure-seq-test-read-write:
      enabled: true
      replicas: 0
      gunicorn:
        workers: 4
        threads: 2
        timeout: 310
      # mandatory
      # check readWriteStorageConfiguration example to configure your storage
      objstorageConfigurationRef: azureTestObjstorageConfiguration
      extraRpcConfiguration:
        client_max_size: 1073741824
      hosts:
        - objstorage-rw-azure-test-seq-benchmarks
      ingress:
        enabled: true
        # mandatory if ingress is enabled
        # the hostname on which the objstorage must be reachable
        # Optional: the ingress classname to use
        className: nginx
        extraAnnotations:
          nginx.ingress.kubernetes.io/proxy-body-size: 4G
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
          nginx.ingress.kubernetes.io/client-body-buffer-size: 128K
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
        endpoints:
          default:
            paths:
              - path: /

    azure-concurrent-test-read-write:
      enabled: true
      image: container-registry.softwareheritage.org/swh/infra/swh-apps/objstorage_benchmarking
      image_version: '20260623.2'
      replicas: 0
      gunicorn:
        workers: 4
        threads: 2
        timeout: 310
      # mandatory
      # check readWriteStorageConfiguration example to configure your storage
      objstorageConfigurationRef: azureTestObjstorageConfiguration
      extraRpcConfiguration:
        client_max_size: 1073741824
      hosts:
        - objstorage-rw-azure-test-concurrent-benchmarks
      ingress:
        enabled: true
        # mandatory if ingress is enabled
        # the hostname on which the objstorage must be reachable
        # Optional: the ingress classname to use
        className: nginx
        extraAnnotations:
          nginx.ingress.kubernetes.io/proxy-body-size: 4G
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
          nginx.ingress.kubernetes.io/client-body-buffer-size: 128K
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
        endpoints:
          default:
            paths:
              - path: /

    azure-concurrent-prod-a-read-write:
      enabled: true
      image: container-registry.softwareheritage.org/swh/infra/swh-apps/objstorage_benchmarking
      image_version: '20260623.2'
      replicas: 0
      gunicorn:
        workers: 4
        threads: 2
        timeout: 310
      # mandatory
      # check readWriteStorageConfiguration example to configure your storage
      objstorageConfigurationRef: azureProdAObjstorageConfiguration
      extraRpcConfiguration:
        client_max_size: 1073741824
      hosts:
        - objstorage-rw-azure-prod-a-concurrent-benchmarks
      ingress:
        enabled: true
        # mandatory if ingress is enabled
        # the hostname on which the objstorage must be reachable
        # Optional: the ingress classname to use
        className: nginx
        extraAnnotations:
          nginx.ingress.kubernetes.io/proxy-body-size: 4G
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
          nginx.ingress.kubernetes.io/client-body-buffer-size: 128K
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
        endpoints:
          default:
            paths:
              - path: /

    # These names keep getting longer.
    azure-concurrent-keeppool-test-read-write:
      enabled: true
      image: container-registry.softwareheritage.org/swh/infra/swh-apps/objstorage_benchmarking
      image_version: '20260707.2'
      replicas: 0
      gunicorn:
        workers: 4
        threads: 2
        timeout: 310
      # mandatory
      # check readWriteStorageConfiguration example to configure your storage
      objstorageConfigurationRef: azureTestObjstorageConfiguration
      extraRpcConfiguration:
        client_max_size: 1073741824
      hosts:
        - objstorage-rw-azure-test-concurrent-keeppool-benchmarks
      ingress:
        enabled: true
        # mandatory if ingress is enabled
        # the hostname on which the objstorage must be reachable
        # Optional: the ingress classname to use
        className: nginx
        extraAnnotations:
          nginx.ingress.kubernetes.io/proxy-body-size: 4G
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
          nginx.ingress.kubernetes.io/client-body-buffer-size: 128K
          nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
          nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
        endpoints:
          default:
            paths:
              - path: /


ingestion_benchmarks:
  enabled: true
  requestedMemory: 1Gi
  requestedCpu: 1000m
  workers:
    replicas: 3
    requestedMemory: 1Gi
    requestedCpu: 3000m
  ingress:
    enabled: true
    hosts:
      - ingestion-benchmarks
    extraAnnotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    endpoints:
      default:
        paths:
          - path: /

toolbox:
  enabled: true
