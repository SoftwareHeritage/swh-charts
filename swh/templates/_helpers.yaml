{{/* Register listing task in scheduler backend through a container if needed */}}
{{- define "swh.registerListingTask" -}}
{{- $image_version := get . "imageVersion" | default ( get .Values (print .imagePrefixName "_version") ) |
        required (print .imagePrefixName "_version is mandatory in values.yaml ") -}}
{{- $forgeType := get .config "forgeType" |
    required (print "<forgeType> is mandatory in values.yaml") -}}
{{- $forgeUrl := get .config "forgeUrl" |
    required (print "<forgeUrl> is mandatory in values.yaml") -}}
- name: {{ .containerName | default "register-listing-task" }}
  image: {{ get .Values .imagePrefixName }}:{{ $image_version }}
  command:
  - /entrypoints/register-listing-task.sh
  env:
  - name: SWH_CONFIG_FILENAME
    value: /etc/swh/config.yml
  - name: SWH_FORGE_TYPE
    value: {{ $forgeType }}
  - name: SWH_FORGE_URL
    value: {{ $forgeUrl }}
  - name: SWH_LOG_LEVEL
    value: INFO
  volumeMounts:
  - name: configuration
    mountPath: /etc/swh
  - name: backend-utils
    mountPath: /entrypoints
{{- end -}}

{{/* Register webhook event types in svix backend if needed */}}
{{- define "swh.registerWebhookEventTypes" -}}
{{- $image_version := get . "imageVersion" | default ( get .Values (print .imagePrefixName "_version") ) |
        required (print .imagePrefixName "_version is mandatory in values.yaml ") -}}
- name: {{ .containerName | default "register-webhook-event-types" }}
  image: {{ get .Values .imagePrefixName }}:{{ $image_version }}
  command:
  - /entrypoints/register-webhook-event-types.sh
  env:
  - name: SWH_CONFIG_FILENAME
    value: /etc/swh/config.yml
  - name: SWH_LOG_LEVEL
    value: INFO
  volumeMounts:
  - name: configuration
    mountPath: /etc/swh
  - name: backend-utils
    mountPath: /entrypoints
{{- end -}}

{{/* Register webhook endpoints in svix backend if needed */}}
{{- define "swh.registerWebhookEventTypeEndpoints" -}}
{{- $image_version := get . "imageVersion" | default ( get .Values (print .imagePrefixName "_version") ) |
        required (print .imagePrefixName "_version is mandatory in values.yaml ") -}}
{{- $url := required (print "<.config.url> is mandatory") .config.url -}}
{{- $webhookToken := required (print "<.config.webhookToken> dict is mandatory") .config.webhookToken -}}
{{- $secretTokenName := required (print "<.config.webhookToken.name> secret name is mandatory") $webhookToken.name -}}
{{- $secretTokenKey := required (print "<.config.webhookToken.name> secret key is mandatory") $webhookToken.key -}}
- name: {{ .containerName | default "register-webhook-event-type-endpoints" }}
  image: {{ get .Values .imagePrefixName }}:{{ $image_version }}
  command:
  - /entrypoints/register-webhook-event-type-endpoints.sh
  env:
  - name: SWH_CONFIG_FILENAME
    value: /etc/swh/config.yml
  - name: SWH_LOG_LEVEL
    value: INFO
  - name: URL
    value: {{ $url }}
  - name: TOKEN
    valueFrom:
      secretKeyRef:
        name: {{ $secretTokenName }}
        key: {{ $secretTokenKey }}
  volumeMounts:
  - name: configuration
    mountPath: /etc/swh
  - name: backend-utils
    mountPath: /entrypoints
{{- end -}}

{{/*
Generate the configuration for a remote service
*/}}
{{- define "swh.service.fromYaml" -}}
{{- $configuration := deepCopy (get .Values .configurationRef) -}}
{{- $_ := unset $configuration "secrets" -}}
{{- if .service -}}
{{- .service }}:
{{- end }}
{{ toYaml $configuration | indent 2 }}
{{- end -}}

{{/*
Generate the configuration for search
*/}}
{{- define "swh.search.configuration" -}}
{{- $configuration := deepCopy (get .Values .configurationRef) -}}
{{- $elasticsearchInstances := get .Values (get $configuration "elasticsearchInstancesRef") -}}
{{- $_ := unset $configuration "elasticsearchInstancesRef" -}}
{{- $_ := unset $configuration "secrets" -}}
{{ .serviceType }}:
  {{ toYaml $configuration | nindent 2 }}
  hosts:
  {{ toYaml $elasticsearchInstances | nindent 4 }}
{{- end -}}

{{/*
Generate the resolver configuration
*/}}
{{- define "swh.dns.configuration" -}}
{{- $configuration := deepCopy (get .Values .configurationRef) -}}
{{- if $configuration.policy }}
dnsPolicy: "{{ $configuration.policy }}"
{{- end }}
dnsConfig:
{{- if $configuration.ndots }}
  options:
    - name: ndots
      value: "{{ $configuration.ndots }}"
{{- end }}
{{- if $configuration.overrideSearch }}
  searches:
    - cluster.local
    - svc.cluster.local
    - {{ .Values.namespace }}.svc.cluster.local
{{- range $extraSearch := get $configuration "extraSearch" | default (list) }}
    - {{ $extraSearch }}
{{- end }}
{{- end }}
{{- if $configuration.nameservers }}
  nameservers:
  {{- range $nameserver := $configuration.nameservers }}
    - {{ $nameserver }}
  {{- end }}
{{- end }}
{{- end -}}

{{/*
Debug variable during chart development.
To use like this:

template "swh.var_dump" $variable

*/}}
{{- define "swh.var_dump" -}}
{{- . | mustToPrettyJson | printf "####\nJSON output:\n%s\n####" | fail }}
{{- end -}}

