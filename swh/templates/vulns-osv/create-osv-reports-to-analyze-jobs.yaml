{{- $topVulnsConfig := .Values.vulnsOsv -}}
{{- $jobConfig := .Values.vulnsOsv.createReportsCronjob -}}
{{- if and $topVulnsConfig.enabled $jobConfig.enabled }}
{{- $jobConfig = include "swh.mergeDeploymentConfig"
      (dict "deploymentConfig" $jobConfig
            "topConfig"        $topVulnsConfig) | fromYaml -}}
{{- $serviceName := print "vulns-osv-create-reports-cronjob" -}}
{{- $namespace := $jobConfig.namespace | default $.Values.namespace -}}
{{- $logLevel := $jobConfig.logLevel -}}

#### ConfigMap
{{ include "swh.vulnsOsv.configmap"
             (dict "serviceName"   $serviceName
                   "namespace"     $namespace
                   "config"        $jobConfig
                   "Values"        $.Values) }}
#### CronJob

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $serviceName }}
  namespace: {{ $namespace }}
spec:
  # By default, every 4h at midnight
  schedule: {{ $jobConfig.cron | quote}}
  {{- if $jobConfig.concurrencyPolicy }}
  concurrencyPolicy: {{ $jobConfig.concurrencyPolicy }}
  {{- end }}
  jobTemplate:
    spec:
      template:
        spec:
          {{- if $jobConfig.affinity }}
          affinity:
            {{- toYaml $jobConfig.affinity | nindent 12 }}
          {{- end }}
          {{- if and $.Values.podPriority.enabled $jobConfig.priorityClassName }}
          priorityClassName: {{ $namespace }}-{{ $jobConfig.priorityClassName }}
          {{ end }}
          initContainers:
            - name: prepare-configuration
              image: {{ $.Values.swh_utils_image }}:{{ $.Values.swh_utils_image_version }}
              imagePullPolicy: IfNotPresent
              command:
              - /entrypoints/prepare-configuration.sh
              env: {{ include "swh.secrets.envFromDeploymentConfig"
                                (dict "deploymentConfig" $jobConfig
                                      "Values"           $.Values) | nindent 16 }}
              volumeMounts:
              - name: configuration
                mountPath: /etc/swh
              - name: configuration-template
                mountPath: /etc/swh/configuration-template
              - name: config-utils
                mountPath: /entrypoints
                readOnly: true
          containers:
            - name: {{ $serviceName }}
              resources:
                requests:
                  memory: {{ $jobConfig.requestedMemory | default "512Mi" }}
                  cpu: {{ $jobConfig.requestedCpu | default "500m" }}
                {{- if or $jobConfig.limitedMemory $jobConfig.limitedCpu }}
                limits:
                {{- if $jobConfig.limitedMemory }}
                  memory: {{ $jobConfig.limitedMemory }}
                {{- end }}
                {{- if $jobConfig.limitedCpu }}
                  cpu: {{ $jobConfig.limitedCpu }}
                {{- end }}
                {{ end }}
              image: {{ $.Values.swh_vulns_osv_image }}:{{ $.Values.swh_vulns_osv_image_version }}
              imagePullPolicy: IfNotPresent
              command:
              - /opt/swh/entrypoint.sh
              args:
              - swh
              - vulns
              - osv
              - create-report-processing-tasks
              env:
                - name: STATSD_HOST
                  value: {{ .Values.statsdExternalHost | default "prometheus-statsd-exporter" }}
                - name: STATSD_PORT
                  value: {{ .Values.statsdPort | default "9125" | quote }}
                - name: STATSD_TAGS
                  value: deployment:vulns-osv
                - name: STATSD_SERVICE_TYPE
                  value: vulns-osv-cronjob
                - name: SWH_CONFIG_FILENAME
                  value: /etc/swh/config.yml
                - name: SWH_LOG_LEVEL
                  value: {{ $logLevel }}
              {{- if $jobConfig.sentry.enabled }}
                - name: SWH_SENTRY_ENVIRONMENT
                  value: {{ .Values.sentry.environment }}
                - name: SWH_MAIN_PACKAGE
                  value: swh.vulns
                - name: SWH_SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $jobConfig.sentry.secretKeyRef }}
                      key: {{ $jobConfig.sentry.secretKeyName }}
                      # if the setting doesn't exist, sentry issue pushes will be disabled
                      optional: false
                - name: SWH_SENTRY_DISABLE_LOGGING_EVENTS
                  value: "true"
              {{- end }}
              imagePullPolicy: IfNotPresent
              volumeMounts:
              - name: configuration
                mountPath: /etc/swh
          volumes:
          - name: configuration
            emptyDir: {}
          - name: configuration-template
            configMap:
              name: {{ $serviceName }}-configuration-template
              items:
              - key: "config.yml.template"
                path: "config.yml.template"
          - name: config-utils
            configMap:
              name: config-utils
              defaultMode: 0555
          restartPolicy: OnFailure

{{- end -}}
