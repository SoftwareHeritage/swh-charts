{{- $clusterName := .Values.clusterName -}}
{{- if and .Values.vaultStaticSecrets.enabled (ne $clusterName "local-cluster") -}}
  {{- $namespace := .Values.namespace -}}
  {{- $vaultAuthRef := .Values.vaultAuthRef -}}
  {{- $secrets := concat .Values.vaultStaticSecrets.commonSecrets .Values.vaultStaticSecrets.extraSecrets -}}
  {{- range $secretName := uniq $secrets }}
    {{ include "swh.secrets.template.vaultStaticSecrets"
          (dict "secretName"    $secretName
                "namespace"     $namespace
                "clusterName"   $clusterName
                "vaultAuthRef"  $vaultAuthRef
                "Values"        $.Values) | nindent 0 }}
  {{- end }}
{{- end }}

