{{- $datasetsGeneratorConfig := .Values.datasetsGenerator -}}
{{- $datasetsConfig := $datasetsGeneratorConfig.datasets -}}
{{- if and $datasetsGeneratorConfig.enabled $datasetsConfig.enabled -}}
{{- $configSchedulerChecksum := include (print $.Template.BasePath "/datasets-generator/scheduler-configmap.yaml") . | sha256sum -}}
{{- $configChecksum := include (print $.Template.BasePath "/datasets-generator/datasets-configmap.yaml") . | sha256sum -}}
{{- $configUtilsChecksum := include (print $.Template.BasePath "/datasets-generator/luigi-config-utils.yaml") . | sha256sum -}}
{{- $containerImageKey := $datasetsGeneratorConfig.image -}}
{{- $containerImage := .Values.swh_datasets_image -}}
{{- $containerImageVersion := .Values.swh_datasets_image_version -}}
{{- $luigiConfigDirpath := "/etc/luigi" -}}
{{- $luigiConfigPath := print $luigiConfigDirpath "/luigi.cfg" -}}

{{- range $datasetGeneratorName, $datasetGeneratorConfig := $datasetsGeneratorConfig.datasets.deployments -}}
{{- if or (not (hasKey $datasetsGeneratorConfig "enabled")) (get $datasetsGeneratorConfig "enabled")
          (not (hasKey $datasetGeneratorConfig "enabled")) (get $datasetGeneratorConfig "enabled") -}}
{{- $config := include "swh.datasets.generator.config"
      (dict "datasetGeneratorName"           $datasetGeneratorName
            "datasetGeneratorConfiguration"  $datasetGeneratorConfig
            "datasetsGeneratorConfiguration" $datasetsGeneratorConfig
            "Values"                         $.Values) | fromYaml -}}
{{- $generatorTask := $config.datasetGeneratorTask -}}
{{- $debug := $config.debug -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $config.namespace }}
  name: {{ $config.serviceType }}
  labels:
    app: {{ $config.serviceType }}
spec:
  revisionHistoryLimit: 2
  {{ if $config.replicas }}
  replicas: {{ $config.replicas }}
  {{ end -}}
  selector:
    matchLabels:
      app: {{ $config.serviceType }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{ $config.serviceType }}
      annotations:
        checksum/config: {{ $configChecksum }}
        checksum/config-scheduler: {{ $configSchedulerChecksum }}
        checksum/config-utils: {{ $configUtilsChecksum }}
    spec:
      hostname: {{ $config.serviceType }}
      {{- if $config.affinity }}
      affinity:
        {{- toYaml $config.affinity | nindent 8 }}
      {{- end }}
      {{- if and $.Values.podPriority.enabled $config.priorityClassName }}
      priorityClassName: {{ print $config.namespace "-" $config.priorityClassName | quote }}
      {{ end }}
      initContainers:
        - name: prepare-luigi-configuration
          image: {{ $.Values.swh_utils_image }}:{{ $.Values.swh_utils_image_version }}
          imagePullPolicy: IfNotPresent
          command:
          - /entrypoints/prepare-configuration.sh
          env: {{ include "swh.secrets.envFromDeploymentConfig"
                  (dict "deploymentConfig" $datasetsGeneratorConfig
                        "Values" $.Values) | nindent 12 }}

            - name: CONFIG_TEMPLATE_PATH
              value: {{ print $luigiConfigDirpath "/configuration-template/luigi.cfg.template" }}
            - name: CONFIG_PATH
              value: {{ $luigiConfigPath }}
          volumeMounts:
          - name: luigi-configuration
            mountPath: {{ $luigiConfigDirpath }}
          - name: luigi-scheduler-config-template
            mountPath: {{ print $luigiConfigDirpath "/configuration-template" }}
          - name: luigi-config-utils
            mountPath: /entrypoints
            readOnly: true
        {{ if (or (eq $generatorTask "CompressGraph") (eq $generatorTask "ExportGraph")) }}
        - name: {{ $config.serviceType }}-prepare-configuration
          image: {{ $.Values.swh_utils_image }}:{{ $.Values.swh_utils_image_version }}
          imagePullPolicy: IfNotPresent
          command:
          - /entrypoints/prepare-configuration.sh
          env: {{ include "swh.secrets.envFromDeploymentConfig"
                  (dict "deploymentConfig" $datasetsGeneratorConfig
                        "Values" $.Values) | nindent 12 }}
          volumeMounts:
          - name: dataset-configuration
            mountPath: /etc/swh
          - name: {{ $config.serviceType }}-config-template
            mountPath: /etc/swh/configuration-template
          - name: config-utils
            mountPath: /entrypoints
            readOnly: true
        {{ end }}
      containers:
        - name: {{ $config.serviceType }}
          resources:
            requests:
              memory: {{ $config.requestedMemory }}
              cpu: {{ $config.requestedCpu }}
          {{- if or $config.limitedMemory $config.limitedCpu }}
            limits:
            {{- if $config.limitedMemory }}
              memory: {{ $config.limitedMemory }}
            {{- end }}
            {{- if $config.limitedCpu }}
              cpu: {{ $config.limitedCpu }}
            {{- end }}
          {{- end }}
          image: {{ print $containerImage ":" $containerImageVersion | quote }}
          imagePullPolicy: IfNotPresent
          {{- if $debug }}
          command:
          - /bin/sleep
          args:
          - infinity
          {{- else }}
          command:
          - /opt/swh/entrypoint.sh
          args:
          - swh
          - datasets
          - luigi
          - --base-directory
          - {{ $config.graphDirectoryPath | quote }}
          - --dataset-name
          - {{ $datasetGeneratorName | quote }}
          - {{ $config.datasetGeneratorTask | quote }}
          - --
          - --scheduler-url
          - {{ $config.luigiSchedulerUrl | quote }}
          - --LocalExport-export-task-type
          - ExportGraph
          - --LocalExport-local-sensitive-export-path
          - {{ $config.graphDirectoryPath | quote }}
          - --ExportGraph-config-file
          - {{ $config.configPath | quote }}
          - --ExportGraph-process
          - {{ $config.nbProcesses | quote }}
          - --CompressGraph-local-export-path
          - {{ $config.graphDirectoryPath | quote }}
          - --CompressGraph-local-graph-path
          - {{ $config.graphDirectoryPath | quote }}
          - --CompressGraph-local-sensitive-export-path
          - {{ $config.graphDirectoryPath | quote }}
          - --CompressGraph-test-flavor
          - "none"
          - --log-level
          - {{ $config.logLevel | quote }}
          - --Llp-gammas=-1,-2,-3,-4
          {{ end }}
          env:
            {{- if $debug }}
            - name: SWH_DEBUG_ENTRYPOINT
              value: "1"
            {{- end }}
            - name: LUIGI_CONFIG_PATH
              value: {{ $luigiConfigPath | quote }}
            - name: LUIGI_CONFIG_PARSER
              value: cfg
          volumeMounts:
          - name: luigi-configuration
            mountPath: {{ $luigiConfigDirpath | quote }}
          {{ if (or (eq $generatorTask "CompressGraph") (eq $generatorTask "ExportGraph")) }}
          - name: dataset-configuration
            mountPath: /etc/swh
          {{ end }}
          {{- range $volumeName, $volumeConfig := $datasetGeneratorConfig.extraVolumes }}
          - name: {{ $volumeName }}
            mountPath: {{ $volumeConfig.mountPath }}
            readOnly: {{ $volumeConfig.readOnly | default "false" }}
          {{ end }}
      volumes:
      {{ if (or (eq $generatorTask "CompressGraph") (eq $generatorTask "ExportGraph")) }}
      - name: dataset-configuration
        emptyDir: {}
      - name: {{ $config.serviceType }}-config-template
        configMap:
          name: {{ $config.serviceType }}-journal-client-config-template
          items:
          - key: "config.yml.template"
            path: "config.yml.template"
      - name: config-utils
        configMap:
          name: config-utils
          defaultMode: 0555
      {{ end }}
      - name: luigi-configuration
        emptyDir: {}
      - name: luigi-scheduler-config-template
        configMap:
          name: luigi-scheduler-configuration-template
          items:
          - key: "luigi.cfg.template"
            path: "luigi.cfg.template"
      - name: luigi-config-utils
        configMap:
          name: luigi-config-utils
          defaultMode: 0555
      {{- range $volumeName, $volumeConfig := $datasetGeneratorConfig.extraVolumes }}
      - name: {{ $volumeName }}
        {{- toYaml $volumeConfig.volumeDefinition | nindent 8 }}
      {{ end }}
{{ end }}
{{ end }}
{{ end }}
