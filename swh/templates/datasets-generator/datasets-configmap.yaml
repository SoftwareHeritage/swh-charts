{{- $datasetsGeneratorConfig := .Values.datasetsGenerator -}}
{{- $datasetsConfig := $datasetsGeneratorConfig.datasets -}}
{{- if and $datasetsGeneratorConfig.enabled $datasetsConfig.enabled -}}
{{- range $datasetExportName, $datasetExportConfig := $datasetsConfig.deployments -}}
{{- if or (not (hasKey $datasetsGeneratorConfig "enabled")) (get $datasetsGeneratorConfig "enabled")
          (not (hasKey $datasetExportConfig "enabled")) (get $datasetExportConfig "enabled") -}}
{{- $config := include "swh.datasets.export.config"
      (dict "datasetExportName"             $datasetExportName
            "exportConfiguration"           $datasetExportConfig
            "datasetsGeneratorConfiguration" $datasetsGeneratorConfig
            "Values"                        $.Values) | fromYaml -}}
{{- $exportTask := $config.datasetExportTask -}}
{{- if (or (eq $exportTask "CompressGraph") (eq $exportTask "ExportGraph")) -}}
{{- $journalConfigRef := $datasetsGeneratorConfig.journalClientConfigurationRef | default $datasetsConfig.journalClientConfigurationRef -}}
{{- $journalConfigurationRef := required (print "Mandatory key <journalConfigurationRef> missing.") $journalConfigRef -}}
{{- $maskingDbConfigRef := $datasetExportConfig.maskingDbConfigurationRef | default $datasetsConfig.maskingDbConfigurationRef -}}
{{- $maskingDbConfigurationRef := required (print "Mandatory key <maskingDbConfigurationRef> missing.") $maskingDbConfigRef -}}
{{- $connstring := include "swh.connstring" (dict "configurationRef" $maskingDbConfigurationRef
                                                  "Values" $.Values) -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $config.serviceType }}-journal-client-config-template
  namespace: {{ $config.namespace }}
data:
  config.yml.template: |
    {{- include "swh.journalClientConfiguration" (dict "configurationRef" $journalConfigurationRef
                                                       "Values" $.Values) | nindent 4 }}
    masking_db: {{ $connstring }}
    profile: release
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
