{{- $datasetsGeneratorConfig := .Values.datasetsGenerator -}}
{{- $luigiSchedulerConfig := $datasetsGeneratorConfig.scheduler -}}
{{- if (and (or (not (hasKey $datasetsGeneratorConfig "enabled")) (get $datasetsGeneratorConfig "enabled"))
            (or (not (hasKey $luigiSchedulerConfig "enabled")) (get $luigiSchedulerConfig "enabled"))) -}}
{{- $schedulerConfig := include "swh.luigi.scheduler.config"
                                (dict "luigiSchedulerConfig"    $luigiSchedulerConfig
                                      "datasetsGeneratorConfig" $datasetsGeneratorConfig
                                      "Values"                  $.Values) | fromYaml -}}
{{- include "swh.service" (dict "Values"        .Values
                                "serviceType"   $schedulerConfig.serviceType
                                "configuration" $schedulerConfig) -}}
{{ end }}
