{{- $datasetsGeneratorConfig := .Values.datasetsGenerator -}}
{{- $deploymentConfig := $datasetsGeneratorConfig.scheduler -}}
{{- if (and (or (not (hasKey $datasetsGeneratorConfig "enabled")) (get $datasetsGeneratorConfig "enabled"))
            (or (not (hasKey $deploymentConfig "enabled")) (get $deploymentConfig "enabled"))) -}}
{{- $serviceType := "luigi-scheduler" -}}
{{- include "swh.service" (dict "Values"        .Values
                                "serviceType"   $serviceType
                                "configuration" $deploymentConfig) -}}
{{ end }}
