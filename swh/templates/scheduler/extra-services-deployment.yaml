{{ if and .Values.scheduler.enabled .Values.scheduler.extraServices -}}
{{- if or (not (hasKey .Values.scheduler.extraServices "enabled")) (get .Values.scheduler.extraServices "enabled") -}}

{{- $image := .Values.swh_scheduler_image }}
{{- $image_version := .Values.swh_scheduler_image_version }}
{{- $namespace := .Values.namespace }}
{{- $sentry := .Values.scheduler.sentry }}
{{- $affinity := .Values.scheduler.affinity }}
{{- range $service_type, $deployment_config := .Values.scheduler.extraServices -}}
{{- $deployment_config = include "swh.scheduler.deploymentConfig"
                          (dict "deploymentConfig" $deployment_config
                                "Values"           $.Values) | fromYaml -}}
{{- $configurationDict := (dict "configuration" $deployment_config
                                "name"          $service_type
                                "Values"        $.Values) -}}
{{- $configurationChecksum := include "swh.scheduler.extraService.configmap" $configurationDict | sha256sum -}}
{{- $service_name := ( print "scheduler-" $service_type ) -}}
{{- $logLevel := get $deployment_config "logLevel" | default $.Values.scheduler.logLevel -}}
{{- $enabled := get $deployment_config "enabled" -}}
{{- $taskTypes := get $deployment_config "taskTypes" | default list -}}
{{- $visitTypes := get $deployment_config "visitTypes" | default list -}}
{{- $taskTypePatterns := get $deployment_config "taskTypePatterns" | default list -}}
{{- if $enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $namespace }}
  name: {{ $service_name }}
  labels:
    app: {{ $service_name }}
spec:
  revisionHistoryLimit: 2
  {{ if $deployment_config.replicas -}}
  replicas: {{ $deployment_config.replicas }}
  {{ end -}}
  selector:
    matchLabels:
      app: {{ $service_name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{ $service_name }}
      annotations:
        checksum/config: {{ $configurationChecksum }}
    spec:
      {{- if $affinity }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      {{- if and $.Values.podPriority.enabled $.Values.scheduler.priorityClassName }}
      priorityClassName: {{ $.Values.namespace }}-{{ $.Values.scheduler.priorityClassName }}
      {{- end }}
      initContainers:
        - name: prepare-configuration
          image: {{ $.Values.swh_utils_image }}:{{ $.Values.swh_utils_image_version }}
          imagePullPolicy: IfNotPresent
          command:
          - /bin/bash
          args:
          - -c
          - eval echo "\"$(</etc/swh/configuration-template/config.yml.template)\"" > /etc/swh/config.yml
          env: {{ include "swh.secrets.envFromDeploymentConfig" (dict "deploymentConfig" $deployment_config
                                                                      "Values" $.Values) | nindent 10 }}
          volumeMounts:
          - name: configuration
            mountPath: /etc/swh
          - name: configuration-template
            mountPath: /etc/swh/configuration-template
      containers:
        - name: {{ $service_name }}
          resources:
            requests:
              memory: {{ get $deployment_config "requestedMemory" | default "512Mi" }}
              cpu: {{ get $deployment_config "requestedCpu" | default "500m" }}
          {{- if or ( get $deployment_config "limitedMemory" ) ( get $deployment_config "limitedCpu" ) }}
            limits:
            {{- if ( get $deployment_config "limitedMemory" ) }}
              memory: {{ get $deployment_config "limitedMemory" }}
            {{- end }}
            {{- if ( get $deployment_config "limitedCpu" ) }}
              cpu: {{ ( get $deployment_config "limitedCpu" ) }}
            {{- end }}
          {{ end }}
          image: {{ $image }}:{{ $image_version }}
          command:
          - /opt/swh/entrypoint.sh
          args:
          - swh
          - scheduler
          - --config-file
          - /etc/swh/config.yml
          {{- if and (contains "runner" $service_type) (not (contains "first-visits" $service_type)) }}
          - start-runner
          - --period
          - {{ get $deployment_config "period" | default 10 | quote }}
          {{- if $taskTypes }}
          {{- range $task_type := $taskTypes }}
          - --task-type
          - {{ $task_type }}
          {{- end -}}
          {{- end }}
          {{- if $taskTypePatterns }}
          {{- range $taskTypePattern := $taskTypePatterns }}
          - --task-type-pattern
          - {{ $taskTypePattern | quote }}
          {{- end -}}
          {{- end }}
          {{- if ( eq "runner-priority" $service_type ) }}
          - --with-priority
          {{- end }}
          {{- end }}
          {{- if ( eq "listener" $service_type ) }}
          # listener
          - start-listener
          {{- end }}
          {{- if ( eq "runner-first-visits" $service_type ) }}
          - start-runner-first-visits
          - --period
          - {{ get $deployment_config "period" | default 10 | quote }}
          {{- end }}
          {{- if ( eq "schedule-recurrent" $service_type ) }}
          - schedule-recurrent
          {{- if $visitTypes }}
          {{- range $visitType := $visitTypes }}
          - --visit-type
          - {{ $visitType }}
          {{- end }}
          {{- end }}
          {{- end }}
          env:
            - name: STATSD_HOST
              value: {{ $.Values.statsdExternalHost | default "prometheus-statsd-exporter" | quote }}
            - name: STATSD_PORT
              value: {{ $.Values.statsdPort | default "9125" | quote }}
            - name: STATSD_TAGS
              value: deployment:{{ $service_name }}
            - name: SWH_CONFIG_FILENAME
              value: /etc/swh/config.yml
            - name: SWH_LOG_LEVEL
              value: {{ $logLevel | quote }}
          {{- if ( get $sentry "enabled" ) }}
            - name: SWH_SENTRY_ENVIRONMENT
              value: {{ $.Values.sentry.environment }}
            - name: SWH_MAIN_PACKAGE
              value: swh.scheduler
            - name: SWH_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ get $sentry "secretKeyRef" }}
                  key: {{ get $sentry "secretKeyName" }}
                  # if the setting doesn't exist, sentry issue pushes will be disabled
                  optional: false
            - name: SWH_SENTRY_DISABLE_LOGGING_EVENTS
              value: "true"
          {{- end }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - name: configuration
            mountPath: /etc/swh
      volumes:
      - name: configuration
        emptyDir: {}
      - name: configuration-template
        configMap:
          name: extra-services-configuration-{{ $service_type }}
          items:
          - key: "config.yml.template"
            path: "config.yml.template"

{{ end }}
{{ end }}
{{ end }}
{{- end -}}
