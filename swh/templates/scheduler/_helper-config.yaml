{{/* Hydrate a scheduler (tool) deployment config from defaults*/}}
{{- define "swh.scheduler.deploymentConfig" -}}
{{- $defaults := (pick .Values.scheduler "schedulerConfigurationRef" "celeryConfigurationRef" "enabled") -}}
{{- $merged := mustMergeOverwrite $defaults .deploymentConfig -}}
{{ $merged | toYaml }}
{{- end -}}

{{/* Hydrate an extra scheduler service deployment config from defaults */}}
{{ define "swh.scheduler.extraService.configmap" }}
{{ $extraConfig := .configuration.extraConfig | default dict -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}
  namespace: {{ .Values.namespace }}
data:
  config.yml.template: |
    {{- include "swh.schedulerConfiguration" (dict "configurationRef" .configuration.schedulerConfigurationRef
                                                   "Values" .Values) | nindent 4 }}

    {{- include "celery.configuration" (dict "configurationRef" .configuration.celeryConfigurationRef
                                             "Values" .Values) | nindent 4 }}
    {{- if $extraConfig }}
    {{- toYaml $extraConfig | nindent 4 }}
    {{- end }}

{{ end }}
