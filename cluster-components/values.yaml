---
# Should be set
# clusterName: ""

# Main common configuration for the chart.
namespace: cluster-components

# Name of the vault auth used to connect to openbao when enabled
vaultAuthRef: openbao-vso-auth

# All applications whose 'enabled' flag is false by default are applications that are
# already installed in the cluster by the main swh provisioning except for the clusters
# minikube (local dev) and rancher (admin cluster).
cert-manager:
  enabled: false
  # Supported in the chart, not seen on the pods...
  priorityClassName: cluster-components-system

# Whether to activate metallb and allocate some ipAddressPool
metallb:
  enabled: false
  namespace: metallb
  # ipAddressPool:
  #   - ip1
  #   - ip2

prometheus:
  enabled: false
  # Not working somehow... Charts reference it but it's not seen in minikube
  priorityClassName: cluster-components-system
  namespaceOverride: cattle-monitoring-system
  grafana:
    namespaceOverride: cattle-monitoring-system
  prometheus-node-exporter:
    namespaceOverride: cattle-monitoring-system
  kube-state-metrics:
    namespaceOverride: cattle-monitoring-system

# This configuration is swh specific (and independent from the prometheus configuration
# already done during terraform provisioning). When activated, this allows to relay the
# cluster's prometheus alerts to the cluster admin's alertmanager ingress irc relay
alertmanagerConfig:
  enabled: false
  namespace: cattle-monitoring-system
  ircRelayHost: https://alertmanager-irc-relay.internal.admin.swh.network/swh-sysadm
  # .htaccess or authentication credentials
  authentication:
    enabled: true
    secretRef: alertmanager-irc-relay-config
    userKeyRef: user
    passwordKeyRef: password
  # inhibitorRules:
  #   - targetMatch:
  #     - name: mylabel
  #       value: myvalue
  #     ...

alertmanagerIrcRelay:
  enabled: false
  namespace: cattle-monitoring-system
  priorityClassName: cluster-components-system
  secretRef: alertmanager-irc-relay
  userKeyRef: user
  passwordKeyRef: password
  ingress:
    enabled: true
    hosts:
      - alertmanager-irc-relay.admin.swh.network
      - alertmanager-irc-relay.internal.admin.swh.network
    # secret holding the .htpasswd information
    authentication: basic-auth
    tls:
      enabled: true
      # clusterIssuer: letsencrypt-production
  http_port: 8000
  # Room to connect to
  room: swh-sysadm
  # requestedMemory: "128Mi"
  # requestedCpu: "500"
  # optional
  # limitedMemory: "256Mi"
  # limitedCpu: "1000"

blackboxExporter:
  enabled: false
  priorityClassName: cluster-components-system
  nameOverride: blackbox-exporter
  namespaceOverride: cattle-monitoring-system
  serviceMonitor:
    enabled: true
    selfMonitor:
      enabled: true
    prometheusRule:
      enabled: true
  pspEnabled: false
  config:
    modules:
      swh_www:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          follow_redirects: true
          preferred_ip_protocol: "ip4"
          fail_if_body_not_matches_regexp:
            - '<title>.*Software Heritage</title>'
      icmp:
        prober: icmp
        icmp:
          preferred_ip_protocol: ip4
  # This config is needed for ICMP probing: you need NET_RAW to send ICMP
  # packets as non-root.
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      add: ["NET_RAW"]

podPriority:
  enabled: false
  priorities:
    cluster-components-system:
      range: 50000-100000
      value: 75000
      description: Highest pod priorities (ingress, operator, collector, controller)
    cluster-components-storage:
      range: 25000-26000
      value: 25500
      description: Backend storages used by other services

svix:
  enabled: false
  # Namespace where to run the svix server (can be overridden per instance)
  namespace: svix-server
  priorityClassName: cluster-components-storage
  # The kubernetes secret reference holding the secrets necessary for svix to run
  # (can be overridden per instance)
  # - SVIX_JWT_SECRET
  # - APP_DB_PASS
  # - APP_DB_USER
  secretsRef: svix-server-secrets
  # Svix-server version must match the svix python library
  # in the swh-webhooks image's requirements (can be overriden per instance)
  version: v1.82
  # Default white list subnets (can be overridden per instance)
  whitelistSubnets: []
  # Whether to disable tls (can be overridden per instance)
  tlsDisable: false
  # Redis configuration (can be overridden per instance)
  redis:
    # The dsn to access the redis instance (independent of the enabled above)
    # dsn: redis.internal.softwareheritage.org
  # Postgres configuration (can be overridden per instance)
  postgres:
    # The namespace where to install or read postgresql related configuration
    # namespace: cnpg
    # The dsn to access the postgres instance (independent of the enabled above)
    # dsn: db1.internal.softwareheritage.org
    cleanupExpiredMessages:
      enabled: false
      # Default cron (each monday 1am), can be overridden per instance
      cron: "0 1 * * mon"
  # Grant guest access at init/bootstrap time (can be overridden per instance)
  grantGuestAccess: false
  deployments: {}
    # instance-name:
    #   ingress:
    #     host: svix.example.org
    #     createTLS: true
    #   requestedMemory: 100Mi
    #   requestedCpu: 100m
    #   postgres:
    #     requestedMemory: 100Mi
    #     requestedCpu: 100m
    #     persistentVolume: false
    #   redis:
    #     requestedMemory: 100Mi
    #     requestedCpu: 100m
    #     persistentVolume: false
    #     # podSelectorPolicy:
    #     #   matchLabels:
    #     #     app: redis-svix-leader

alerting:
  enabled: false
  period:
    microDelay: 2m
    tinyDelay: 5m
    smallDelay: 15m
  cassandra:
    unrepairedSize: 214748364800
  saveCodeNow:
    aggregatedPeriod: 1h
    threshold: 10
  runbookUrl: "https://runbooks.prometheus-operator.dev/runbooks"
  ingress:
    errorRate: 10
    p90DurationThreshold: 5 # in second
  cnpg:
    transactionThresholds:
      db-swh-scheduler: 1200
    transactionThresholdDefault: 300

# For internal (to the k8s cluster) metrics to integrate into thanos
scrapeClusterMetrics:
  enabled: false
  interval: 30s
  deployments:
    # internal-cassandra:
    #   interval: 60s
    #   # Name of the port used to exposed metrics (e.g. metrics, jmx-metrics, ...).
    #   # Default to "metrics".
    #   # metricsEndpointPortName: metrics

# For external (to the k8s cluster) metrics to integrate into thanos
scrapeExternalMetrics:
