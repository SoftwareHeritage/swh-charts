gitlabRunner:
  enabled: false
  nameOverride: gitlab-runner
  # Namespace where to deploy gitlab-runner
  namespace: gitlab-runner
  runners:
    secret: gitlab-runner
    jobNamespace: gitlab-runner

renovate:
  enabled: false
  namespace: renovate
  # Frequency
  schedule: "@weekly"
  # (required) The secret referencing accesses to the forges to scan for updates, this
  # secretName: renovate-env
  # This secret ^ requires the following key entries:
  # # Gitlab Personal Access Token with permissions read_repository, write_repository, read_api
  # RENOVATE_TOKEN: "redacted"
  # # Acceptance of the TOS (Terms of Service) Mend
  # MEND_RNV_ACCEPT_TOS: "y"
  # # Public license (limited to 10 copies) or a personal license
  # MEND_RNV_LICENSE_KEY: "redacted"
  # # Personal user token for github for fetching changelogs
  # GITHUB_COM_TOKEN: "redacted"
  # renovate docker image
  image:
    repository: renovate/renovate
    tag: 43.31-full
  # level and debug option | info | warn | error
  logLevel: "info"
  # (required) Name of the Kubernetes Secret containing sensitive variables
  # secretName: renovate-env
  # (required) Endpoint to scan repositories from
  gitlabEndpoint: "dummy.gitlab.fr/api/v4"
  # Allow to add some extra configuration from the values
  # Whether to autodiscover updates on repositories
  autodiscover: false
  # Whether to enable the cache directory option
  cachedir:
    enabled: false
    # Ensure this pvc exists
    pvcName: renovate-cache-pvc
    # Where to mount such cache in the cronjob's pod container
    mountpath: /tmp/renovate/cache
  # List of repositories to scan for updates
  repositories: []

openbao:
  enabled: false
  namespace: openbao
  endpoint: https://openbao.internal.admin.swh.network
  secretNameRef: openbao-initial-secrets
  # List of namespaces to manage for vault authentication in client cluster (can be
  # overridden per deployment instance)
  namespacesToManageInOpenbaoClientCluster: []
  # To allow extra verbosity in output
  verbose: false
  # To allow introspection within the cronjob
  debug: false
  # Enable the cluster role/rolebinding's necessary setup in the cluster client so the
  # secrets to access openbao can be written by the process in charge (in the admin
  # cluster)
  rbac:
    enabled: false
  # Deploy cronjobs instance per cluster
  deployments: {}

kafkabackup:
  enabled: false
  namespace: kafkabackup
  # Frequency
  schedule: "@daily"
  image:
    repository: 'container-registry.softwareheritage.org/swh/infra/swh-apps/kafkabackup'
    tag:  '20260330.2'
  # bootstrapServer: one of the kafka brokers
  backupUser: "kafkabackup"
  remoteVenv: "/var/lib/kafkabackup/venv"
  zfsDataset: "data/kafka"
  # storageBackend: s3 | azureblob
  storageSecretsName: "kafkabackup-storage-secrets"
  azureblob: {}
    # container: s3 container name
  s3:
    # host: s3 hostname (possibly with :port)
    # region: s3 region
    # bucket: s3 bucket name
    ssl: true
  ssh:
    secretKeyName: "kafkabackup-ssh-key"
    knownHosts: [] # list of strings, one for each known_hosts line
  kafkaHosts: {}  # Specify /etc/hosts overrides for kafka brokers
