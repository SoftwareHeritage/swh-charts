cloudnativePg:
  enabled: false
  monitoringEnabled: true
  namespace: cnpg
  # Determine the postgresql image to use (this can be overriden per db instance)
  imageCatalogRef: 17
  # External load balancer configuration (can be overridden per pooler db instance)
  externalLoadBalancer:
    enabled: false
    port: 5432
  nameOverride: cloudnative-pg
  # Default storage volume (can be overridden per instance)
  storage: {}
  # Default wal storage volume (can be overridden per instance)
  walStorage: {}
  # Add extra finalizers, one use case could be to prevent deletion (so we
  # need to drop it explicitly for the actual cleanup to happen)
  finalizers: []
  backup:
    # Backup system type is in ("in-tree", "plugin"). Defaults to "in-tree" for now.
    # - plugin: Dedicated backup system implemented out-of cloudnative-pg's tree
    # - in-tree: Deprecated backup system integrated in-tree with cloudnative-pg
    systemType: plugin
  # secrets must be stored in the same namespace
  # namespace: cnpg
  # Specific postgresql setup (can be overridden per instance)
  postgresql:
    parameters:
      # Enable pg_stat_statements extension (for query metrics analysis)
      # https://cloudnative-pg.io/documentation/current/postgresql_conf/#enabling-pg_stat_statements
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      # https://cloudnative-pg.io/documentation/1.23/postgresql_conf/#changing-configuration
      max_worker_processes: "60"
      # max_connections: "400"
      # shared_buffers: "32GB" # min 128kB
      # log_timezone: 'Etc/UTC'
      # timezone: 'Etc/UTC'
      # lc_messages: 'C.UTF-8' # locale for system error message strings
      # lc_monetary: 'C.UTF-8' # locale for monetary formatting
      # lc_numeric: 'C.UTF-8' # locale for number formatting
      # lc_time: 'C.UTF-8' # locale for time formatting
    pg_hba:
    - host all all all md5
  # Specific storage to use to persist data (can be overridden per instance)
  # storage:
  #   storageClass: local-persistent
  #   size: 1Gi
  # Deploys as many postgresql clusters in the deployment section
  deployments:
    # Name of the cluster is the key followed by its configuration
    # cluster-pg-name:
    #   # whether to enable the <cluster-pg-name> deployment
    #   enabled: false
    #   # whether it's a testing node (if so, disables some security checks for
    #   # drain/uncordon operations), false by default
    #   testing: false
    #   # nb of replicas
    #   instances: 1
    #   # affinity: {}
    #   # nodeSelector: {}
    #   # (optional) barman object store configuration reference if backups are enabled
    #   barmanObjectStoreRef: minioTestObjectStore
    #   # (optional) Upstream cluster to start the dbs from
    #   externalClusterRef: clusterPgStagingDb1
    #   # Whether we enable a pooler (pgbouncher) for access
    #   pooler:
    #     # Whether to activate a pgbouncer service (useful for accessing that pg
    #     # cluster instance from outside the kubernetes cluster via a load-balancer)
    #     enabled: true
    #     default_pool_size: "10"
    #     max_client_conn: "1000"
    #     instances: 3
    #     type: rw
    #   # To initialize the dbs to be managed within the new pg cluster
    #   initdb:
    #     # Whether to initialize some dbs from another (external) pg cluster
    #     enabled: true
    #     # type:
    #     # - microservice: destination cluster is designed to host a single app
    #     # database owned by the specified application user (recommended)
    #     # - monolith: destination cluster is designed to host multiple databases
    #     # and different users, imported from the source cluster
    #     type: monolith
    #     dbs:
    #     - swh-deposit
    #     - swh-scheduler
    #     - swh-web
    #     - swh-vault
    #     # - swh-blocking
    #     # - swh-masking
    #     source: cluster-pg-staging-db1
    #   # Whether to enable regular backups
    #   backup:
    #     enabled: true
    #     retention: "30d"
    #     name: daily-midnight
    #     # every day at midnight
    #     cron: "0 0 0 * * *"

customQueriesSwhScheduler:
  swh_scheduler_origins:
    primary: true
    target_databases:
      - swh-scheduler
    query: |
      select l.name, l.instance_name, sm.visit_type,
        extract(epoch from sm.last_update) as last_update,
        sm.origins_known as known,
        sm.origins_enabled as enabled,
        sm.origins_never_visited as never_visited,
        sm.origins_with_pending_changes as with_pending_changes
      from scheduler_metrics sm
        inner join listers l on sm.lister_id=l.id
      order by l.name, l.instance_name
    metrics:
      - name:
          usage: "LABEL"
          description: "Lister type"
      - instance_name:
          usage: "LABEL"
          description: "Lister instance name"
      - visit_type:
          usage: "LABEL"
          description: "Origin visit type"
      - last_update:
          usage: "GAUGE"
          description: "Timestamp of the last update of this metric"
      - known:
          usage: "GAUGE"
          description: "Number of origins known"
      - enabled:
          usage: "GAUGE"
          description: "Number of origins enabled"
      - never_visited:
          usage: "GAUGE"
          description: "Number of origins never visited"
      - with_pending_changes:
          usage: "GAUGE"
          description: "Number of origins with known pending changes"

