{{- if .Values.postgresqlTest.enabled }}

{{- $namespace := .Values.postgresqlTest.namespace }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-test
  namespace: {{ $namespace }}
  labels:
    app: postgres-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-test

  template:
    metadata:
      labels:
        app: postgres-test

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: keycloak

            - name: POSTGRES_USER
              value: keycloak

            - name: POSTGRES_PASSWORD
              value: keycloak

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-test
  namespace: {{ $namespace }}
  labels:
    app: postgres-test

spec:
  type: ClusterIP

  selector:
    app: postgres-test

  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: postgres

{{- end }}
