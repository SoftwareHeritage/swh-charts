{{- if .Values.rabbitmq.enabled }}
{{- range $deploymentName, $deploymentConfig := .Values.rabbitmq.deployments -}}
{{ $namespace := $.Values.rabbitmq.namespace }}
{{- $secretName := $deploymentConfig.secretRef | default $.Values.rabbitmq.secretRef | default (print $deploymentName "-secret") -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}-vss
  namespace: {{ $namespace }}
spec:
  destination:
    create: true
    name: {{ $secretName }}
    overwrite: true
  mount: secrets-{{ $.Values.clusterName }}
  path: {{ $secretName }}
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: openbao-vso-auth
{{ end }}
{{ end }}
