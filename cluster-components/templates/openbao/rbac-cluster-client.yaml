{{- if .Values.openbao.rbac.enabled -}}
{{- if not .Values.openbao.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
{{- end }}
# To authorize the openbao cronjob orchestration to write secrets in the client cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-secret-writer
  namespace: vso
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-secret-writer-binding
  namespace: vso
subjects:
- kind: ServiceAccount
  name: default
  namespace: openbao
roleRef:
  kind: Role
  name: openbao-secret-writer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
