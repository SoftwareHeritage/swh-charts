{{- $clusterName := .Values.clusterName -}}
{{- with .Values.gitlabRunner }}
{{- if and .enabled (ne $clusterName "local-cluster") }}
{{- $namespace := .namespace -}}
{{- $secretName := dig "runners" "secret" "" . | default "" -}}
{{- if $secretName }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}-vss
  namespace: {{ $namespace }}
spec:
  destination:
    create: true
    name: {{ $secretName }}
    overwrite: true
  mount: secrets-{{ $clusterName }}
  path: {{ $secretName }}
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: {{ $.Values.vaultAuthRef }}
{{ end }}
{{ end }}
{{ end }}
