{{ if .Values.renovate.enabled }}
{{ $appName := print .Values.clusterName "-renovate" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $appName }}
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/instance: {{ $appName }}
spec:
  # Fréquence d’exécution (à weekly par défaut)
  schedule: {{ .Values.renovate.schedule | quote }}

  # Empêche deux exécutions simultanées
  concurrencyPolicy: Forbid
  # Historique des jobs
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
        spec:
          restartPolicy: Never

          containers:
            - name: renovate
              image: {{ .Values.renovate.image.repository }}:{{ .Values.renovate.image.tag }}
              imagePullPolicy: IfNotPresent

              # Les variables d’environnement
              env:
                # Niveau de logs
                - name: RENOVATE_LOG_LEVEL
                  value: {{ .Values.renovate.logLevel | quote }}

                # Plateforme cible (gitlab staging dans notre cas)
                - name: RENOVATE_PLATFORM
                  value: gitlab

                # Endpoint GitLab
                - name: RENOVATE_ENDPOINT
                  value: {{ .Values.renovate.gitlab.endpoint | quote }}

                # Auto-discovery des repos (groupes)
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                
                # Eviter les MàJ majeur et mineur 
                - name: RENOVATE_SEPARATE_MAJOR_MINOR
                  value: "true"
                - name: RENOVATE_SEPARATE_MULTIPLE_MAJOR
                  value: "true"

                # Filtre sur les groupes GitLab
                - name: RENOVATE_AUTODISCOVER_FILTER
                  value: {{ .Values.renovate.gitlab.autodiscoverFilter | quote }}

                # Mode non-interactif
                - name: RENOVATE_REQUIRE_CONFIG
                  value: "required"

                # Optimisation
                - name: RENOVATE_ONBOARDING
                  value: "false"

              envFrom:
                # Les Secrets (PAT et licence)
                - secretRef:
                    name: {{ .Values.renovate.secretName }}

{{ end }}
