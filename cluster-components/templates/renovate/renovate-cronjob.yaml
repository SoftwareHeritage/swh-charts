{{ if .Values.renovate.enabled }}
{{- $appName := print .Values.clusterName "-renovate" -}}
{{- $autodiscover := .Values.renovate.extraConfig.autodiscover | default false -}}
{{- $renovateCachedir := .Values.renovate.extraConfig.cachedir | default (dict "enabled" false) -}}
{{- $repositories := .Values.renovate.extraConfig.repositories | default list -}}
{{- $namespace := $.Values.renovate.namespace -}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $appName }}
  name: {{ $namespace }}
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/instance: {{ $appName }}
spec:
  # Execution frequency (default: weekly)
  schedule: {{ .Values.renovate.schedule | quote }}
  # Prevents two simultaneous executions
  concurrencyPolicy: Forbid
  # Jobs history
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
        spec:
          restartPolicy: Never
          containers:
            - name: renovate
              image: {{ .Values.renovate.image.repository }}:{{ .Values.renovate.image.tag }}
              imagePullPolicy: IfNotPresent
              # Environment variables
              env:
                # Logs levels
                - name: RENOVATE_LOG_LEVEL
                  value: {{ .Values.renovate.logLevel | quote }}
                # Target platform
                - name: RENOVATE_PLATFORM
                  value: "gitlab"
                # GitLab endpoint (URL)
                - name: RENOVATE_ENDPOINT
                  value: {{ .Values.renovate.gitlab.endpoint | quote }}
                # Repositories auto-discover
                - name: RENOVATE_AUTODISCOVER
                  value: {{ $autodiscover | quote }}
                # no-interactif mode
                - name: RENOVATE_REQUIRE_CONFIG
                  value: "required"
                # Onboarding enabling
                - name: RENOVATE_ONBOARDING
                  value: "true"
                {{- if $repositories }}
                # Repositories to scan
                - name: RENOVATE_REPOSITORIES
                  value:
                    {{- toYaml $repositories | nindent 20 }}
                {{- end }}
                {{- if $renovateCachedir.enabled }}
                # Cachedir
                - name: RENOVATE_CACHE_DIR
                  value: {{ $renovateCachedir.mountpath }}
                {{- end }}
              envFrom:
                # Secrets (PAT and licence)
                - secretRef:
                    name: {{ .Values.renovate.secretName }}
              volumeMounts:
              {{- if $renovateCachedir.enabled }}
              - name: cachedir
                mountPath: {{ $renovateCachedir.mountpath }}
              {{- end }}
          volumes:
          {{- if $renovateCachedir.enabled }}
          - name: cachedir
            persistentVolumeClaim:
              claimName: {{ $renovateCachedir.pvcName }}
          {{- end }}
{{ end }}
