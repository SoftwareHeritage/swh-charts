{{ if .Values.kafka.enabled -}}
{{- range $clusterName, $clusterConfig := .Values.kafka.deployments -}}
{{- if (ne false $clusterConfig.enabled) -}}
{{- $replicas := $clusterConfig.replicas | default $.Values.kafka.replicas -}}
{{- $replicationFactor := $clusterConfig.replicationFactor | default $.Values.kafka.replicationFactor -}}
{{- $minInSyncReplica := $clusterConfig.minInSyncReplicas | default $.Values.kafka.minInSyncReplicas -}}
{{- $metricsEnabled := dig "metrics" "enabled" false $clusterConfig | default (dig "metrics" "enabled" false $.Values.kafka) -}}
{{- $metricsType := dig "metrics" "type" nil $clusterConfig | default (dig "metrics" "type" "strimziMetricsReporter" $.Values.kafka) -}}
{{- $kafkaExporterConfig := dig "metrics" "kafkaExporterConfig" dict $clusterConfig | default (dig "metrics" "kafkaExporterConfig" dict $.Values.kafka) -}}
{{- $kafkaVersion := $clusterConfig.version | default $.Values.kafka.version -}}
{{- $namespace := $clusterConfig.namespace | default $.Values.kafka.namespace -}}
{{- $clusterName = $clusterConfig.clusterName | default $clusterName -}}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ $clusterName }}
  namespace: {{ $namespace }}
  annotations:
    strimzi.io/kraft: enabled
    {{- if $clusterConfig.pools }}
    strimzi.io/node-pools: enabled
    {{- end }}
spec:
  {{- if and $metricsEnabled $kafkaExporterConfig }}
  kafkaExporter:
    {{ toYaml $kafkaExporterConfig | nindent 4 }}
  {{- end }}
  kafka:
    version: {{ $kafkaVersion }}
    {{ if not $clusterConfig.pools }}
    replicas: {{ $replicas }}
    {{- if $clusterConfig.storage }}
    storage:
    {{- toYaml $clusterConfig.storage | nindent 6 }}
    {{- end }}
    {{- end }}
    listeners:
      - name: internal-plain
        port: 9092
        type: internal
        tls: false
      - name: internal-authenticated
        port: 9093
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
      - name: internal-tls-authenticated
        port: 9094
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
      # - name: external-tls-authenticated
      #   port: 9095
      #   tls: true
      #   type: loadbalancer
      #   authentication:
      #     type: scram-sha-512
    # Enable acls
    authorization:
      type: simple
    {{- if $metricsEnabled }}
    metricsConfig:
      type: {{ $metricsType }}
      {{- if eq $metricsType "jmxPrometheusExporter" }}
      valueFrom:
        configMapKeyRef:
          name: {{ $clusterName }}-metrics
          key: kafka-metrics-config.yml
      {{- end }}
    {{- end }}
    # authorization:
    #   type: simple
    config:
      offsets.topic.replication.factor: {{ $replicationFactor }}
      transaction.state.log.replication.factor: {{ $replicationFactor }}
      default.replication.factor: {{ $replicationFactor }}
      transaction.state.log.min.isr: {{ $minInSyncReplica }}
      min.insync.replicas: {{ $minInSyncReplica }}
  entityOperator:
    topicOperator: {}
    userOperator: {}

{{ end }}
{{ end }}
{{ end }}
