{{ if .Values.kafka.enabled -}}
{{- range $clusterName, $clusterConfig := .Values.kafka.deployments -}}
{{- if (ne false $clusterConfig.enabled) -}}
{{- $bootstrapServer := print $clusterName "-kafka-bootstrap:9093" -}}
{{- $namespace := $clusterConfig.namespace | default $.Values.kafka.namespace -}}
{{- $clusterName = $clusterConfig.clusterName | default $clusterName -}}
{{- range $userName, $userConfig := $clusterConfig.users -}}
{{- $userSecret := $userConfig.secret | default dict -}}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ $userName }}
  namespace: {{ $namespace }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
spec:
  authentication:
    type: scram-sha-512
    # https://strimzi.io/docs/operators/in-development/deploying#scram_sha_512_authentication
    username: {{ $userName }}
    {{- if $userSecret }}
    password:
      valueFrom:
        secretKeyRef:
          name: {{ $userSecret.ref }}
          key: {{ $userSecret.key }}
    {{- end }}
  authorization:
    type: simple
    acls:
      {{- range $resource := $userConfig.resources }}
      # Example consumer Acls for topic $topicName using consumer group $groupName
      {{- range $topicName := $resource.topics }}
      - resource:
          type: topic
          name: {{ $topicName }}
          patternType: literal
        operations:
          {{- toYaml $resource.operations | nindent 10 }}
        host: "*"
      {{- end }}
      {{- range $groupName := $resource.groups }}
      - resource:
          type: group
          name: {{ $groupName }}
          patternType: literal
        operations:
          {{- toYaml $resource.operations | nindent 10 }}
        host: "*"
      {{- end }}
      {{- end }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}
