{{ if .Values.kafka.enabled -}}
{{- range $clusterName, $clusterConfig := .Values.kafka.deployments -}}
{{- if (ne false $clusterConfig.enabled) -}}
{{- $kafkaVersion := $clusterConfig.version | default $.Values.kafka.version -}}
{{- $namespace := $clusterConfig.namespace | default $.Values.kafka.namespace -}}
{{- $clusterName = $clusterConfig.clusterName | default $clusterName -}}
{{- $mirrorMakerConfig := dig "mirrorMaker" dict $clusterConfig | default (dig "mirrorMaker" dict $.Values.kafka) -}}
{{- if ne false $mirrorMakerConfig.enabled -}}
{{- $mirrorMakerName := print $clusterName "-mirror-maker-2" -}}
{{- $replicas := $mirrorMakerConfig.replicas | default 1 -}}
{{- $mirrorSource := required (print "Kafka <kafka.mirrorMaker.source> entry required") $mirrorMakerConfig.source -}}
{{- $topicsPattern := $mirrorMakerConfig.topicsPattern | default ".*" -}}
{{- $groupsPattern := $mirrorMakerConfig.groupsPattern | default ".*" -}}
{{- $metricsEnabled := dig "metrics" "enabled" false $clusterConfig | default (dig "metrics" "enabled" false $.Values.kafka) -}}
{{- $metricsType := dig "metrics" "type" nil $clusterConfig | default (dig "metrics" "type" "strimziMetricsReporter" $.Values.kafka) -}}
{{- $kafkaExporterConfig := dig "metrics" "kafkaExporterConfig" dict $clusterConfig | default (dig "metrics" "kafkaExporterConfig" dict $.Values.kafka) -}}
{{- $sourceConnectorTasksMax := $mirrorMakerConfig.sourceConnectorTasksMax | default 1 -}}
{{- $checkpointConnectorTasksMax := $mirrorMakerConfig.checkpointConnectorTasksMax | default 1 -}}
{{- $groupId := print $mirrorMakerName "-group" -}}
{{- $configStorageTopic := print "__" $mirrorMakerName "-config" -}}
{{- $offsetStorageTopic := print "__" $mirrorMakerName "-offset" -}}
{{- $statusStorageTopic := print "__" $mirrorMakerName "-status" -}}
{{- $mirrorMakerUserName := print $mirrorMakerName "-user" -}}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaMirrorMaker2
metadata:
  name: {{ $mirrorMakerName }}
  namespace: {{ $namespace }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
spec:
  version: {{ $kafkaVersion }}
  {{- if $replicas }}
  replicas: {{ $replicas }}
  {{- end }}
  resources:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
  # Target is our kubernetes cluster declared
  target:
    alias: {{ $clusterName }}
    bootstrapServers: {{ $clusterName }}-kafka-bootstrap:9094
    authentication:
        type: scram-sha-512
        username: {{ $mirrorMakerUserName }}
        passwordSecret:
          secretName: {{ $mirrorMakerUserName }}
          password: password
    tls:
      trustedCertificates:
        - secretName: {{ $clusterName }}-cluster-ca-cert
          pattern: "*.crt"
    groupId: {{ $groupId }}
    # internal topics should be prefixed with __ to be excluded from mirroring
    # by default
    configStorageTopic: {{ $configStorageTopic }}
    offsetStorageTopic: {{ $offsetStorageTopic }}
    statusStorageTopic: {{ $statusStorageTopic }}
    config:
      # -1 means it will use the default replication factor configured in the
      # -broker
      config.storage.replication.factor: -1
      offset.storage.replication.factor: -1
      status.storage.replication.factor: -1
      # It is the fastest strategy and is compatible with MirrorMaker
      # connectors, significantly improving worker start-up time
      plugin.discovery: service_load
  {{- if $metricsEnabled }}
  metricsConfig:
    type: {{ $metricsType }}
    {{- if eq $metricsType "jmxPrometheusExporter" }}
    valueFrom:
      configMapKeyRef:
        name: {{ $clusterName }}-mirror-maker2-metrics
        key: kafka-mirror-maker2-metrics-config.yml
    {{- end }}
  {{- end }}
  mirrors:
  - source:
      {{- toYaml $mirrorSource | nindent 6 }}
    sourceConnector:
      # The maximum number of tasks for the Kafka Connector.
      tasksMax: {{ $sourceConnectorTasksMax }}
      # Whether automatic restart for failed connectors and tasks should be enabled or
      # disabled.
      autoRestart:
        enabled: true
        # The maximum number of connector restarts that the operator will try. If the
        # connector remains in a failed state after reaching this limit, it must be
        # restarted manually by the user. Defaults to an unlimited number of restarts.
        maxRestarts: 3
      config:
        # The replication factor for newly created remote topics (-1 uses the target
        # broker default)
        replication.factor: -1
        # The replication factor for the internal offset-syncs topic
        offset-syncs.topic.replication.factor: -1
        # Controls whether topic ACLs are synchronized from the source cluster
        sync.topic.acls.enabled: "false"
        # The cluster where the internal offset-syncs topic is created (e.g., target)
        offset-syncs.topic.location: "target"
        # The interval in seconds to check for new topics matching the topicsPattern
        refresh.topics.interval.seconds: 60
        # The maximum offset lag allowed before triggering synchronization
        # offset.lag.max: 100
        # The replication policy class used; IdentityReplicationPolicy keeps topic names
        # identical without prepending the source cluster alias
        replication.policy.class: "org.apache.kafka.connect.mirror.IdentityReplicationPolicy"
        # The minimum amount of data the server should return for a fetch request (1 byte by default)
        fetch.min.bytes: 1024
        # The maximum amount of time the server will block before answering the fetch
        # request when there isn’t sufficient data to immediately satisfy the
        # requirement given by fetch.min.bytes (default 500)
        fetch.max.wait.ms: 5000
        # The maximum amount of data the server should return for a fetch request
        # (default 50Mib)
        fetch.max.bytes: 52428800
        # The maximum number of records returned in a single call to poll (default 500)
        max.poll.records: 500
        # connector.client.config.override.policy: All
    checkpointConnector:
      # The maximum number of tasks for the Kafka Connector.
      tasksMax: {{ $checkpointConnectorTasksMax }}
      autoRestart:
        enabled: true
        maxRestarts: 3
      config:
        # Replication factor for the internal checkpoints topic (-1 uses the broker's
        # default replication factor)
        checkpoints.topic.replication.factor: -1
        # Disables synchronizing consumer group offsets directly into the target
        # cluster's __consumer_offsets topic
        sync.group.offsets.enabled: "false"
        # The interval in seconds to check for new consumer groups to track
        refresh.groups.interval.seconds: 60
        # The location of the offset-syncs topic, which must match the sourceConnector
        # location to read offset mappings correctly
        offset-syncs.topic.location: "target"
        # The replication policy class used; IdentityReplicationPolicy keeps topic names
        # identical without prepending the source cluster alias
        replication.policy.class: "org.apache.kafka.connect.mirror.IdentityReplicationPolicy"
    topicsPattern: {{ $topicsPattern | quote }}
    groupsPattern: {{ $groupsPattern | quote }}

# Enable the KafkaUser to use to authenticate mirror maker to the target cluster
# It's mandatory when enable the authorization type simple in the kafka cluster...
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ $mirrorMakerUserName }}
  namespace: {{ $namespace }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      # cluster group
      - resource:
          type: group
          name: {{ $groupId }}
        operations:
          - Read
      # access to config.storage.topic
      - resource:
          type: topic
          name: {{ $configStorageTopic }}
        operations:
          - Create
          - Describe
          - DescribeConfigs
          - Read
          - Write
      # access to status.storage.topic
      - resource:
          type: topic
          name: {{ $statusStorageTopic }}
        operations:
          - Create
          - Describe
          - DescribeConfigs
          - Read
          - Write
      # access to offset.storage.topic
      - resource:
          type: topic
          name: {{ $offsetStorageTopic }}
        operations:
          - Create
          - Describe
          - DescribeConfigs
          - Read
          - Write
      # MirrorSourceConnector
      - resource: # Needed for every topic which is mirrored
          type: topic
          name: "*"
          patternType: literal
        operations:
          - Create
          - Alter
          - AlterConfigs
          - Write
      # MirrorCheckpointConnector
      - resource:
          type: cluster
        operations:
          - Describe
      - resource:
          type: topic
          name: {{ $clusterName }}-source.checkpoints.internal
        operations:
          - Create
          - Describe
          - Read
          - Write
      - resource: # Needed for every group for which the offset is synced
          type: group
          name: "*"
          patternType: literal
        operations:
          - Read
          - Describe
{{- end }}
{{- end }}
{{- end }}
{{- end }}
