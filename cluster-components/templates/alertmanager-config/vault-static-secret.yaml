{{- $clusterName := .Values.clusterName -}}
{{- with .Values.alertmanagerConfig }}
{{- if and .enabled .authentication.enabled (ne $clusterName "local-cluster") }}
{{ $namespace := .namespace }}
{{ $secretName := .authentication.secretRef }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}-vss
  namespace: {{ $namespace }}
spec:
  destination:
    create: true
    name: {{ $secretName }}
    overwrite: true
  mount: secrets-{{ $.Values.clusterName }}
  path: {{ $secretName }}
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: {{ $.Values.vaultAuthRef }}
{{- end }}
{{- end }}
