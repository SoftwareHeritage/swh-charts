{{- if and .Values.cloudnativePg.enabled (ne .Values.clusterName "local-cluster") -}}
{{ $secrets := list }}
{{ range $clusterName, $clusterConfig := .Values.cloudnativePg.deployments }}
{{ $namespace := $clusterConfig.namespace | default $.Values.cloudnativePg.namespace }}
{{ $secretUser := dig "database" "secretKeyRef" "" $clusterConfig }}
{{ if $secretUser }}
{{ $secrets = concat $secrets (list (list $secretUser $namespace)) }}
{{ end }}
{{ $superUserSecretRef := $clusterConfig.superUserSecretRef | default $.Values.cloudnativePg.superUserSecretRef }}
{{ if $superUserSecretRef }}
{{ $secrets = concat $secrets (list (list $superUserSecretRef $namespace)) }}
{{ end }}
{{ $localRoles := $clusterConfig.roles | default list }}
{{ $globalRoles := $.Values.cloudnativePg.roles | default list }}
{{ $roles := concat $globalRoles $localRoles }}
{{ range $role := $roles }}
{{ $secrets = append $secrets (list $role.passwordSecret.name $namespace) }}
{{ end }}
{{ end }}
{{- range $secret := uniq $secrets -}}
{{ $secretName := first $secret }}
{{ $namespace := last $secret }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}-vss
  namespace: {{ $namespace }}
spec:
  destination:
    create: true
    labels:
      cnpg.io/reload: 'true'
    name: {{ $secretName }}
    overwrite: true
    type: kubernetes.io/basic-auth
  mount: secrets-{{ $.Values.clusterName }}
  path: {{ $secretName }}
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: {{ $.Values.vaultAuthRef }}
{{- end }}
{{- end }}
