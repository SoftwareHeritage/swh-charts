{{- if .Values.cloudnativePg.enabled -}}
{{- range $clusterName, $clusterConfig := .Values.cloudnativePg.deployments -}}
{{- $namespace := $clusterConfig.namespace | default $.Values.cloudnativePg.namespace -}}
{{ $secretName := $clusterConfig.database.secretKeyRef }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}-vss
  namespace: {{ $namespace }}
spec:
  destination:
    create: true
    labels:
      cnpg.io/reload: 'true'
    name: {{ $secretName }}
    overwrite: true
    type: kubernetes.io/basic-auth
  mount: secrets-{{ $.Values.clusterName }}
  path: {{ $secretName }}
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: openbao-vso-auth
{{- end }}
{{- end }}
