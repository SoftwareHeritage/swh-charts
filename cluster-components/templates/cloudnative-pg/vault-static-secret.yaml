{{- if .Values.cloudnativePg.enabled -}}
{{- range $clusterName, $clusterConfig := .Values.cloudnativePg.deployments -}}
{{ $secretName := $clusterConfig.database.secretKeyRef }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secretName }}-vss
  namespace: cnpg
spec:
  destination:
    create: true
    name: {{ $secretName }}
    overwrite: true
    type: kubernetes.io/basic-auth
  mount: secrets-{{ $.Values.clusterName }}
  path: {{ $secretName }}
  refreshAfter: 10s
  type: kv-v2
  vaultAuthRef: openbao-vso-auth
{{- end }}
{{- end }}
