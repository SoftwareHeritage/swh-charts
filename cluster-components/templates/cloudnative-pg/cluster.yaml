{{- if .Values.cloudnativePg.enabled -}}
{{- range $cluster_name, $cluster_config := .Values.cloudnativePg.deployments -}}
{{- if or (not (hasKey $cluster_config "enabled")) (get $cluster_config "enabled") -}}
{{- $namespace := get $cluster_config "namespace" | default $.Values.cloudnativePg.namespace -}}
{{- $barmanObjectStoreRef := get $cluster_config "barmanObjectStoreRef" | default
      (get $.Values.cloudnativePg "barmanObjectStoreRef") -}}
{{- $barmanObjectStoreDict := get $.Values $barmanObjectStoreRef -}}
{{- $externalClusterRef := get $cluster_config "externalClusterRef" | default
      (get $.Values.cloudnativePg "externalClusterRef") -}}
{{- $externalPgClusterDict := get $.Values $externalClusterRef -}}
{{- $db_type := dig "initdb" "type" "monolith" $cluster_config -}}
{{- $databases := required (print "Missing <$cluster_config.initdb.databases> value managed db in cluster <" $cluster_name ">") $cluster_config.initdb.databases -}}
{{- $config_postgresql := $cluster_config.postgresql | default $.Values.cloudnativePg.postgresql | default dict -}}
{{- $affinity := $cluster_config.affinity | default $.Values.cloudnativePg.affinity | default dict -}}
{{- $testing := $cluster_config.testing | default "false" -}}
{{- $roles := $cluster_config.roles | default $.Values.cloudnativePg.roles -}}
{{- $storage := mustMerge ($cluster_config.storage | default (dict)) $.Values.cloudnativePg.storage -}}
{{- $enableMonitoring := $cluster_config.enableMonitoring | default $.Values.cloudnativePg.enableMonitoring -}}
{{- $enableSuperuserAccess := $cluster_config.enableSuperuserAccess | default $.Values.cloudnativePg.enableSuperuserAccess -}}
{{- $swhCnpgLabeled := $cluster_config.labeled -}}
{{- $delay := $cluster_config.delay -}}
{{- $imageCatalogRef := $cluster_config.imageCatalogRef }}
{{- $walStorage := $cluster_config.walStorage | default false -}}
{{- $services := $cluster_config.services | default false -}}
{{- $limited_cpu := $cluster_config.limitedCpu | default false -}}
{{- $limited_memory := $cluster_config.limitedMemory | default false -}}
{{- $requested_cpu := $cluster_config.requestedCpu | default false -}}
{{- $requested_memory := $cluster_config.requestedMemory | default false -}}
{{- $secret_key_ref := $cluster_config.initdb.secretKeyRef | default false -}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $cluster_name }}
  namespace: {{ $namespace }}
{{- if $swhCnpgLabeled }}
  labels:
    cnpg.io/cluster: {{ $cluster_name }}
{{- end }}
spec:
  instances: {{ $cluster_config.instances | default 1 }}
  {{- if $testing }}
  enablePDB: false
  {{- end }}
  {{- if $delay }}
  startDelay: {{ $delay }}
  stopDelay: {{ $delay }}
  {{- end }}
  {{- if $imageCatalogRef }}
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: {{ $imageCatalogRef }}
  {{- end }}
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: {{ $enableSuperuserAccess }}
  {{- if $affinity }}
  affinity:
    {{- toYaml $affinity | nindent 4 }}
  {{- end }}
  {{- if $storage }}
  storage:
    {{- toYaml $storage | nindent 4 }}
  {{- end }}
  {{- if $walStorage }}
  walStorage:
    {{- toYaml $walStorage | nindent 4 }}
  {{- end }}
  {{- if $roles }}
  managed:
    roles:
    {{- toYaml $roles | nindent 4 }}
    {{- if $services }}
    services:
    {{- toYaml $services | nindent 6 }}
    {{- end }}
  {{- end }}
  {{ if or $limited_cpu $limited_memory }}
  resources:
    requests:
      {{- if $requested_memory }}
      memory: {{ $requested_memory }}
      {{- end }}
      {{- if $requested_cpu }}
      cpu: {{ $requested_cpu }}
      {{- end }}
    limits:
      {{- if $limited_memory }}
      memory: {{ $limited_memory }}
      {{- end }}
      {{- if $limited_cpu }}
      cpu: {{ $limited_cpu }}
      {{- end }}
  {{ end }}
  {{- if $config_postgresql }}
  postgresql:
    {{- toYaml $config_postgresql | nindent 4 }}
  {{- end }}
  monitoring:
    enablePodMonitor: {{ $enableMonitoring }}
  bootstrap:
    {{- if $secret_key_ref }}
    initdb:
      database: {{ first $databases }}
      owner: {{ first $databases }}
      dataChecksums: true
      {{- if $cluster_config.initdb.localeCollate }}
      localeCollate: {{ $cluster_config.initdb.localeCollate }}
      {{- end }}
      {{- if $cluster_config.initdb.localeCType }}
      localeCType:  {{ $cluster_config.initdb.localeCType }}
      {{- end }}
      {{- if $cluster_config.initdb.walSegmentSize }}
      walSegmentSize: {{ $cluster_config.initdb.walSegmentSize }}
      {{- end }}
      secret:
        name: {{ $secret_key_ref }}
    {{- end }}
      dataChecksums: true
      {{- if $cluster_config.initdb.source }}
      import:
        type: {{ $db_type }}
        databases:
          {{- toYaml $databases | nindent 10 }}
        source:
          externalCluster: {{ $cluster_config.initdb.source }}
      {{- end }}

  {{- if and $cluster_config.initdb.source $externalPgClusterDict }}
  externalClusters:
    {{- toYaml (list $externalPgClusterDict) | nindent 4 }}
  {{- end }}

  {{- if and $cluster_config.backup $cluster_config.backup.enabled }}
  # Backup properties
  # This assumes a local minio setup
  backup:
    volumeSnapshot:
      className: local-persistent
      online: true
      # onlineConfiguration:
      #   immediateCheckpoint: true
      #   waitForArchive: false
    retentionPolicy: {{ $cluster_config.backup.retention | default "30d" | quote }}
    {{- if $barmanObjectStoreDict }}
    barmanObjectStore:
      {{- toYaml $barmanObjectStoreDict | nindent 6 }}
    {{- end }}
  {{ end }}

{{ end }}
{{ end }}
{{ end }}
