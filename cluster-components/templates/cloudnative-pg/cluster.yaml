{{- if .Values.cloudnativePg.enabled -}}
{{- range $cluster_name, $cluster_config := .Values.cloudnativePg.deployments -}}
{{- if or (not (hasKey $cluster_config "enabled")) (get $cluster_config "enabled") -}}
{{- $namespace := get $cluster_config "namespace" | default $.Values.cloudnativePg.namespace -}}
{{- $externalClustersRef := get $cluster_config "externalClustersRef" | default
      (get $.Values.cloudnativePg "externalClustersRef") -}}
{{- $externalPgClusters := get $.Values $externalClustersRef -}}
{{- $db_type := dig "initdb" "type" "monolith" $cluster_config -}}
{{- $config_postgresql := $cluster_config.postgresql | default $.Values.cloudnativePg.postgresql | default dict -}}
{{- $affinity := $cluster_config.affinity | default $.Values.cloudnativePg.affinity | default dict -}}
{{- $testing := $cluster_config.testing | default "false" -}}
{{- $roles := $cluster_config.roles | default $.Values.cloudnativePg.roles -}}
{{- $storage := mustMerge ($cluster_config.storage | default (dict)) $.Values.cloudnativePg.storage -}}
{{- $enableMonitoring := $cluster_config.enableMonitoring | default $.Values.cloudnativePg.enableMonitoring -}}
{{- $enableSuperuserAccess := $cluster_config.enableSuperuserAccess | default $.Values.cloudnativePg.enableSuperuserAccess -}}
{{- $delay := $cluster_config.delay -}}
{{- $imageCatalogRef := $cluster_config.imageCatalogRef | default $.Values.cloudnativePg.imageCatalogRef }}
{{- $walStorage := $cluster_config.walStorage | default false -}}
{{- $services := $cluster_config.services | default false -}}
{{- $limitedCpu := $cluster_config.limitedCpu | default false -}}
{{- $limitedMemory := $cluster_config.limitedMemory | default false -}}
{{- $requestedCpu := $cluster_config.requestedCpu | default false -}}
{{- $requestedMemory := $cluster_config.requestedMemory | default false -}}
{{- $backup := mustMerge (get $cluster_config "backup" | default dict) ($.Values.cloudnativePg.backup | default dict) -}}
{{- $recovery := $cluster_config.recovery | default dict -}}
{{- $database := mustMerge $cluster_config.database ($.Values.cloudnativePg.database) | default dict -}}
{{- $dbName := required (print "Missing <$cluster_config.database.name> dbname in cluster <" $cluster_name ">") $database.name -}}
{{- $dbOwner := $database.owner | default $database.name -}}
{{- $initdb := $cluster_config.initdb | default dict -}}
{{- $superUserSecretRef := $cluster_config.superUserSecretRef | default $.Values.cloudnativePg.superUserSecretRef -}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $cluster_name }}
  namespace: {{ $namespace }}
  labels:
    cnpg.io/cluster: {{ $cluster_name }}
spec:
  instances: {{ $cluster_config.instances | default 1 }}
  {{- if $superUserSecretRef }}
  superuserSecret:
    name: {{ $cluster_config.superUserSecretRef }}
  {{- end }}
  {{- if or $enableSuperuserAccess $superUserSecretRef }}
  enableSuperuserAccess: true
  {{- end }}
  {{- if $testing }}
  enablePDB: false
  {{- end }}
  {{- if $delay }}
  startDelay: {{ $delay }}
  stopDelay: {{ $delay }}
  {{- end }}
  {{- if $imageCatalogRef }}
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: {{ $imageCatalogRef }}
  {{- else }}
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  {{- end }}
  primaryUpdateStrategy: unsupervised
  {{- if $affinity }}
  affinity:
    {{- toYaml $affinity | nindent 4 }}
  {{- end }}
  {{- if $storage }}
  storage:
    {{- toYaml $storage | nindent 4 }}
  {{- end }}
  {{- if $walStorage }}
  walStorage:
    {{- toYaml $walStorage | nindent 4 }}
  {{- end }}
  {{- if $roles }}
  managed:
    roles:
    {{- toYaml $roles | nindent 4 }}
    {{- if $services }}
    services:
    {{- toYaml $services | nindent 6 }}
    {{- end }}
  {{- end }}
  {{ if or $limitedCpu $limitedMemory }}
  resources:
    requests:
      {{- if $requestedMemory }}
      memory: {{ $requestedMemory }}
      {{- end }}
      {{- if $requestedCpu }}
      cpu: {{ $requestedCpu }}
      {{- end }}
    limits:
      {{- if $limitedMemory }}
      memory: {{ $limitedMemory }}
      {{- end }}
      {{- if $limitedCpu }}
      cpu: {{ $limitedCpu }}
      {{- end }}
  {{ end }}
  {{- if $config_postgresql }}
  postgresql:
    {{- toYaml $config_postgresql | nindent 4 }}
  {{- end }}
  monitoring:
    enablePodMonitor: {{ $enableMonitoring }}
    podMonitorRelabelings:
    - sourceLabels:
      - __meta_kubernetes_pod_name
      targetLabel: instance
    podMonitorMetricRelabelings:
    - sourceLabels:
      - cluster
      targetLabel: cnpg_cluster
  bootstrap:
    {{- if and $initdb $initdb.enabled }}
    initdb:
      dataChecksums: true
      database: {{ $dbName }}
      owner: {{ $dbOwner }}
      {{- if $database.localeCollate }}
      localeCollate: {{ $database.localeCollate }}
      {{- end }}
      {{- if $database.localeCType }}
      localeCType: {{ $database.localeCType }}
      {{- end }}
      {{- if $database.secretKeyRef }}
      secret:
        name: {{ $database.secretKeyRef }}
      {{ end -}}

    {{- if $initdb.source }}
    {{- $databases := $initdb.databases | default (list $dbName) -}}
      import:
        type: microservice
        databases:
          {{- toYaml $databases | nindent 10 }}
        source:
          externalCluster: {{ $initdb.source }}
    {{- end }}
    {{- end }}
    {{- if $recovery }}
    recovery:
      database: {{ $dbName }}
      owner: {{ $dbOwner }}
      {{- toYaml $recovery | nindent 6 }}
      {{- if $database.secretKeyRef }}
      secret:
        name: {{ $database.secretKeyRef }}
      {{- end }}
    {{- end }}

  {{- if $externalPgClusters }}
  externalClusters:
    {{- toYaml $externalPgClusters | nindent 4 }}
  {{- end }}
  {{- if and $cluster_config.backup $cluster_config.backup.enabled }}
  env:
  - name: AWS_REQUEST_CHECKSUM_CALCULATION
    value: when_required
  - name: AWS_RESPONSE_CHECKSUM_VALIDATION
    value: when_required
  backup:
    retentionPolicy: {{ $backup.retention | default "30d" | quote }}
    target: prefer-standby
    barmanObjectStore:
      destinationPath: {{ $backup.s3Config.path }}
      endpointURL: {{ $backup.s3Config.url }}
      s3Credentials:
        accessKeyId:
          name: {{ $backup.s3Config.secretName }}
          key: {{ $backup.s3Config.accessKey }}
        secretAccessKey:
          name: {{ $backup.s3Config.secretName }}
          key: {{ $backup.s3Config.secretKey }}
      wal:
        compression: {{ $.Values.cloudnativePg.backup.compression }}
      data:
        compression: {{ $.Values.cloudnativePg.backup.compression }}
        additionalCommandArgs:
          - "--min-chunk-size=5MB"
          - "--read-timeout=60"
          - "-vv"
  {{ end }}
{{ end }}
{{ end }}
{{ end }}
