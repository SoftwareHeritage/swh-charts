{{ if .Values.cloudnativePg.enabled -}}
{{- range $cluster_name, $cluster_config := .Values.cloudnativePg.deployments -}}
{{- if or (not (hasKey $cluster_config "enabled")) (get $cluster_config "enabled") -}}
{{- $poolerConfig := $cluster_config.pooler -}}
{{- if and $poolerConfig $poolerConfig.enabled -}}
{{- $namespace := get $cluster_config "namespace" | default $.Values.cloudnativePg.namespace -}}
{{- $pooler_instances := $poolerConfig.instances | default $cluster_config.instances | default 1 -}}
{{- $pool_mode := $poolerConfig.mode | default $.Values.cloudnativePg.pooler.mode }}
{{- $default_pool_size := $poolerConfig.default_pool_size | default "10" -}}
{{- $max_client_conn := $poolerConfig.max_client_conn | default "1000" -}}
{{- range $type := $poolerConfig.types -}}
{{- $name := cat $cluster_name "-pooler-" $type | nospace -}}
{{- $externalLoadBalancerConfig := $poolerConfig.externalLoadBalancer | default $.Values.cloudnativePg.externalLoadBalancer -}}
{{- $externalLoadBalancer := $externalLoadBalancerConfig.enabled -}}
{{- $port := $externalLoadBalancerConfig.port | quote -}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  instances: {{ $pooler_instances }}
  type: {{ $type }}
  cluster:
    name: {{ $cluster_name }}
  pgbouncer:
    poolMode: {{ $pool_mode }}
    parameters:
      max_client_conn: {{ $max_client_conn | quote }}
      default_pool_size: {{ $default_pool_size | quote }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers: []
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - {{ $name }}
            topologyKey: "kubernetes.io/hostname"
  {{- if $externalLoadBalancer }}
  serviceTemplate:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        metallb.universe.tf/allow-shared-ip: clusterIP
    spec:
      type: LoadBalancer
      externalTrafficPolicy: Cluster
      {{- if ne $port "5432" }}
      ports:
        - name: pgbouncer
          port: {{ $port }}
          targetPort: pgbouncer
          protocol: TCP
      {{- end }}
  {{- end }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}
