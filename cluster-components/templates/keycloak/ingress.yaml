{{- if and .Values.keycloak.enabled (hasKey .Values.keycloak "ingress") .Values.keycloak.ingress.enabled }}
{{- $appName := printf "%s-keycloak" .Values.clusterName }}
{{- $namespace := .Values.keycloak.namespace }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $appName }}
  namespace: {{ $namespace }}

  {{- with .Values.keycloak.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  ingressClassName: {{ .Values.keycloak.ingress.className | quote }}

  {{- if .Values.keycloak.ingress.tlsEnabled }}
  tls:
    - hosts:
        {{- .Values.keycloak.ingress.hosts | toYaml | nindent 8 }}
      secretName: {{ .Values.keycloak.ingress.secretName | quote }}
  {{- end }}

  rules:
    {{- range $host := .Values.keycloak.ingress.hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $appName }}
                port:
                  number: 8080
    {{- end }}

{{- end }}