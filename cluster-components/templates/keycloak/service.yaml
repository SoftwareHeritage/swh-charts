{{- if .Values.keycloak.enabled }}
{{- $appName := printf "%s-keycloak" .Values.clusterName }}
{{- $namespace := .Values.keycloak.namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $appName }}
  namespace: {{ $namespace }}
  labels:
    app: {{ $appName }}

spec:
  type: ClusterIP

  selector:
    app: {{ $appName }}

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-discovery" $appName }}
  namespace: {{ $namespace }}
  labels:
    app: {{ $appName }}

spec:
  clusterIP: None
  type: ClusterIP

  selector:
    app: {{ $appName }}

{{- end }}