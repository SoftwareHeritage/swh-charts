clusterName: gitlab-staging

alertmanagerConfig:
  enabled: true
  namespace: monitoring
  ircRelayHost: https://alertmanager-irc-relay.admin.swh.network/swh-sysadm
  inhibitRules:
    - targetMatch:
      - name: alertname
        value: KubeAggregatedAPIErrors
    - targetMatch:
      - name: alertname
        value: KubeCPUOvercommit
    - targetMatch:
      - name: alertname
        value: KubeMemoryOvercommit

vaultStaticSecrets:
  enabled: true
  secrets:
    alertmanager-irc-relay-config:
      enabled: true
      namespaces:
        - monitoring
    gitlab-runner:
      enabled: true
      namespaces:
        - gitlab-runner
    gitlab-runner-shared:
      enabled: true
      namespaces:
        - gitlab-runner
    gitlab-runner-image-builder:
      enabled: true
      namespaces:
        - gitlab-runner

cloudnativePg:
  enabled: true

redis:
  enabled: true
  deployments:
    gitlab:
      enabled: true
      namespace: gitlab-redis
      serviceMonitor:
        enabled: true
      redisExporter:
        enabled: true
      storage:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 10Gi
