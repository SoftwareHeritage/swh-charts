cloudnativePg:
  database:
    # default locale for swh modules
    # for Django applications use `en_US.utf8`
    localeCollate: 'C.UTF-8'
    localeCType: 'C.UTF-8'
  pooler:
    enabled: false
    mode: session
    types: []
  storage:
    storageClass: local-persistent
    size: 1Gi
  walStorage:
    storageClass: local-persistent
    size: 1Gi
  superuserAccessEnabled: false
  services:
    disabledDefaultServices:
      - "r"
      - "ro"
  roles:
  - name: guest
    ensure: present
    comment: read-only user
    login: true
    connectionLimit: -1
    passwordSecret:
      name: swh-postgresql-guest-secret
  backup:
    compression: gzip
    # Let's use the new barman plugin
    # It's required for future cnpg version > 1.26
    systemType: plugin
    # Extra backup configuration option to pass along barman backup command
    extraDataConfiguration:
      additionalCommandArgs:
      - "--min-chunk-size=5MB"
      - "--read-timeout=60"
      - "-vv"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "swh/db"
            operator: In
            values:
            - "true"

rabbitmq:
  storageVolume:
    class: local-persistent
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "swh/backend"
            operator: In
            values:
            - "true"

elasticsearch:
  nodeSelector:
    "swh/elasticsearch": "true"

cassandra:
  nodeAffinityLabels:
    "swh/cassandra": "true"

kafka:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "swh/backend"
            operator: In
            values:
            - "true"

svix:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: svix-server
            operator: In
            values:
            - "true"
