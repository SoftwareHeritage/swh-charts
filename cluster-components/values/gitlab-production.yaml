alertmanagerConfig:
  enabled: true
  namespace: monitoring
  ircRelayHost: https://alertmanager-irc-relay.admin.swh.network/swh-sysadm
  inhibitRules:
    - targetMatch:
      - name: alertname
        value: KubeAggregatedAPIErrors
    - targetMatch:
      - name: alertname
        value: KubeCPUOvercommit
    - targetMatch:
      - name: alertname
        value: KubeMemoryOvercommit

cloudnativePg:
  enabled: true
  version: 0.28.2

gitlabRunner:
  enabled: true
  rbac:
    create: true

  gitlabUrl: https://gitlab.softwareheritage.org
