clusterName: rancher

vaultStaticSecrets:
  enabled: true
  secrets:
    alertmanager-irc-relay-config:
      enabled: true
      namespaces:
        - cattle-monitoring-system

alertmanagerConfig:
  enabled: true
  namespace: cattle-monitoring-system
  ircRelayHost: https://alertmanager-irc-relay.admin.swh.network/swh-sysadm
  inhibitRules:
    - targetMatch:
      - name: alertname
        value: KubeAggregatedAPIErrors
