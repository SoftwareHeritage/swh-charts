cassandra:
  enabled: false
  namespace: swh
  storageConfig:
    cassandraDataVolumeClaimSpec:
      storageClassName: standard
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  deployments:
    cassandra-cluster:
      datacenters:
        - name: dc1
          replicas: 1

elasticsearch:
  enabled: false
  deployments:
    search:
      replicas: 1
      # For test environment (local-cluster, next-version) only
      disableSecurity: true
      disableTLS: true
      # version: 8.14.2
      nodeName: node
    # quickstart:
    #   replicas: 1

redis:
  enabled: false
  namespace: swh
  deployments:
    counters:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            accessModes:
              - ReadWriteOnce
    svix:
      enabled: true
      namespace: cluster-components
      serviceMonitor:
         enabled: false
      redisExporter:
        enabled: true
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      extraConfig:
        enabled: true
        data: |
          save 60 500
          appendonly yes
          appendfsync everysec

renovate:
  enabled: false
  # Name of the Kubernetes Secret containing sensitive variables
  secretName: renovate-env
  logLevel: "debug"
  # Gitlab endpoint
  gitlabEndpoint: https://gitlab-staging.swh.network/api/v4
  cachedir:
    enabled: true
  # Where is stored the centralized renovate configuration
  renovateExtends: "local>amadouth/renovate-config:default.json"
  # Repositories to scan for updates
  repositories:
    - amadouth/renovate-update
    - amadouth/renovate

kafkabackup:
  enabled: false
  namespace: cluster-components
  bootstrapServer: kafka1.internal.softwareheritage.org
  kafkaHosts:
    # Vagrant hosts
    kafka1.internal.softwareheritage.org: 10.168.100.201
    kafka2.internal.softwareheritage.org: 10.168.100.202
    kafka3.internal.softwareheritage.org: 10.168.100.203
    kafka4.internal.softwareheritage.org: 10.168.100.204
  s3:
    bucket: kafkabackup-local-cluster
    # Don't forget to setup a S3-compatible objstorage /somewhere/ and
    # configure it in your local-cluster-cc.override.yaml -- it is not included
    # in the local cluster. Garage is easy to setup for local tests.
  ssh:
    # Gather your Vagrant VMs host keys (ssh-keyscan) and add them to this list
    knownHosts: []


volumes:
  enabled: false
  persistentVolumeClaims:
    renovate-cache-pvc:
      enabled: false
      namespace: renovate
      appName: renovate-cache-pvc
      spec:
        storageClassName: local-persistent
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

openbao:
  enabled: false
  endpoint: https://openbao.local
  verbose: false
  period: "* * * * *"
  rbac:
    enabled: false
  deployments:
    local-cluster:
      url: https://kubernetes.default.svc
      inCluster: true
      noVerifySSL: true
      namespacesToManageInOpenbaoClientCluster:
      - vso

keycloak:
  enabled: false
