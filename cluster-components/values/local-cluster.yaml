cassandra:
  enabled: false
  namespace: swh
  storageConfig:
    cassandraDataVolumeClaimSpec:
      storageClassName: standard
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  deployments:
    cassandra-cluster:
      datacenters:
        - name: dc1
          replicas: 1

elasticsearch:
  enabled: false
  deployments:
    search:
      replicas: 1
      # For test environment (local-cluster, next-version) only
      disableSecurity: true
      disableTLS: true
      # version: 8.14.2
      nodeName: node
    # quickstart:
    #   replicas: 1

redis:
  enabled: false
  namespace: swh
  deployments:
    counters:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            accessModes:
              - ReadWriteOnce
    svix:
      enabled: true
      namespace: cluster-components
      serviceMonitor:
         enabled: false
      redisExporter:
        enabled: true
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      extraConfig:
        enabled: true
        data: |
          save 60 500
          appendonly yes
          appendfsync everysec
