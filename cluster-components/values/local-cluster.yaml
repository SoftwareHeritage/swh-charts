clusterName: local-cluster

cert-manager:
  enabled: false

# Relay cluster's alerts to the ircrelay
alertmanager:
  enabled: false
  ircrelay:
    enabled: true
    host: https://alertmanager-irc-relay.admin.swh.network/minikube-swh-sysadm

metallb:
  enabled: false
  namespace: metallb
  # Generic ipAddressPool (e.g. for main cluster ingress)
  ipAddressPools:
    - ip: 172.18.255.0/24
      suffixName: ingress
      serviceAllocation:
        priority: 50
        namespaces:
          - ingress-nginx

# Activate prometheus as this is not previously done (in contrast with other clusters
# provisioned by terraform which does the prometheus configuration too)
prometheus:
  enabled: false

alertmanagerIrcRelay:
  enabled: false
  ingress:
    enabled: true
  # Optional username for the bot to use (configured from secrets in other clusters)
  username: swhprombot
  # Different room to use than the production one
  room: minikube-swh-sysadm
  requestedMemory: "32Mi"
  requestedCpu: "100m"
  limitedMemory: "64Mi"
  limitedCpu: "200m"

blackboxExporter:
  enabled: false

podPriority:
  enabled: true

svix:
  enabled: false
  namespace: cluster-components
  deployments:
    svix:
      ingress:
        enabled: true
        host: svix-test
        createTLS: false
        # annotations:
        #   foo: bar
        # whitelistSourceRange:
        # - 192.168.49.0/24
      requestedMemory: 100Mi
      requestedCpu: 100m
      postgres:
        dsn: svix-rw.swh
        cleanupExpiredMessages:
          enabled: true
          cron: "0 */2 * * *"
      redis:
        dsn: redis-svix.cluster-components

dockerCache:
  enabled: false
  ingress:
    tls:
      enabled: true
  instances:
    quay.io:
      enabled: false

rabbitmq:
  enabled: false
  namespace: swh
  logLevel: info
  storageVolume:
    class: standard
  deployments:
    scheduler:
      enabled: true
      replicas: 1

cloudnativePg:
  enabled: false
  namespace: swh
  grantGuestAccess: false
  testing: true
  monitoringEnabled: false
  superuserAccessEnabled: true
  superUserSecretRef: swh-postgresql-postgres-secret
  storage:
    # storageClass: local-persistent
    storageClass: standard
    size: 1Gi
  walStorage:
    # storageClass: local-persistent
    storageClass: standard
    size: 1Gi
  postgresql:
    pg_hba:
    - host all all all md5
  roles:
    - name: guest
      ensure: present
      comment: Guest
      login: true
      connectionLimit: -1
      inherit: true
      passwordSecret:
        name: swh-guest-postgresql-secret
  deployments:
    archive:
      enabled: false
      database:
        name: swh
        secretKeyRef: swh-swh-postgresql-secret
      initdb:
        enabled: true
    maskingproxy:
      enabled: false
      database:
        name: swhmaskingproxy
        secretKeyRef: swh-maskingproxy-postgresql-secret
      initdb:
        enabled: true
    scheduler:
      enabled: false
      database:
        name: swh-scheduler
        secretKeyRef: swh-scheduler-swh-postgresql-secret
      initdb:
        enabled: true
    vault:
      enabled: false
      database:
        name: swh-vault
        secretKeyRef: swh-vault-swh-postgresql-secret
      initdb:
        enabled: true
    indexer-storage:
      enabled: false
      database:
        name: swh-indexer
        secretKeyRef: swh-indexer-storage-swh-postgresql-secret
      initdb:
        enabled: true
    web:
      enabled: false
      database:
        name: swh-web
        secretKeyRef: swh-web-swh-postgresql-secret
      initdb:
        enabled: true
    scrubber:
      enabled: false
      database:
        name: swh-scrubber
        secretKeyRef: swh-scrubber-swh-postgresql-secret
      initdb:
        enabled: true
    deposit:
      enabled: false
      database:
        name: swh-deposit
        secretKeyRef: swh-deposit-swh-postgresql-secret
      initdb:
        enabled: true
    svix:
      enabled: false
      database:
        name: swh-svix
        secretKeyRef: swh-svix-swh-postgresql-secret
      initdb:
        enabled: true
    osporadar:
      enabled: false
      namespace: osporadar
      database:
        name: osporadar
        secretKeyRef: swh-osporadar-swh-osporadar-secret
      initdb:
        enabled: true
    keycloak:
      enabled: false
      namespace: keycloak
      database:
        name: keycloak
        secretKeyRef: swh-keycloak-postgres-secret
      initdb:
        enabled: true

scrapeClusterMetrics:
  enabled: false
  deployments:
    kafka-cluster:
      enabled: false
      namespace: swh
      metricsEndpointPortName: tcp-prometheus
      path: "/metrics"
      scheme: http
      labels:
        release: kube-prometheus-stack
      matchLabels:
        app.kubernetes.io/instance: kafka-cluster
        app.kubernetes.io/name: kafka-exporter
      # The kafka-exporter deployed by strimzi does not deploy a service. Only a pod,
      # but the service monitor will need a service to scrape, so deploy one.
      service:
        enabled: true
        port: 9404

kafka:
  enabled: false
  replicas: 1
  replicationFactor: 1
  minInSyncReplicas: 1
  deployments:
    kafka-cluster:
      namespace: swh
      metrics:
        enabled: true
        extraLabels:
          release: kube-prometheus-stack
        # either jmxPrometheusExporter or strimziMetricsReporter
        type: jmxPrometheusExporter
        kafkaExporterConfig:
          topicRegex: ".*"
          groupRegex: ".*"
      # storage:
      #   type: jbod
      #   volumes:
      #   - id: 0
      #     type: persistent-claim
      #     size: 1Gi
      #     deleteClaim: false
      #   - id: 1
      #     type: persistent-claim
      #     size: 1Gi
      #     deleteClaim: false
      pools:
        pool-a:
          roles:
            - broker
          storage:
            type: jbod
            volumes:
              - id: 0
                type: persistent-claim
                size: 1Gi
                deleteClaim: false
        pool-b:
          roles:
            - broker
          storage:
            type: jbod
            volumes:
              - id: 0
                type: persistent-claim
                size: 1Gi
                deleteClaim: false
        pool-c:
          roles:
            - controller
          storage:
            type: jbod
            volumes:
              - id: 0
                type: persistent-claim
                size: 1Gi
                deleteClaim: false
      topics:
        defaultConfig:
          partitions: 4
          replicas: 2
          extraConfig:
            cleanup.policy: compact
        entries:
          swh.journal.objects.origin: {}
          swh.journal.objects.origin_visit: {}
          swh.journal.objects.origin_visit_status: {}
          swh.journal.objects.snapshot: {}
          swh.journal.objects.release: {}
          swh.journal.objects.revision: {}
          swh.journal.objects.directory: {}
          swh.journal.objects.content: {}
          swh.journal.objects.skipped_content: {}
          swh.journal.objects.extid: {}
          swh.journal.objects.metadata_authority: {}
          swh.journal.objects.metadata_fetcher: {}
          swh.journal.objects.raw_extrinsic_metadata: {}
          swh.journal.indexed.content_ctags: {}
          swh.journal.indexed.content_fossology_license: {}
          swh.journal.indexed.content_language: {}
          swh.journal.indexed.content_metadata: {}
          swh.journal.indexed.content_mimetype: {}
          swh.journal.indexed.directory_intrinsic_metadata: {}
          swh.journal.indexed.origin_extrinsic_metadata: {}
          swh.journal.indexed.origin_intrinsic_metadata: {}
          swh.journal.indexed.revision_intrinsic_metadata: {}
      # users:
      #   swh-minikube:
      #     secret:
      #       ref: kafka-user-secrets-swh-minikube
      #       key: BROKER_USER_PASSWORD
      #     resources:
      #       - topics:
      #           - swh.journal.objects.origin
      #           - swh.journal.objects.origin_visit
      #           - swh.journal.objects.origin_visit_status
      #           - swh.journal.objects.snapshot
      #           - swh.journal.objects.release
      #           - swh.journal.objects_privileged.release
      #           - swh.journal.objects.revision
