clusterPgStagingDb1:
  name: cluster-pg-staging-db1
  password:
    name: cluster-staging-db1-postgres-user-credential
    key: password
  connectionParameters:
    # Use the correct IP or host name for the source database
    host: db1.internal.staging.swh.network
    user: postgres
    port: "5433"

cloudnativePg:
  enabled: true
  testing: true
  namespace: cnpg
  # Where to store backup (if enabled)
  # barmanobjectstoreRef: minioTestObjectStore
  # Cluster Postgresql to read db to initialize from
  externalClusterRef: clusterPgStagingDb1
  postgresql:
    parameters:
      max_worker_processes: "60"
    pg_hba:
      - host all all all md5
  # Exists as many cluster as we want
  deployments:
    staging-archive-db:
      enabled: true
      # Managed dbs (optional)
      initdb:
        type: microservice
        databases:
          # - swh
          - swh-scheduler
        source: cluster-pg-staging-db1
      externalLoadBalancer: true
      pooler:
        instances: 1
        enabled: true
        types:
        - "ro"
      backup:
        enabled: false
        retention: "10d"
        name: dayly-at-one
        # every day at 1am
        cron: "0 0 1 * * *"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "kubernetes.io/hostname"
                operator: In
                values:
                - "rancher-node-test-rke2-worker3"

rabbitmq:
  enabled: true
  replicas: 1
  deployments:
    scheduler:
      enabled: true

redis:
  enabled: true
  deployments:
    redis:
      appName: redis
      namespace: redis
      serviceMonitor:
        enabled: true
      redisExporter:
        enabled: true
      nodeSelector:
        kubernetes.io/hostname: rancher-node-test-rke2-worker2
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-persistent
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

elasticsearch:
  enabled: true
  # Can be overridden per instance
  # No authentication
  disableSecurity: true
  # Over http
  disableTLS: true
  # Common volume claim templates to deal with storage information
  # Can be overriden per instance
  deployments:
    search-test:
      enabled: false
      metricsEnabled: false
      replicas: 1
      # version: 8.14.2
      nodeName: node
      volumeClaimTemplates:
      - metadata:
          # Do not change this name unless you set up a volume mount for the
          # data path.
          name: elasticsearch-data
        spec:
          storageClassName: cephfs
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
