clusterName: archive-staging-rke2

# Relay prometheus alerts to the admin cluster's ingress relay
alertmanager:
  enabled: true

alertmanagerConfig:
  enabled: true

metallb:
  enabled: true
  # Generic ipAddressPool (e.g. for main cluster ingress)
  ipAddressPools:
    # main external-ip for LoadBalancer (but postgres')
    - ip: 192.168.130.139/32
      suffixName: ingress
      serviceAllocation:
        priority: 50
        namespaces:
          - ingress-nginx
    - ip: 192.168.130.138/32
      suffixName: pooler
      serviceAllocation:
        priority: 50
        namespaces:
          - cnpg
        serviceSelectors:
          - matchExpressions:
            - key: app
              operator: In
              values:
                - archive-staging-rke2-pgbouncer-pgbouncer

podPriority:
  enabled: true

svix:
  enabled: true
  deployments:
    svix:
      ingress:
        host: svix.internal.staging.swh.network
        createTLS: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production-gandi
          kubernetes.io/tls-acme: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        whitelistSourceRange:
          # cluster internal range ip
          - 10.42.0.0/16
          - 10.43.0.0/16
          # admin ip
          - 192.168.50.0/24
      requestedMemory: 100Mi
      requestedCpu: 100m
      redis:
        enabled: false
        dsn: redis-svix.svix-server
      postgres:
        enabled: false
        dsn: db-swh-svix-rw.cnpg
    svix-next-version:
      ingress:
        host: svix-next-version.internal.staging.swh.network
        createTLS: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production-gandi
          kubernetes.io/tls-acme: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        whitelistSourceRange:
          # cluster internal range ip
          - 10.42.0.0/16
          - 10.43.0.0/16
          # admin ip
          - 192.168.50.0/24
      requestedMemory: 100Mi
      requestedCpu: 100m
      redis:
        enabled: false
        dsn: redis-svix-next-version.swh-cassandra-next-version
      postgres:
        enabled: false
        dsn: next-version-db-swh-svix-rw.cnpg-next-version

alerting:
  enabled: true
  environment: staging
  saveCodeNow:
    threshold: 5

scrapeExternalMetrics:
  enabled: true
  deployments:
    cassandra:
      namespace: cassandra
      metricsName: jmx-exporter
      serviceMonitorName: cassandra-jmx-exporter
      port: 7070
      ips:
        - 192.168.130.181
        - 192.168.130.182
        - 192.168.130.183
      relabelings:
        # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
        - sourceLabels:
            - __address__
          targetLabel: __address__
          regex: "192.168.130.18(\\d)(.*)"
          replacement: "cassandra$1.internal.staging.swh.network$2"
          action: replace
    # Integrate the rabbitmq metrics into the cluster. To allow crafting alertmanager
    # alerts. With this, we need to deactivate the prometheus scrapping from pergamon to
    # avoid duplicates (those are not readable from the cluster alertmanager)
    rabbitmq:
      namespace: rabbitmq
      port: 9419
      ips:
        - 192.168.130.50
      relabelings:
        # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
        - sourceLabels:
            - __address__
          targetLabel: __address__
          regex: "192.168.130.50(.*)"
          replacement: "scheduler0.internal.staging.swh.network$1"
          action: replace

scrapeClusterMetrics:
  enabled: true
  deployments:
    cassandra-next-version:
      name: cassandra-next-version
      namespace: swh-cassandra-next-version
      # metricsEndpointPortName: metrics
      matchLabels:
        app.kubernetes.io/instance: cassandra-cassandra-cluster
        app.kubernetes.io/name: cassandra
    elasticsearch-next-version:
      namespace: swh-cassandra-next-version
      metricsEndpointPortName: http
      path: "/_prometheus/metrics"
      scheme: http
      matchLabels:
        common.k8s.elastic.co/type: elasticsearch
        elasticsearch.k8s.elastic.co/cluster-name: search-next-version
    elasticsearch:
      namespace: swh-cassandra
      metricsEndpointPortName: http
      path: "/_prometheus/metrics"
      scheme: http
      matchLabels:
        common.k8s.elastic.co/type: elasticsearch
        elasticsearch.k8s.elastic.co/cluster-name: search
    kafka-next-version:
      namespace: swh-cassandra-next-version
      metricsEndpointPortName: tcp-prometheus
      path: "/metrics"
      scheme: http
      matchLabels:
        app.kubernetes.io/instance: kafka-cluster
        app.kubernetes.io/name: kafka-exporter
      # The kafka-exporter deployed by strimzi does not deploy a service. Only a pod,
      # but the service monitor will need a service to scrape, so deploy one.
      service:
        enabled: true
        port: 9404

# This is slowly being decommissioned as it's using db1 to retrieve data from dbs hosted
# there
externalPostgresqlClusters:
  - name: cluster-pg-staging-db1
    password:
      name: cluster-staging-db1-postgres-user-credential
      key: password
    connectionParameters:
      # Use the correct IP or host name for the source database
      host: db1.internal.staging.swh.network
      user: postgres
      port: "5433"

# This is to access already existing dbs running in cnpg clusters
internalPostgresqlClusters: []
  # No longer relevant datasource (since it's been decommissionned)
  # - name: cluster-pg-staging-kube-swh-web
  #   password:
  #     name: swh-postgresql-swh-web-secret
  #     key: password
  #   connectionParameters:
  #     # Use the correct IP or host name for the source database
  #     host: swh-web-rw.swh-cassandra
  #     user: swh-web
  #     port: "5432"

# Mandatory recovery backup which will be used when the next-version environment is
# resetted.
recoverySwhSchedulerClusters:
  - name: next-version-db-swh-scheduler
    barmanObjectStore:
      serverName: next-version-db-swh-scheduler-backup
      destinationPath: s3://backup-cnpg/archive-staging-rke2/cnpg-next-version
      endpointURL: https://minio.admin.swh.network
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-secret
          key: MINIO_ACCESS_KEY
        secretAccessKey:
          name: cnpg-minio-secret
          key: MINIO_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        additionalCommandArgs:
          - "--min-chunk-size=5MB"
          - "--read-timeout=60"
          - "-vv"

# Mandatory recovery backup which will be used when the next-version environment is
# resetted.
recoverySwhMaskingClusters:
  - name: next-version-db-swh-masking
    barmanObjectStore:
      serverName: next-version-db-swh-masking-backup
      destinationPath: s3://backup-cnpg/archive-staging-rke2/cnpg-next-version
      endpointURL: https://minio.admin.swh.network
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-secret
          key: MINIO_ACCESS_KEY
        secretAccessKey:
          name: cnpg-minio-secret
          key: MINIO_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        additionalCommandArgs:
          - "--min-chunk-size=5MB"
          - "--read-timeout=60"
          - "-vv"

cloudnativePg:
  enabled: true
  superUserSecretRef: swh-postgresql-postgres-secret
  postgresql:
    parameters:
      # https://cloudnative-pg.io/documentation/1.23/postgresql_conf/#changing-configuration
      max_worker_processes: "60"
      # max_connections: "400"
      # shared_buffers: "32GB" # min 128kB
      # log_timezone: 'Etc/UTC'
      # timezone: 'Etc/UTC'
      # lc_messages: 'C.UTF-8' # locale for system error message strings
      # lc_monetary: 'C.UTF-8' # locale for monetary formatting
      # lc_numeric: 'C.UTF-8' # locale for number formatting
      # lc_time: 'C.UTF-8' # locale for time formatting
    pg_hba:
    - host all all all md5
  # Postgres credentials to setup (can be overridden per instance)
  # superUserSecretRef: swh-postgresql-postgres-secret
  deployments:
    # Next-version dbs followed by staging dbs sorted in alphabetical order
    # to look for them more easily

    ##################
    # Next-version dbs
    ##################

    next-version-db-swh:
      enabled: true
      namespace: cnpg-next-version
      testing: true
      instances: 1
      storage:
        size: 1Gi
      walStorage:
        size: 1Gi
      database:
        name: swh
        secretKeyRef: swh-postgresql-swh-secret
      initdb:
        enabled: true

    next-version-db-swh-deposit:
      enabled: true
      namespace: cnpg-next-version
      testing: true
      instances: 1
      storage:
        size: 1Gi
      walStorage:
        size: 1Gi
      database:
        name: swh-deposit
        secretKeyRef: swh-postgresql-swh-deposit-secret
      initdb:
        enabled: true

    next-version-db-swh-indexer:
      enabled: true
      namespace: cnpg-next-version
      testing: true
      instances: 1
      storage:
        size: 1Gi
      walStorage:
        size: 1Gi
      database:
        name: swh-indexer
        secretKeyRef: swh-postgresql-swh-indexer-secret
      initdb:
        enabled: true

    next-version-db-swh-masking:
      enabled: true
      namespace: cnpg-next-version
      testing: true
      externalClustersRef: externalPostgresqlClusters
      storage:
        size: 1Gi
      walStorage:
        size: 1Gi
      database:
        name: swh-masking
        secretKeyRef: swh-postgresql-swh-masking-secret
      externalClustersRef: recoverySwhMaskingClusters
      recovery:
        source: next-version-db-swh-masking

    # Specific swh-scheduler database mounted from a backup from swh-scheduler-k8s
    # (minimalistic swh-scheduler db)
    next-version-db-swh-scheduler:
      enabled: true
      namespace: cnpg-next-version
      testing: true
      instances: 1
      storage:
        size: 1Gi
      walStorage:
        size: 1Gi
      # Specific postgresql setup (can be overridden per instance)
      externalClustersRef: recoverySwhSchedulerClusters
      database:
        name: swh-scheduler
        secretKeyRef: swh-postgresql-swh-scheduler-secret
      recovery:
        source: next-version-db-swh-scheduler

    next-version-db-swh-svix:
      enabled: true
      namespace: cnpg-next-version
      testing: true
      instances: 1
      storage:
        size: 1Gi
      walStorage:
        size: 1Gi
      database:
        name: swh-svix
        secretKeyRef: swh-postgresql-swh-svix-secret
      initdb:
        enabled: true

    next-version-db-swh-vault:
      enabled: true
      namespace: cnpg-next-version
      testing: true
      instances: 1
      storage:
        size: 1Gi
      walStorage:
        size: 1Gi
      database:
        name: swh-vault
        secretKeyRef: swh-postgresql-swh-vault-secret
      initdb:
        enabled: true

    next-version-db-swh-web:
      enabled: true
      namespace: cnpg-next-version
      testing: true
      instances: 1
      storage:
        size: 1Gi
      walStorage:
        size: 1Gi
      database:
        name: swh-web
        secretKeyRef: swh-postgresql-swh-web-secret
      initdb:
        enabled: true

    #############
    # Staging test db
    #############

    # Test db to mount out of a dataset volume with existing postgresql data 1 primary
    # only, no backup enabled.
    db-swh-test:
      enabled: true
      namespace: cnpg
      # Targetted version will be the same as db1 (ongoing migration from 12 to 13)
      imageCatalogRef: 13
      # No replica for now, we need to determine where to make it run
      # It's around 2Tb currently
      instances: 1
      externalClustersRef: externalPostgresqlClusters
      extraPostgresqlConfig:
        parameters:
          # Setup used in the previous instance (defaulted to 128MB so far)
          shared_buffers: 32GB
      storage:
        pvcTemplate:
          storageClassName: local-persistent
          volumeMode: Filesystem
          volumeName: database-db1-persistent-local-pv
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Ti
      database:
        name: swh
        secretKeyRef: swh-postgresql-swh-secret
      initdb:
        enabled: true
      roles:
      - name: swhmailmap
        ensure: present
        comment: extra read-only user
        login: true
        connectionLimit: -1
        passwordSecret:
          name: swh-postgresql-swhmailmap-secret
      affinity:
        # Install the main db on a node with a specific label (staging-metal01
        # & db1). As this db requires a lot of disks (> 2TB)
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: swh/db-archive
                operator: In
                values:
                - "true"

    #############
    # Staging dbs
    #############

    db-swh:
      enabled: true
      namespace: cnpg
      # No replica for now, we need to determine where to make it run
      # It's around 2Tb currently
      instances: 2
      externalClustersRef: externalPostgresqlClusters
      extraPostgresqlConfig:
        parameters:
          # Setup used in the previous instance (defaulted to 128MB so far)
          shared_buffers: 32GB
      storage:
        size: 1Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      database:
        name: swh
        secretKeyRef: swh-postgresql-swh-secret
      initdb:
        enabled: true
        source: cluster-pg-staging-db1
      backup:
        enabled: false
        # This is a huge database relatively to the rest of staging
        retention: 1d
        # Run once a day at 20:30pm (UTC)
        schedule: "0 30 20 * * *"
      roles:
      - name: swhmailmap
        ensure: present
        comment: extra read-only user
        login: true
        connectionLimit: -1
        passwordSecret:
          name: swh-postgresql-swhmailmap-secret
      affinity:
        # Install the main db on a node with a specific label (staging-metal01
        # & db1). As this db requires a lot of disks (> 2TB)
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: swh/db-archive
                operator: In
                values:
                - "true"

    db-swh-blocking:
      enabled: true
      namespace: cnpg
      instances: 2
      externalClustersRef: externalPostgresqlClusters
      storage:
        size: 1Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      database:
        name: swh-blocking
        secretKeyRef: swh-postgresql-swh-blocking-secret
      initdb:
        enabled: true
        source: cluster-pg-staging-db1
      backup:
        enabled: true
        # Run once a day at 7:40am (UTC)
        schedule: "0 40 7 * * *"

    db-swh-coar-notify:
      enabled: true
      namespace: cnpg
      instances: 2
      database:
        name: swh-coar-notify
        secretKeyRef: swh-postgresql-swh-coar-notify-secret
      initdb:
        enabled: true
      storage:
        size: 5Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      backup:
        enabled: true
        # Run once a day at 2:05am (UTC)
        schedule: "0 05 2 * * *"

    db-swh-deposit:
      enabled: true
      namespace: cnpg
      instances: 2
      storage:
        size: 1Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      database:
        name: swh-deposit
        secretKeyRef: swh-postgresql-swh-deposit-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        # Run once a day at 1:10am (UTC)
        schedule: "0 10 1 * * *"

    db-swh-indexer:
      enabled: true
      namespace: cnpg
      instances: 2
      externalClustersRef: externalPostgresqlClusters
      storage:
        size: 1Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      database:
        name: swh-indexer
        secretKeyRef: swh-postgresql-swh-indexer-secret
      initdb:
        enabled: true
        source: cluster-pg-staging-db1
      backup:
        enabled: true
        # Run once a day at 23:05pm (UTC)
        schedule: "0 5 23 * * *"
        # swh-indexer is big (~97GB), keep less backups.
        retention: 1d

    db-swh-masking:
      enabled: true
      namespace: cnpg
      instances: 2
      externalClustersRef: externalPostgresqlClusters
      roles:
      - name: swhmailmap
        ensure: present
        comment: read-only user for display_name table
        login: true
        connectionLimit: -1
        passwordSecret:
          name: swh-postgresql-swhmailmap-secret
      storage:
        size: 1Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      database:
        name: swh-masking
        secretKeyRef: swh-postgresql-swh-masking-secret
      initdb:
        enabled: true
        source: cluster-pg-staging-db1
      backup:
        enabled: true
        # Run once a day at 7:55 (UTC)
        schedule: "0 55 7 * * *"

    db-swh-scheduler:
      enabled: true
      namespace: cnpg
      instances: 2
      database:
        name: swh-scheduler
        secretKeyRef: swh-postgresql-swh-scheduler-secret
      externalClustersRef: externalPostgresqlClusters
      initdb:
        enabled: true
        source: cluster-pg-staging-db1
      storage:
        size: 1Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      backup:
        enabled: true
        # Run once a day at 5:30am (UTC)
        schedule: "0 30 5 * * *"

    db-swh-scrubber:
      enabled: true
      namespace: cnpg
      instances: 2
      database:
        name: swh-scrubber
        secretKeyRef: swh-postgresql-swh-scrubber-secret
      externalClustersRef: externalPostgresqlClusters
      initdb:
        enabled: true
        source: cluster-pg-staging-db1
      storage:
        size: 1Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      backup:
        enabled: true
        # Run once a day at 3:20am (UTC)
        schedule: "0 20 3 * * *"

    db-swh-svix:
      enabled: true
      namespace: cnpg
      instances: 2
      database:
        name: swh-svix
        secretKeyRef: swh-postgresql-swh-svix-secret
      externalClustersRef: externalPostgresqlClusters
      initdb:
        enabled: true
        source: cluster-pg-staging-db1
      storage:
        size: 5Gi
        storageClass: local-persistent
      walStorage:
        size: 5Gi
        storageClass: local-persistent
      backup:
        enabled: true
        # Run once a day at 6:35am (UTC)
        schedule: "0 35 6 * * *"
        # swh-svix is potentially a huge database
        retention: 2d

    db-swh-vault:
      enabled: true
      namespace: cnpg
      instances: 2
      database:
        name: swh-vault
        secretKeyRef: swh-postgresql-swh-vault-secret
      externalClustersRef: externalPostgresqlClusters
      initdb:
        enabled: true
        source: cluster-pg-staging-db1
      storage:
        size: 1Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      backup:
        enabled: true
        # Run once a day at 4:25am (UTC)
        schedule: "0 25 4 * * *"

    db-swh-web:
      enabled: true
      namespace: cnpg
      instances: 2
      storage:
        size: 1Gi
        storageClass: local-persistent
      walStorage:
        size: 1Gi
        storageClass: local-persistent
      database:
        name: swh-web
        secretKeyRef: swh-postgresql-swh-web-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        # Run once a day at 0:15am (UTC)
        schedule: "0 15 0 * * *"

rabbitmq:
  enabled: true
  namespace: swh-cassandra-next-version
  replicas: 1
  deployments:
    scheduler:
      enabled: true
      namespace: swh-cassandra-next-version

cassandra:
  enabled: true
  storageConfig:
    cassandraDataVolumeClaimSpec:
      storageClassName: local-persistent
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi

  deployments:
    cassandra-cluster:
      namespace: swh-cassandra-next-version
      annotations:
        # To trigger a restart at upgrade time
        k8ssandra.io/autoupdate-spec: "always"
      jvmOptions:
        heapSize: 1G
      datacenters:
        - name: next-version
          replicas: 2
      reaper:
        enabled: false

kafka:
  enabled: true
  namespace: swh-cassandra-next-version
  replicas: 1
  replicationFactor: 1
  minInSyncReplicas: 1
  deployments:
    kafka-cluster:
      enabled: true
      metricsEnabled: true
      pools:
        pool-a:
          roles:
            - broker
          storage:
            type: jbod
            volumes:
              - id: 0
                type: persistent-claim
                size: 5Gi
                deleteClaim: true
                class: local-persistent
        pool-b:
          roles:
            - broker
          storage:
            type: jbod
            volumes:
              - id: 0
                type: persistent-claim
                size: 5Gi
                deleteClaim: true
                class: local-persistent
        pool-c:
          replicas: 3
          roles:
            - controller
          storage:
            type: jbod
            volumes:
              - id: 0
                type: persistent-claim
                size: 5Gi
                deleteClaim: true
                class: local-persistent

      topics:
        swh.journal.objects.origin: {}
        swh.journal.objects.origin_visit: {}
        swh.journal.objects.origin_visit_status: {}
        swh.journal.objects.snapshot: {}
        swh.journal.objects.release: {}
        swh.journal.objects.revision: {}
        swh.journal.objects.directory: {}
        swh.journal.objects.content: {}
        swh.journal.objects.skipped_content: {}
        swh.journal.objects.extid: {}
        swh.journal.objects.metadata_authority: {}
        swh.journal.objects.metadata_fetcher: {}
        swh.journal.objects.raw_extrinsic_metadata: {}
        swh.journal.indexed.content_ctags: {}
        swh.journal.indexed.content_fossology_license: {}
        swh.journal.indexed.content_language: {}
        swh.journal.indexed.content_metadata: {}
        swh.journal.indexed.content_mimetype: {}
        swh.journal.indexed.directory_intrinsic_metadata: {}
        swh.journal.indexed.origin_extrinsic_metadata: {}
        swh.journal.indexed.origin_intrinsic_metadata: {}
        swh.journal.indexed.revision_intrinsic_metadata: {}

elasticsearch:
  enabled: true
  # Can be overridden per instance
  # No authentication
  disableSecurity: true
  # Over http
  disableTLS: true
  # Common volume claim templates to deal with storage information
  # Can be overriden per instance
  volumeClaimTemplates:
  - metadata:
      # Do not change this name unless you set up a volume mount for the
      # data path.
      name: elasticsearch-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: local-persistent
  deployments:
    search-next-version:
      enabled: true
      namespace: swh-cassandra-next-version
      metricsEnabled: true
      replicas: 3
      # version: 8.14.2
      nodeName: node
    # quickstart:
    #   replicas: 1
    search:
      enabled: true
      namespace: swh-cassandra
      # 3 masters
      replicas: 3
      metricsEnabled: true
      requestedMemory: 3Gi
      limitedMemory: 3Gi
      config:
        jvm:
          Xms: 2g
          Xmx: 2g

redis:
  enabled: true
  deployments:
    counters:
      enabled: true
      namespace: swh-cassandra-next-version
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-persistent
            accessModes:
              - ReadWriteOnce
