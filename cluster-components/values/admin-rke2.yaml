clusterName: admin-rke2

# Activate the alertmanager irc relay and expose as an ingress so other clusters can
# relay their alerts through irc as well
alertmanagerIrcRelay:
  enabled: true
  ingress:
    enabled: true
    tls:
      clusterIssuer: letsencrypt-production

alertmanagerConfig:
  enabled: true

metallb:
  enabled: true
  ipAddressPools:
    - suffixName: nginx
      ip: 192.168.50.139/32
      serviceAllocation:
        namespaces:
          - ingress-nginx
    - suffixName: sccache
      ip: 192.168.50.138/32
      serviceAllocation:
        namespaces:
          - sccache

blackboxExporter:
  enabled: true

podPriority:
  enabled: true

dockerCache:
  enabled: true
  ingress:
    hosts:
      - docker-cache.admin.swh.network
      - docker-cache.internal.admin.swh.network
    tls:
      enabled: true
      clusterIssuer: letsencrypt-production
  imageName: registry
  imageVersion: "3.0.0"
  imagePullPolicy: IfNotPresent
  storageRequest: 40Gi
  storageClassName: ceph-rbd
  instances:
    docker.io:
      enabled: true
      remoteUrl: https://registry-1.docker.io
      authenticationSecretRef: dockerhub-authentication
      userKeyRef: username
      passwordKeyRef: password
    swh:
      enabled: true
      remoteUrl: https://container-registry.softwareheritage.org
    registry.k8s.io:
      enabled: true
      storageRequest: 10Gi
    quay.io:
      enabled: true
      storageRequest: 20Gi
    ghcr.io:
      enabled: true
      storageRequest: 10Gi

redis:
  enabled: true
  deployments:
    sccache:
      redisExporter:
        enabled: true
      serviceMonitor:
        enabled: true
      externalService:
        enabled: true
        serviceType: LoadBalancer
      redisSecret:
        name: redis-secret
        key: password
      namespace: sccache
      extraConfig:
        enabled: true
        data: |
          # Disable data persistence
          save ""
          appendonly no
          maxmemory 15gb
          maxmemory-policy allkeys-lru
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-persistent
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    # netbox's default 'netbox-kv' redis service expected when valkey is disabled
    # see cluster-configuration/values/admin-rke2.yaml, key netbox.config.valkey.
    netbox-kv:
      enabled: true
      namespace: netbox
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-persistent
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

externalPostgresqlClusters:
  - name: cluster-pg-admin-dali
    password:
      name: cluster-admin-dali-credential
      key: password
    connectionParameters:
      # Use the correct IP or host name for the source database
      host: dali.internal.admin.swh.network
      user: netbox
      port: "5432"

cloudnativePg:
  enabled: true
  # Postgres credentials to setup (can be overridden per instance)
  superUserSecretRef: swh-postgresql-postgres-secret
  backup:
    # 1 week retention for staging
    retention: 7d
    s3Config:
      # path: <bucket-name>/<cluster-name>/<namespace>/<db-name>
      # Note: Don't let the trailing slash in the path configuration, otherwise, backups
      # won't get cleaned up
      # See: https://github.com/EnterpriseDB/barman/issues/944
      path: s3://backup-cnpg/admin-rke2/cnpg
      url: https://minio.admin.swh.network
      secretName: cnpg-minio-secret
      accessKey: MINIO_ACCESS_KEY
      secretKey: MINIO_SECRET_KEY
  deployments:
    db-netbox:
      enabled: true
      instances: 2
      database:
        name: netbox
        secretKeyRef: netbox-postgresql-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        # Run once a day at 10:05pm (UTC)
        schedule: "0 5 10 * * *"

renovate:
  enabled: true
  # Name of the Kubernetes Secret containing sensitive variables
  secretName: renovate-cronjob-secret
  gitlabEndpoint: https://gitlab.softwareheritage.org/api/v4
  cachedir:
    enabled: true
  # Where is stored the centralized renovate configuration
  renovateExtends: "local>swh/infra/sysadm-environment:renovate.json"
  # Repositories to scan for updates
  repositories:
    - swh/infra/swh-apps

volumes:
  enabled: true
  persistentVolumeClaims:
    renovate-cache-pvc:
      enabled: true
      namespace: renovate
      appName: renovate-cache-pvc
      spec:
        storageClassName: local-persistent
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

openbao:
  enabled: true
  period: "0 * * * *"
  verbose: false
  debug: false
  deployments:
    test-staging-rke2:
      url: https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/c-m-hb9j7h5g
      namespacesToManageInOpenbaoClientCluster:
        - cattle-monitoring-system
        - cert-manager
        - cnpg
        - rabbitmq
        - rook-ceph
    archive-staging-rke2:
      url: https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/c-m-9n5h9nrf
      namespacesToManageInOpenbaoClientCluster:
        - cassandra
        - cattle-monitoring-system
        - cert-manager
        - cnpg
        - cnpg-next-version
        - kafkabackup
        - kafka-system
        - metallb
        - osporadar
        - osporadar-test
        - svix-server
        - swh
        - swh-cassandra
        - swh-cassandra-next-version
        - rook-ceph
    archive-production-rke2:
      url: https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/c-m-75xcg59s
      namespacesToManageInOpenbaoClientCluster:
        - cassandra
        - cattle-monitoring-system
        - cert-manager
        - rook-ceph
        - svix-server
        - swh
        - swh-cassandra
        - swh-benchmarks
        - cnpg
    admin-rke2:
      url: https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/c-m-682nvssh
      namespacesToManageInOpenbaoClientCluster:
       - cattle-monitoring-system
       - cert-manager
       - cnpg
       - minio
       - netbox
       - openbao
       - renovate
       - rook-ceph
       - sccache
       - docker-cache
    gitlab-staging:
      url: https://192.168.200.13
      # TODO: import TLS certificates for the client cluster and provision them in the container
      noVerifySSL: true
      namespacesToManageInOpenbaoClientCluster:
       - cert-manager
       - gitlab-runner
       - gitlab-system
       - monitoring
       - cnpg
    gitlab-production:
      url: https://192.168.200.4
      noVerifySSL: true
      namespacesToManageInOpenbaoClientCluster:
       - cert-manager
       - gitlab-runner
       - gitlab-system
       - monitoring
       - cnpg
    rancher:
      url: "https://rancher.euwest.azure.internal.softwareheritage.org/k8s/clusters/local"
      namespacesToManageInOpenbaoClientCluster:
       - cattle-system
       - cert-manager
       - monitoring
       - cnpg
