clusterName: admin-rke2

# Activate the alertmanager irc relay and expose as an ingress so other clusters can
# relay their alerts through irc as well
alertmanagerIrcRelay:
  enabled: true
  ingress:
    enabled: true
    tls:
      clusterIssuer: letsencrypt-production

alertmanagerConfig:
  enabled: true

metallb:
  enabled: true
  ipAddressPools:
    - suffixName: nginx
      ip: 192.168.50.139/32
      serviceAllocation:
        namespaces:
          - ingress-nginx
    - suffixName: sccache
      ip: 192.168.50.138/32
      serviceAllocation:
        namespaces:
          - sccache

blackboxExporter:
  enabled: true

podPriority:
  enabled: true

dockerCache:
  enabled: true
  ingress:
    hosts:
      - docker-cache.admin.swh.network
      - docker-cache.internal.admin.swh.network
    tls:
      enabled: true
      clusterIssuer: letsencrypt-production
  imageName: registry
  imageVersion: "3.0.0"
  imagePullPolicy: IfNotPresent
  storageRequest: 40Gi
  storageClassName: ceph-rbd
  instances:
    docker.io:
      enabled: true
      remoteUrl: https://registry-1.docker.io
    swh:
      enabled: true
      remoteUrl: https://container-registry.softwareheritage.org
    registry.k8s.io:
      enabled: true
      storageRequest: 10Gi
    quay.io:
      enabled: true
      storageRequest: 20Gi
    ghcr.io:
      enabled: true
      storageRequest: 10Gi

redis:
  enabled: true
  deployments:
    sccache:
      redisExporter:
        enabled: true
      serviceMonitor:
        enabled: true
      externalService:
        enabled: true
        serviceType: LoadBalancer
      redisSecret:
        name: redis-secret
        key: password
      namespace: sccache
      extraConfig:
        enabled: true
        data: |
          # Disable data persistence
          save ""
          appendonly no
          maxmemory 15gb
          maxmemory-policy allkeys-lru
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-persistent
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    # netbox's default 'netbox-kv' redis service expected when valkey is disabled
    # see cluster-configuration/values/admin-rke2.yaml, key netbox.config.valkey.
    netbox-kv:
      enabled: true
      namespace: netbox
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-persistent
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

externalPostgresqlClusters:
  - name: cluster-pg-admin-dali
    password:
      name: cluster-admin-dali-credential
      key: password
    connectionParameters:
      # Use the correct IP or host name for the source database
      host: dali.internal.admin.swh.network
      user: netbox
      port: "5432"

cloudnativePg:
  enabled: true
  # Postgres credentials to setup (can be overridden per instance)
  superUserSecretRef: swh-postgresql-postgres-secret
  backup:
    compression: gzip
    # Let's use the new barman plugin
    # It's required for future cnpg version > 1.26
    systemType: plugin
    # 1 week retention for staging
    retention: 7d
    s3Config:
      # path: <bucket-name>/<cluster-name>/<namespace>/<db-name>
      # Note: Don't let the trailing slash in the path configuration, otherwise, backups
      # won't get cleaned up
      # See: https://github.com/EnterpriseDB/barman/issues/944
      path: s3://backup-cnpg/admin-rke2/cnpg
      url: https://minio.admin.swh.network
      secretName: cnpg-minio-secret
      accessKey: MINIO_ACCESS_KEY
      secretKey: MINIO_SECRET_KEY
  deployments:
    db-netbox:
      enabled: true
      instances: 2
      database:
        name: netbox
        secretKeyRef: netbox-postgresql-secret
      externalClustersRef: externalPostgresqlClusters
      initdb:
        enabled: true
        source: cluster-pg-admin-dali
      backup:
        enabled: true
        # Run once a day at 10:05pm (UTC)
        schedule: "0 5 10 * * *"
