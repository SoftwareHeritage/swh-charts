clusterName: archive-production-rke2

podPriority:
  enabled: true

alerting:
  enabled: true
  environment: production

alertmanagerConfig:
  enabled: true

metallb:
  enabled: true
  ipAddressPools:
    - ip: 192.168.100.139/32
    - ip: 192.168.100.138/32
      suffixName: pooler
      serviceAllocation:
        priority: 50
        namespaces:
          - cnpg
        serviceSelectors:
          - matchExpressions:
            - key: app
              operator: In
              values:
                - archive-production-rke2-pgbouncer-pgbouncer

scrapeExternalMetrics:
  enabled: true
  deployments:
    cassandra:
      namespace: cassandra
      metricsName: jmx-exporter
      serviceMonitorName: cassandra-jmx-exporter
      port: 7070
      ips:
        - 192.168.100.181
        - 192.168.100.182
        - 192.168.100.183
        - 192.168.100.184
        - 192.168.100.185
        - 192.168.100.186
        - 192.168.100.187
        - 192.168.100.188
        - 192.168.100.189
        - 192.168.100.190
        - 192.168.100.191
        - 192.168.100.192
        - 192.168.100.193
        - 192.168.100.194
        - 192.168.100.195
        - 192.168.100.196
        - 192.168.100.197
        - 192.168.100.198
        - 192.168.100.199
        - 192.168.100.200
      relabelings:
        # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
        - sourceLabels:
            - __address__
          targetLabel: __address__
          regex: "192.168.100.18(\\d)(.*)"
          replacement: "cassandra0$1.internal.softwareheritage.org$2"
          action: replace
        - sourceLabels:
            - __address__
          targetLabel: __address__
          regex: "192.168.100.19(\\d)(.*)"
          replacement: "cassandra1$1.internal.softwareheritage.org$2"
          action: replace
        - sourceLabels:
            - __address__
          targetLabel: __address__
          regex: "192.168.100.20(\\d)(.*)"
          replacement: "cassandra2$1.internal.softwareheritage.org$2"
          action: replace
    # Integrate the rabbitmq metrics into the cluster. To allow crafting alertmanager
    # alerts. With this, we need to deactivate the prometheus scrapping from pergamon to
    # avoid duplicates (those are not readable from the cluster alertmanager)
    rabbitmq:
      namespace: rabbitmq
      port: 9419
      ips:
        - 192.168.100.104
      relabelings:
        # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
        - sourceLabels:
            - __address__
          targetLabel: __address__
          regex: "192.168.100.104(.*)"
          replacement: "saatchi.internal.softwareheritage.org$1"
          action: replace

svix:
  enabled: true
  deployments:
    svix:
      ingress:
        host: svix.internal.softwareheritage.org
        createTLS: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production-gandi
          kubernetes.io/tls-acme: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        whitelistSourceRange:
          # cluster internal range ip
          - 10.42.0.0/16
          - 10.43.0.0/16
          # admin ip
          - 192.168.50.0/24
      requestedMemory: 1Gi
      requestedCpu: 100m
      redis:
        dsn: redis-svix.svix-server
      postgres:
        dsn: db-swh-svix-rw.cnpg
        cleanupExpiredMessages:
          enabled: true
          # Every day at 1:00 am
          cron: "0 1 * * *"

redis:
  enabled: true
  deployments:
    cassandra-replayers:
      enabled: true
      namespace: redis
      priorityClassName: swh-storages
      serviceMonitor:
        enabled: true
      redisExporter:
        enabled: true
      nodeSelector:
        kubernetes.io/hostname: rancher-node-metal01
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-persistent
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    winery-replay:
      enabled: true
      namespace: redis
      serviceMonitor:
        enabled: true
      redisExporter:
        enabled: true
      nodeSelector:
        kubernetes.io/hostname: rancher-node-metal03
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-persistent
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    svix:
      namespace: svix-server
      labels:
        app: redis-svix
      priorityClassName: swh-storages
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: svix-server
                operator: In
                values:
                - "true"
      serviceMonitor:
        enabled: true
      redisExporter:
        enabled: true
      extraConfig:
        enabled: true
        data: |
          save 60 500
          appendonly yes
          appendfsync everysec
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: ceph-rbd
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    postgresql-replayer:
      enabled: true
      namespace: redis
      priorityClassName: swh-storages
      serviceMonitor:
        enabled: true
      redisExporter:
        enabled: true
      nodeSelector:
        kubernetes.io/hostname: rancher-node-metal01
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-persistent
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

externalPostgresqlClusters:
  - name: cluster-pg-production-albertina
    password:
      name: cluster-production-albertina-postgres-user-credential
      key: password
    connectionParameters:
      # Use the correct IP or host name for the source database
      host: albertina.internal.softwareheritage.org
      user: postgres
      port: "5432"

cloudnativePg:
  enabled: true
  namespace: cnpg
  # Postgres credentials to setup (can be overridden per instance)
  superUserSecretRef: swh-postgresql-postgres-secret
  services:
    # Disable only the "r" service, this will enable the "ro" service
    disabledDefaultServices:
      - "r"
  backup:
    # 2 weeks retention for production
    retention: 14d
    s3Config:
      # path: <bucket-name>/<cluster-name>/<namespace>/<db-name>
      # Note: Don't let the trailing slash in the path configuration, otherwise, backups
      # won't get cleaned up
      # See: https://github.com/EnterpriseDB/barman/issues/944
      path: s3://backup-cnpg/archive-production-rke2/cnpg
      url: https://minio.admin.swh.network
      secretName: cnpg-minio-secret
      accessKey: MINIO_ACCESS_KEY
      secretKey: MINIO_SECRET_KEY
  deployments:
    db-swh-blocking:
      enabled: true
      instances: 3
      database:
        name: swh-blocking
        secretKeyRef: swh-postgresql-swh-blocking-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        # Run once a day at 1am (UTC)
        schedule: "0 0 1 * * *"
    db-swh-masking:
      enabled: true
      instances: 3
      database:
        name: swh-masking
        secretKeyRef: swh-postgresql-swh-masking-secret
      roles:
      - name: swhmailmap
        ensure: present
        comment: read-only user for display_name table
        login: true
        connectionLimit: -1
        passwordSecret:
          name: swh-postgresql-swhmailmap-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        # Run once a day at 1:30am (UTC)
        schedule: "0 30 1 * * *"
    db-swh-vault:
      enabled: true
      instances: 3
      grantGuestAccess: true
      database:
        name: swh-vault
        secretKeyRef: swh-postgresql-swh-vault-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        # Run once a day at 2am (UTC)
        schedule: "0 0 2 * * *"
    db-swh-deposit:
      enabled: true
      instances: 3
      database:
        name: swh-deposit
        secretKeyRef: swh-postgresql-swh-deposit-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        # Run once a day at 2:30am (UTC)
        schedule: "0 30 2 * * *"
    db-swh-web:
      enabled: true
      instances: 3
      database:
        name: swh-web
        secretKeyRef: swh-postgresql-swh-web-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        # Run once a day at 3:30am (UTC)
        schedule: "0 30 3 * * *"
    db-swh-svix:
      enabled: true
      instances: 3
      database:
        name: swh-svix
        secretKeyRef: swh-postgresql-swh-svix-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        retention: 7d
        # Run once a day at 4:30am (UTC)
        schedule: "0 30 4 * * *"
    db-swh-scrubber:
      enabled: true
      instances: 3
      database:
        name: swh-scrubber
        secretKeyRef: swh-postgresql-swh-scrubber-secret
      initdb:
        enabled: true
      backup:
        enabled: true
        retention: 7d
        # Run once a day at 5:30am (UTC)
        schedule: "0 30 5 * * *"
    db-swh-scheduler:
      enabled: true
      instances: 3
      externalClustersRef: externalPostgresqlClusters
      database:
        name: swh-scheduler
        secretKeyRef: swh-postgresql-swh-scheduler-secret
      initdb:
        enabled: true
        source: cluster-pg-production-albertina
      backup:
        enabled: true
        retention: 3d
        # Run once a day at 6:30am (UTC)
        schedule: "0 30 6 * * *"
        extraWalConfiguration:
          archiveAdditionalCommandArgs:
            - "--max-concurrency=2"
          maxParallel: 32
      walStorage:
        storageClass: local-persistent
        size: 4Gi
      extraPostgresqlConfig:
        # Scheduler requires fine tuning regarding its current use
        parameters:
          # Maximum size to let the WAL grow during automatic checkpoints
          max_wal_size: 2GB
          # Shared Caching data setup
          shared_buffers: 8GB
          # Amount of memory allocated for each query
          work_mem: 1GB
          # Amount of memory allocated for maintenance operations (vacuum, etc...)
          maintenance_work_mem: 4GB
