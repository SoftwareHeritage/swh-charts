[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "init-bao-cluster"
version = "0.1.0"
description = "Basic bao cluster approle management"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "hvac==2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "pdbpp",
]
